<title>Aurelle Estates · Homes, Residences & Developments</title>
<meta name="description" content="Aurelle Estates is a fictional real estate agency and developer in Sydney, Los Angeles and Lisbon. Portfolio demo by Organoo Studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Aurelle — "Ivory & Ember". Bright luxury: ivory paper, warm ink, ember orange accents, a night-blue map band. Didone display + clean grotesk. */
:root{
  color-scheme:light;
  --ember:#F2622E; --ember-d:#D84E1C; --ember-soft:#FDE6DC;
  --ink:#1D1A17; --ink-2:#2C2824; --ivory:#F7F2EA; --paper:#FFFDF9; --stone:#E8DFD2; --stone-2:#D9CDBC;
  --night:#15171B; --night-2:#1E2127; --night-3:#2A2E36;
  --fg-2:#4A443D; --muted:#7A7166; --line:#E6DDCF; --line-2:#D6CAB8;
  --ok:#2F8F5B; --bad:#D6453D; --gold:#C9A46A;
  --f-d:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;font-family:var(--f-d);font-weight:400;line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1320px;margin:0 auto;padding-inline:32px}
@media (max-width:640px){.wrap{padding-inline:16px}}
main{overflow-x:clip}
.ph{position:relative;overflow:hidden;background:var(--stone)}
.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lab{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lab.p::before{content:"("}.lab.p::after{content:")"}
em.it,.it{font-style:italic}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 22px;border-radius:999px;border:1px solid var(--ink);background:transparent;font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap;transition:background .25s,color .25s,border-color .25s,transform .15s}
.btn:hover{background:var(--ink);color:var(--ivory)}
.btn:active{transform:scale(.97)}
.btn.ink{background:var(--ink);color:var(--ivory)}
.btn.ink:hover{background:#000}
.btn.em{background:var(--ember);border-color:var(--ember);color:#fff}
.btn.em:hover{background:var(--ember-d);border-color:var(--ember-d)}
.btn.lt{border-color:var(--line-2)}
.btn.lt:hover{border-color:var(--ink)}
.btn.wh{background:#fff;border-color:#fff;color:var(--ink)}
.btn.wh:hover{background:var(--ember);border-color:var(--ember);color:#fff}
.btn.gl{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff;backdrop-filter:blur(10px)}
.btn.gl:hover{background:#fff;color:var(--ink)}
.btn.sm{height:36px;padding:0 15px;font-size:13px}
.btn.lg{height:54px;padding:0 28px;font-size:15.5px}
.btn .go{width:28px;height:28px;border-radius:50%;background:var(--ember);color:#fff;display:grid;place-items:center;margin-right:-12px;transition:transform .3s var(--ease)}
.btn.em .go{background:#fff;color:var(--ember)}
.btn:hover .go{transform:rotate(-45deg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.circ{width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;transition:all .2s;flex:none}
.circ:hover{border-color:var(--ink)}
.circ.on{background:var(--ember);border-color:var(--ember);color:#fff}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);font-weight:600;font-size:13.5px;transition:all .2s;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ivory)}
.input,.sel{width:100%;height:48px;padding:0 16px;border:1px solid var(--line-2);border-radius:12px;background:var(--paper);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:96px;padding:12px 16px;resize:vertical}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.input:focus,.sel:focus{border-color:var(--ink);box-shadow:0 0 0 4px var(--ember-soft)}
.input.err,.sel.err{border-color:var(--bad)}
.field{display:grid;gap:6px}
.field label,.field .fl{font-size:13px;font-weight:600;color:var(--fg-2)}
.err-t{font-size:13px;color:var(--bad);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.92);color:var(--ink)}
.tag.em{background:var(--ember);color:#fff}
.tag.dk{background:var(--ink);color:#fff}
.tag.st{background:var(--stone)}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;transition:all .4s var(--ease)}
.nav .bar{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:18px 32px;transition:all .4s var(--ease)}
.nav.onhero:not(.small){color:#fff}
.nav.small .bar{margin-top:10px;max-width:1260px;padding:8px 8px 8px 22px;background:rgba(255,253,249,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;box-shadow:0 18px 40px -30px rgba(0,0,0,.45)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:26px}
.logo b{font-family:var(--f-d);font-size:28px;font-weight:500;letter-spacing:-.01em;line-height:1}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--ember);display:inline-block}
.nl{display:flex;gap:4px}
.nl a{padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:500;font-size:14.5px;opacity:.85;transition:all .2s}
.nl a:hover{opacity:1;background:rgba(127,127,127,.12)}
.nl a[aria-current="page"]{opacity:1;background:var(--ink);color:var(--ivory)}
.nav .sp{flex:1}
.nav .ib{height:42px;min-width:42px;padding:0 12px;border-radius:999px;border:1px solid currentColor;border-color:rgba(127,127,127,.35);background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:600;font-size:13.5px;position:relative}
.nav .ib .n{min-width:18px;height:18px;border-radius:999px;background:var(--ember);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.nav select.cur{height:42px;border-radius:999px;border:1px solid rgba(127,127,127,.35);background:transparent;padding:0 30px 0 14px;font-weight:600;font-size:13px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.nav select.cur option{color:var(--ink)}
.nav .btn.bk{margin-left:6px}
.nav.onhero:not(.small) .btn.bk{background:#fff;color:var(--ink);border-color:#fff}
.burger{display:none!important}
.mm{display:none}
@media (max-width:1080px){
  .nl,.nav .btn.bk,.nav select.cur{display:none}.burger{display:flex!important}
  .mm.open{display:grid;gap:6px;position:fixed;top:76px;left:14px;right:14px;z-index:55;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5);animation:pop .3s var(--ease)}
  .mm a{padding:14px 16px;border-radius:14px;text-decoration:none;font-weight:600;background:var(--ivory)}
  .mm .sel{height:46px}
  .nav .bar{padding:12px 16px}.nav.small .bar{margin-inline:10px;padding:7px 7px 7px 16px}
}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.pad-top{padding-top:96px}

/* reveals */
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:var(--dl,0s)}
.rv.in{opacity:1;transform:none}
.rv.cl{opacity:1;transform:none}
.rv.cl>.ph{clip-path:inset(0 0 100% 0);transition:clip-path 1.3s var(--ease)}
.rv.cl.in>.ph{clip-path:inset(0 0 0 0)}
.rv.cl .ph>img{transform:scale(1.2);transition:transform 1.8s var(--ease)}
.rv.cl.in .ph>img{transform:scale(1)}
.lines .l{display:block;overflow:hidden}
.lines .l>span{display:inline-block;transform:translateY(105%);transition:transform 1.1s var(--ease);transition-delay:calc(var(--i)*.09s)}
.lines.in .l>span{transform:none}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* ===== HERO ===== */
.hero{height:170vh;position:relative}
.hero-st{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:flex-end}
.hero-img{position:absolute;inset:0;will-change:transform,border-radius;overflow:hidden;background:var(--night);transform-origin:center 60%}
.hero-img .ph{position:absolute;inset:0;background:var(--night)}
.hero-img .ph img{animation:kb 18s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.05) 55%,rgba(0,0,0,.55) 100%)}
@media (max-width:700px){.hero-img::after{background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.1) 22%,rgba(0,0,0,.45) 45%,rgba(0,0,0,.7) 100%)}}
.hero-in{position:relative;z-index:2;width:100%;color:#fff;padding-bottom:34px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.wordmark{font-family:var(--f-d);font-weight:400;font-size:clamp(90px,17vw,280px);line-height:.78;letter-spacing:-.045em;margin:0}
.wordmark span{display:inline-block;animation:wm 1.4s var(--ease) both;animation-delay:calc(var(--i)*.06s + .2s)}
@keyframes wm{from{transform:translateY(40%);opacity:0;filter:blur(8px)}}
.hero-side{max-width:340px;padding-bottom:26px;animation:rise 1s .8s both}
.hero-side .lab{color:rgba(255,255,255,.8)}
.hero-side p{margin-top:12px;font-size:15px;opacity:.92}
.srch{margin-top:26px;display:grid;grid-template-columns:auto 1.2fr 1fr 1fr auto;gap:0;align-items:center;background:rgba(255,253,249,.96);color:var(--ink);border-radius:22px;padding:8px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);animation:rise 1s 1s both}
.srch .tabs{display:flex;gap:2px;padding:4px;background:var(--ivory);border-radius:15px}
.srch .tabs button{height:44px;padding:0 16px;border-radius:12px;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--fg-2)}
.srch .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--ivory)}
.srch .f{padding:4px 18px;border-left:1px solid var(--line);display:grid;gap:0}
.srch .f:nth-child(2){border-left:0}
.srch .f label{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.srch .f select{border:0;background:transparent;font-weight:600;font-size:15px;padding:2px 0;outline:none;appearance:none;cursor:pointer}
.fcard{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:18px;background:rgba(255,253,249,.94);color:var(--ink);box-shadow:0 20px 40px -24px rgba(0,0,0,.6);text-decoration:none;animation:fIn 1s var(--d,1.2s) var(--ease) both;transition:transform .3s}
.fcard:hover{transform:translateY(-4px)}
.fcard .ph{width:54px;height:54px;border-radius:12px}
.fcard b{display:block;font-size:15px}
.fcard span{font-size:12px;color:var(--muted)}
.fcard::after{content:"";position:absolute;left:24px;bottom:-7px;width:14px;height:14px;background:inherit;transform:rotate(45deg);border-radius:3px}
@keyframes fIn{from{opacity:0;transform:translateY(16px) scale(.94)}}
.scroll-cue{position:absolute;right:32px;top:50%;z-index:3;color:#fff;writing-mode:vertical-rl;font-size:12px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.scroll-cue::after{content:"";width:1px;height:60px;background:rgba(255,255,255,.6);animation:cue 2s infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media (max-width:980px){.hero{height:auto}.hero-st{position:relative;height:auto;min-height:100svh}.hero-top{flex-direction:column;align-items:flex-start}.srch{grid-template-columns:1fr 1fr}.srch .tabs{grid-column:1/-1}.srch .f{border-left:0;border-top:1px solid var(--line);padding:10px 12px}.srch .btn{grid-column:1/-1;margin-top:6px}.fcard{display:none}.scroll-cue{display:none}.hero-in{padding-top:120px}}

/* intro */
section.s{padding-block:120px 0}
.intro{display:grid;grid-template-columns:1.3fr 1fr;gap:60px;align-items:end}
.big-p{font-family:var(--f-d);font-size:clamp(30px,3.4vw,52px);line-height:1.12;letter-spacing:-.015em;color:#A89E91}
.big-p b{font-weight:400;color:var(--ink)}
.big-p em{color:var(--ember)}
.orbs{display:flex;align-items:center;gap:0;margin-top:34px}
.orbs .ph{width:160px;height:160px;border-radius:50%;border:5px solid var(--ivory)}
.orbs .ph+.ph{margin-left:-30px}
.orbs .pill{margin-left:-40px;z-index:2;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;align-self:flex-end}
.intro .side p{color:var(--fg-2)}
@media (max-width:900px){.intro{grid-template-columns:1fr}.orbs .ph{width:110px;height:110px}}

/* listing cards */
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:34px}
.sh h2{font-size:clamp(40px,5vw,78px);letter-spacing:-.025em;margin-top:14px;max-width:14ch}
.sh h2 em{font-style:italic;color:var(--ember)}
.sh p{max-width:40ch;color:var(--fg-2)}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.lc{display:grid;gap:12px;position:relative;animation:rise .6s var(--d,0s) var(--ease) both}
.lc .img{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3;display:block}
.lc .img .ph{position:absolute;inset:0;transition:opacity .5s}
.lc .img .ph img{transition:transform 1.2s var(--ease)}
.lc:hover .img .ph img{transform:scale(1.06)}
.lc .img .ph.b{opacity:0}
.lc .cover{position:absolute;inset:0;z-index:1}
.lc:hover .img .ph.b{opacity:1}
.lc .tags{position:absolute;left:12px;top:12px;display:flex;gap:6px;z-index:2;flex-wrap:wrap}
.lc .acts{position:absolute;right:12px;top:12px;display:flex;gap:6px;z-index:2}
.lc .acts .circ{width:38px;height:38px;background:rgba(255,255,255,.92);border:0}
.lc .acts .circ.on{background:var(--ember);color:#fff}
.lc .acts .circ.on svg{fill:currentColor}
.lc .pr{position:absolute;left:12px;bottom:12px;z-index:2;background:rgba(29,26,23,.82);color:#fff;border-radius:12px;padding:6px 12px;font-weight:600;font-size:15px;backdrop-filter:blur(6px)}
.lc .meta{display:grid;gap:4px}
.lc h3{font-size:24px;letter-spacing:-.01em}
.lc h3 a{text-decoration:none}
.lc .loc{font-size:14px;color:var(--muted)}
.lc .facts{display:flex;gap:14px;font-size:13.5px;color:var(--fg-2);flex-wrap:wrap}
.lc .facts span{display:flex;gap:6px;align-items:center}
.lc.hl .img{box-shadow:0 0 0 3px var(--ember)}
@media (max-width:1000px){.lgrid{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.lgrid{grid-template-columns:1fr}}
.feat-tabs{display:flex;gap:6px;flex-wrap:wrap}

/* project showcase (pinned) */
.pj{position:relative;margin-top:130px;background:var(--night);color:#F2ECE3}
.pj-st{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:center}
.pj-head{position:absolute;top:34px;left:0;right:0;z-index:4}
.pj-head .wrap{display:flex;justify-content:space-between;align-items:center}
.pj-head .lab{color:#B9B0A3}
.pj-dots{display:flex;gap:14px;font-size:13px;color:#8C857B}
.pj-dots b{color:#fff;font-weight:600}
.pj-title{position:relative;z-index:3;text-align:center;font-family:var(--f-d);font-size:clamp(46px,7vw,112px);line-height:.95;letter-spacing:-.02em;text-transform:uppercase;pointer-events:none}
.pj-title .t{display:block;transition:opacity .6s,transform .8s var(--ease),filter .6s}
.pj-title .t.out{opacity:0;transform:translateY(-30px);filter:blur(6px);position:absolute;inset:0}
.pj-title .t.nx{opacity:0;transform:translateY(30px);filter:blur(6px);position:absolute;inset:0}
.pj-imgs .ph{position:absolute;border-radius:6px;transition:opacity .8s,transform 1.2s var(--ease)}
.pj-imgs .i1{left:6%;top:24%;width:18vw;height:36vh}
.pj-imgs .i2{left:50%;top:50%;width:26vw;height:46vh;translate:-50% -50%}
.pj-imgs .i3{right:6%;top:30%;width:17vw;height:40vh}
.pj-imgs .ph.out{opacity:0;transform:scale(.92)}
.pj-foot{position:absolute;bottom:34px;left:0;right:0;z-index:4}
.pj-foot .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.pj-foot p{max-width:40ch;font-size:14.5px;color:#C9C1B5}
.pj-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--ember);transform-origin:left;z-index:5}
@media (max-width:900px){.pj{height:auto!important}.pj-st{position:relative;height:auto;display:block;padding:80px 0}.pj-imgs,.pj-title,.pj-head,.pj-foot{display:none}.pj-mob{display:grid!important}}
.pj-mob{display:none;gap:22px;padding:0 16px}
.pj-mob a{text-decoration:none;display:grid;gap:10px}
.pj-mob .ph{height:280px;border-radius:18px}
.pj-mob h3{font-size:34px;text-transform:uppercase}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;border-top:1px solid var(--line-2);padding-top:34px}
.stats b{font-family:var(--f-d);font-size:clamp(56px,6vw,96px);font-weight:400;line-height:.9;letter-spacing:-.03em;display:block}
.stats b sup{font-size:.4em;vertical-align:top;margin-left:4px;color:var(--ember)}
.stats b>span{display:inline}
.stats>div>span{display:block;font-size:14px;color:var(--muted);margin-top:12px;max-width:22ch}
@media (max-width:800px){.stats{grid-template-columns:1fr 1fr}}

/* map band */
.mapband{margin:130px 14px 0;border-radius:36px;background:var(--night);color:#F2ECE3;padding:70px 0 40px;overflow:hidden;position:relative}
.mapband .sh h2{color:#fff}
.mapband .sh p{color:#B9B0A3}
.mapband .lab{color:#B9B0A3}
.mapband .chip{background:transparent;border-color:#3A3F48;color:#E6DED2}
.mapband .chip[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
.map{position:relative;overflow:hidden;border-radius:26px;touch-action:none;cursor:grab;user-select:none}
.map:active{cursor:grabbing}
.map .lyr{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.map .lyr svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%) scale(var(--ps,1));transform-origin:50% 100%;z-index:2;border:0;background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 11px;font-weight:700;font-size:12.5px;box-shadow:0 8px 20px -8px rgba(0,0,0,.55);white-space:nowrap;animation:pinIn .6s var(--d,0s) var(--ease) both;transition:background .2s,color .2s}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:inherit;transform:rotate(45deg);border-radius:2px;z-index:-1}
.pin:hover,.pin.hl,.pin.on{background:var(--ember);color:#fff;z-index:5}
@keyframes pinIn{from{opacity:0;transform:translate(-50%,-160%) scale(var(--ps,1))}}
.map .ctl{position:absolute;right:14px;top:14px;display:grid;gap:6px;z-index:6}
.map .ctl button{width:40px;height:40px;border-radius:12px;border:0;background:var(--paper);box-shadow:0 8px 20px -10px rgba(0,0,0,.5);font-size:20px;font-weight:600;display:grid;place-items:center}
.map .note{position:absolute;left:14px;bottom:12px;z-index:6;font-size:11.5px;color:#9A9285;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:999px}
.map.lt .note{color:var(--muted);background:rgba(255,255,255,.7)}
.mcard{position:absolute;z-index:8;width:270px;background:var(--paper);color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:pop .3s var(--ease);text-decoration:none;display:block}
.mcard .ph{height:140px}
.mcard .b{padding:12px 14px}
.mcard b{font-family:var(--f-d);font-size:20px;display:block}
.mcard span{font-size:13px;color:var(--muted)}
.mcard .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.9);display:grid;place-items:center;z-index:2}
.mb-grid{display:grid;grid-template-columns:1fr 340px;gap:16px}
.mb-list{display:grid;gap:10px;max-height:560px;overflow:auto;padding-right:4px}
.mb-it{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center;padding:8px;border-radius:16px;background:var(--night-2);text-decoration:none;border:1px solid transparent;transition:border-color .2s,background .2s}
.mb-it:hover,.mb-it.hl{border-color:var(--ember);background:var(--night-3)}
.mb-it .ph{height:70px;border-radius:12px}
.mb-it b{font-family:var(--f-d);font-size:18px;font-weight:400;display:block}
.mb-it span{font-size:12.5px;color:#9A9285}
@media (max-width:980px){.mb-grid{grid-template-columns:1fr}.mb-list{max-height:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto}.mapband{border-radius:26px;margin-inline:8px}}

/* journey */
.jr{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.jr-img{border-radius:30px;position:relative;min-height:640px;overflow:hidden}
.jr-img .ph{position:absolute;inset:0}
.jr-card{position:absolute;z-index:2;width:250px;background:rgba(255,253,249,.95);border-radius:18px;padding:16px;box-shadow:0 24px 50px -24px rgba(0,0,0,.6);transform:rotate(var(--r,0deg));transition:transform .4s}
.jr-card:hover{transform:rotate(0) translateY(-4px)}
.jr-card b{display:block;font-family:var(--f-d);font-size:21px}
.jr-card p{font-size:13.5px;color:var(--fg-2);margin-top:6px}
.jr-card.em{background:var(--ember);color:#fff}
.jr-card.em p{color:#FFE8DF}
.steps{display:grid;gap:10px;align-content:center}
.stp{display:grid;grid-template-columns:60px 1fr;gap:16px;padding:22px;border-radius:24px;background:var(--paper);border:1px solid var(--line);transition:transform .4s var(--ease),border-color .3s}
.stp:hover{transform:translateX(8px);border-color:var(--ink)}
.stp .n{font-family:var(--f-d);font-size:44px;line-height:1;color:var(--ember)}
.stp b{font-family:var(--f-d);font-size:26px;font-weight:400}
.stp p{color:var(--fg-2);font-size:14.5px;margin-top:4px}
@media (max-width:900px){.jr{grid-template-columns:1fr}.jr-img{min-height:460px}}

/* valuation teaser */
.val{display:grid;grid-template-columns:1.1fr 1fr;border-radius:32px;overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.val .ph{min-height:460px}
.val .in{padding:44px;display:grid;gap:16px;align-content:center}
.val h2{font-size:clamp(36px,4vw,58px)}
.val h2 em{color:var(--ember)}
@media (max-width:900px){.val{grid-template-columns:1fr}.val .ph{min-height:260px}.val .in{padding:24px}}

/* agents */
.ag{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.agc{border:0;padding:0;background:none;text-align:left;display:grid;gap:10px;animation:rise .6s var(--d,0s) var(--ease) both}
.agc .ph{aspect-ratio:3/4;border-radius:20px}
.agc .ph img{filter:grayscale(.9);transition:filter .6s,transform 1s var(--ease)}
.agc:hover .ph img{filter:none;transform:scale(1.04)}
.agc b{font-family:var(--f-d);font-size:22px;font-weight:400;display:block}
.agc span{font-size:13.5px;color:var(--muted)}
@media (max-width:900px){.ag{grid-template-columns:1fr 1fr}}

/* footer */
footer.f{margin-top:130px;background:var(--paper);border-top:1px solid var(--line);padding:60px 0 26px;overflow:hidden}
.fwm{display:flex;align-items:center;gap:2vw;font-family:var(--f-d);font-size:clamp(90px,19vw,300px);line-height:.8;letter-spacing:-.05em;white-space:nowrap}
.fwm .pl{width:18vw;height:.62em;border-radius:999px;overflow:hidden;position:relative;flex:none;top:.04em}
.fg{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1.4fr;gap:30px;margin-top:50px}
.fg h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:600}
.fg a{display:block;padding:4px 0;text-decoration:none;font-size:14.5px}
.fg a:hover{color:var(--ember)}
.nlf{display:flex;gap:8px;margin-top:12px}
.fbot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-top:40px;font-size:13px;color:var(--muted)}
@media (max-width:900px){.fg{grid-template-columns:1fr 1fr}.fg>div:first-child,.fg>div:last-child{grid-column:1/-1}}

/* ===== listings page ===== */
.ph-h{padding:120px 0 20px}
.crumbs{display:flex;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
.crumbs a{text-decoration:none}
.ph-h h1{font-size:clamp(48px,7vw,110px);letter-spacing:-.03em;margin-top:14px}
.ph-h h1 em{font-style:italic;color:var(--ember)}
.ph-h p{max-width:56ch;color:var(--fg-2);margin-top:14px;font-size:17px}
.lp{display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.flt{position:sticky;top:92px;display:grid;gap:18px;padding:22px;border-radius:24px;background:var(--paper);border:1px solid var(--line);max-height:calc(100vh - 110px);overflow:auto}
.flt h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.seg{display:inline-grid;grid-auto-flow:column;gap:3px;padding:3px;border-radius:14px;background:var(--ivory)}
.seg button{height:38px;padding:0 14px;border:0;border-radius:11px;background:transparent;font-weight:600;font-size:13.5px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ivory)}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{height:34px;padding:0 12px;font-size:13px}
.ck{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 0;cursor:pointer}
.ck input{accent-color:var(--ember);width:17px;height:17px}
.dual{position:relative;height:32px}
.dual input[type=range]{position:absolute;inset:0;width:100%;pointer-events:none;-webkit-appearance:none;appearance:none;background:none;height:32px}
.dual input[type=range]::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);cursor:grab;position:relative;z-index:2}
.dual input[type=range]::-moz-range-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);cursor:grab}
.dual .tr{position:absolute;left:0;right:0;top:14px;height:4px;border-radius:9px;background:var(--line)}
.dual .tr i{position:absolute;top:0;bottom:0;background:var(--ember);border-radius:9px}
.dual-v{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
.rbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.rbar .sel{width:auto;height:42px;border-radius:999px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.split .lgrid{grid-template-columns:1fr}
.split .lc .img{aspect-ratio:16/10}

.flt>*{min-width:0}
.flt .seg button{padding:0 4px}
.split .mapw{position:sticky;top:92px;height:calc(100vh - 110px)}
.mapw .map{height:100%}
.onlymap .mapw{height:72vh}
.empty{padding:60px 20px;text-align:center;border-radius:24px;border:1px dashed var(--line-2)}
.cmp-tray{position:fixed;left:50%;bottom:16px;translate:-50% 0;z-index:60;display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 18px;box-shadow:0 20px 40px -16px rgba(0,0,0,.6);animation:rise .4s var(--ease)}
.cmp-tray .ph{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink)}
.cmp-tray .ph+.ph{margin-left:-12px}
@media (max-width:1080px){.lp{grid-template-columns:1fr}.flt{position:static;max-height:none}.split{grid-template-columns:1fr}.split .mapw{position:relative;top:0;height:420px}}
.fbtn{display:none}
@media (max-width:1080px){.fbtn{display:inline-flex}.flt.closed{display:none}}

/* property page */
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:260px 260px;gap:10px;border-radius:26px;overflow:hidden;margin-top:24px}
.gal button{border:0;padding:0;position:relative;overflow:hidden;background:var(--stone)}
.gal button .ph{position:absolute;inset:0}
.gal button .ph img{transition:transform 1s var(--ease)}
.gal button:hover .ph img{transform:scale(1.05)}
.gal button:first-child{grid-row:span 2}
.gal .more{position:absolute;right:12px;bottom:12px;z-index:2}
@media (max-width:800px){.gal{grid-template-columns:1fr 1fr;grid-template-rows:260px 140px}.gal button:first-child{grid-column:span 2;grid-row:auto}.gal button:nth-child(n+4){display:none}}
.pd{display:grid;grid-template-columns:1fr 380px;gap:44px;margin-top:34px;align-items:start}
.pd-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.pd-h h1{font-size:clamp(40px,4.6vw,68px);letter-spacing:-.02em}
.pd-h .pr{font-family:var(--f-d);font-size:clamp(34px,3.4vw,48px);text-align:right}
.kf{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);margin:26px 0}
.kf div{padding:16px 0;border-right:1px solid var(--line)}
.kf div:last-child{border:0}
.kf b{font-family:var(--f-d);font-size:30px;font-weight:400;display:block;line-height:1}
.kf span{font-size:12.5px;color:var(--muted)}
@media (max-width:700px){.kf{grid-template-columns:repeat(3,1fr)}.kf div:nth-child(3){border-right:0}}
.pd h2{font-size:34px;margin:40px 0 14px}
.pd .body p{color:var(--fg-2);font-size:17px;margin-bottom:12px}
.amen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.amen div{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line);font-size:14.5px}
.amen svg{color:var(--ember)}
@media (max-width:700px){.amen{grid-template-columns:1fr 1fr}}
.fp{border-radius:22px;background:var(--paper);border:1px solid var(--line);padding:18px}
.fp svg{width:100%;height:auto}
.fp text{font-family:var(--f-ui);font-size:11px;fill:var(--fg-2)}
.poi{display:grid;gap:6px;margin-top:12px}
.poi div{display:flex;justify-content:space-between;font-size:14.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.mort{display:grid;grid-template-columns:1fr 220px;gap:26px;align-items:center;border-radius:24px;background:var(--paper);border:1px solid var(--line);padding:24px}
.mort .rows{display:grid;gap:14px}
.rg .t{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;color:var(--fg-2)}
.rg .t b{color:var(--ink)}
input[type=range].r{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:9px;background:linear-gradient(90deg,var(--ink) var(--p,50%),var(--line) var(--p,50%));margin-top:10px}
input[type=range].r::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);cursor:grab}
input[type=range].r::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.donut{position:relative;width:200px;height:200px}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{font-family:var(--f-d);font-size:30px;font-weight:400;display:block;line-height:1}
.donut .c span{font-size:12px;color:var(--muted)}
.lg2{display:flex;gap:14px;font-size:12.5px;margin-top:8px;justify-content:center}
.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:700px){.mort{grid-template-columns:1fr;justify-items:center}}
.side{position:sticky;top:92px;display:grid;gap:14px}
.agent-box{border-radius:24px;background:var(--paper);border:1px solid var(--line);padding:20px;display:grid;gap:14px}
.agent-box .who{display:flex;gap:12px;align-items:center}
.agent-box .who .ph{width:58px;height:58px;border-radius:50%}
.agent-box .who b{display:block;font-family:var(--f-d);font-size:20px;font-weight:400}
.agent-box .who span{font-size:13px;color:var(--muted)}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:64px;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.days button{height:68px;border-radius:14px;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;align-content:center;gap:0;font-size:12px;color:var(--muted);line-height:1.2}
.days button b{font-family:var(--f-d);font-size:22px;color:var(--ink);font-weight:400}
.days button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#C9C1B5}
.days button[aria-pressed="true"] b{color:#fff}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.times button{height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--paper);font-weight:600;font-size:13px}
.times button[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#fff}
.times button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
@media (max-width:1000px){.pd{grid-template-columns:1fr}.side{position:static}}

/* development */
.dv-hero{position:relative;height:88vh;min-height:560px;border-radius:0 0 36px 36px;overflow:hidden;color:#fff;display:flex;align-items:flex-end}
.dv-hero .ph{position:absolute;inset:0}
.dv-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 35%,rgba(0,0,0,.65))}
.dv-hero .in{position:relative;z-index:2;padding-bottom:44px;width:100%}
.dv-hero h1{font-size:clamp(56px,9vw,150px);text-transform:uppercase;letter-spacing:-.02em;line-height:.9}
.dv-facts{display:flex;gap:40px;flex-wrap:wrap;margin-top:22px}
.dv-facts b{font-family:var(--f-d);font-size:36px;font-weight:400;display:block;line-height:1}
.dv-facts span{font-size:13px;opacity:.85}
.avail{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
.stack{border-radius:26px;background:var(--paper);border:1px solid var(--line);padding:22px}
.bld{display:grid;gap:5px}
.fl{display:grid;grid-template-columns:48px repeat(var(--u),1fr);gap:5px;align-items:center}
.fl .lv{font-size:12px;color:var(--muted);font-weight:600}
.un{height:38px;border-radius:8px;border:1px solid transparent;font-size:11.5px;font-weight:600;transition:transform .15s,box-shadow .15s}
.un.av{background:var(--ember-soft);color:#9A3A12;border-color:#F6C4AE}
.un.rs{background:var(--stone);color:var(--muted)}
.un.sd{background:#EFEAE2;color:#B7AE9F;text-decoration:line-through}
.un.av:hover{transform:scale(1.06);box-shadow:0 6px 14px -8px rgba(0,0,0,.4)}
.un[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--fg-2);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.ucard{position:sticky;top:92px;border-radius:26px;background:var(--paper);border:1px solid var(--line);padding:22px;display:grid;gap:12px}
.ucard h3{font-size:32px}
.dv-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dv-gal .ph{height:320px;border-radius:20px}
.dv-gal .ph:nth-child(2){height:420px;margin-top:-50px}
@media (max-width:1000px){.avail{grid-template-columns:1fr}.ucard{position:static}.dv-gal{grid-template-columns:1fr 1fr}.dv-gal .ph:nth-child(2){margin-top:0;height:320px}}

/* modal, lightbox, toast */
.mdl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(21,23,27,.55);backdrop-filter:blur(6px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.mdl .bx{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:28px;background:var(--paper);padding:28px;display:grid;gap:14px;position:relative;animation:pop .35s var(--ease)}
.mdl .bx.wide{width:min(980px,100%)}
.mdl .x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--ivory);display:grid;place-items:center;z-index:2}
.mdl h3{font-size:34px;padding-right:44px}
.lbx{position:fixed;inset:0;z-index:90;background:rgba(10,10,12,.94);display:grid;grid-template-rows:auto 1fr auto;animation:fade .25s;color:#fff}
.lbx .top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.lbx .stage{position:relative;display:grid;place-items:center;padding:0 70px;min-height:0}
.lbx .stage img{max-width:100%;max-height:78vh;border-radius:8px;object-fit:contain;animation:fade .3s}
.lbx .nv{position:absolute;top:50%;translate:0 -50%;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;display:grid;place-items:center}
.lbx .nv.p{left:12px}.lbx .nv.n{right:12px}
.lbx .th{display:flex;gap:8px;justify-content:center;padding:14px;overflow-x:auto}
.lbx .th button{width:78px;height:54px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;opacity:.55;flex:none;position:relative}
.lbx .th button[aria-current="true"]{border-color:var(--ember);opacity:1}
.lbx .th .ph{position:absolute;inset:0}
.cmp{width:100%;border-collapse:collapse;font-size:14.5px}
.cmp th,.cmp td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;width:150px}
.cmp td .ph{height:120px;border-radius:12px}
.cmp .best{color:var(--ok);font-weight:700}
#toasts{position:fixed;right:16px;bottom:16px;z-index:95;display:grid;gap:8px}
.toast{background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);animation:pop .3s var(--ease)}
.toast svg{color:var(--ember)}
.demo{position:fixed;left:14px;bottom:14px;z-index:40;display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 14px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;font-weight:600}
.demo button{width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center}
@media (max-width:640px){.demo .x3{display:none}}
.card{border-radius:24px;background:var(--paper);border:1px solid var(--line);padding:22px}
.rowi{display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;background:var(--paper);border:1px solid var(--line);flex-wrap:wrap}
.rowi .ph{width:90px;height:66px;border-radius:12px;flex:none}
.rowi .g{flex:1;min-width:180px}
.rowi b{font-family:var(--f-d);font-size:20px;font-weight:400;display:block}
.est{border-radius:26px;background:var(--night);color:#fff;padding:30px;display:grid;gap:14px}
.est .rng{font-family:var(--f-d);font-size:clamp(40px,5vw,70px);line-height:1}
.est .bar{height:10px;border-radius:9px;background:linear-gradient(90deg,#3A3F48,var(--ember),#3A3F48);position:relative}
.est .bar i{position:absolute;top:-6px;width:4px;height:22px;background:#fff;border-radius:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv,.lines .l>span,.rv.cl>.ph{opacity:1;transform:none;clip-path:none}}
</style>
