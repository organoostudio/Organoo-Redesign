<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tandem AI CRM</title>
<meta name="description" content="Tandem — the AI-native CRM for studios and B2B service teams. Demo project by Organoo Studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<script>document.documentElement.setAttribute("data-ui","light")</script>
<style>
/* Layout: airy mint-white ground; everything lives on one floating white "sheet" with a pill nav (LoopAI layout, Friendly Teal palette). Landing uses the same sheet language at larger scale. */
:root{
  /* Friendly Teal: primary #00B8A9, secondary #3D5AFE, CTA coral #FF6B6B */
  --bg:#F3FCFB; --bg-2:#FAFFFE; --sheet:#FFFFFF; --panel:#F6FBFB; --panel-2:#E7F5F4; --line:#DCEEED; --line-2:#C8E2E0;
  --fg:#0F2B2E; --fg-2:#294548; --muted:#587377; --faint:#93AAAD;
  --accent:#00B8A9; --accent-2:#16C7B8; --accent-soft:#DDF6F3; --accent-fg:#FFFFFF;
  --sec:#3D5AFE; --sec-soft:#E7EBFF; --cta:#FF6B6B; --cta-2:#FF8585; --cta-fg:#FFFFFF;
  --mint:#00B8A9; --mint-2:#00998D; --mint-soft:#DDF6F3; --lav:#B9C4FF; --dot-off:#E4F1F0;
  --good:#12A36A; --good-soft:#E0F6EC; --bad:#E0364F; --bad-soft:#FDE6EA; --warn:#C27800; --warn-soft:#FFF1D1; --info:#3D5AFE; --info-soft:#E7EBFF;
  --shadow:0 1px 2px rgba(15,43,46,.05),0 18px 50px -24px rgba(0,110,100,.28);
  --ink:#0F2B2E; --ink-fg:#FFFFFF;
  --f-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-serif:"Instrument Serif",ui-serif,Georgia,"Times New Roman",serif;
}
:root[data-ui="dark"]{
  --bg:#061A1C; --bg-2:#0A2326; --sheet:#0D2225; --panel:#11292C; --panel-2:#173236; --line:#1C393C; --line-2:#294C50;
  --fg:#E8F7F6; --fg-2:#C3DCDC; --muted:#8BA7AA; --faint:#5B7678;
  --accent:#1ED3C3; --accent-2:#4DE0D3; --accent-soft:#0E3A38; --accent-fg:#04201E;
  --sec:#7189FF; --sec-soft:#1B2552; --cta:#FF7F7F; --cta-2:#FF9999; --cta-fg:#2A0B0B;
  --mint:#1ED3C3; --mint-2:#4DE0D3; --mint-soft:#0E3A38; --lav:#34489C; --dot-off:#163034;
  --good:#46D492; --good-soft:#12352A; --bad:#FF7285; --bad-soft:#3B1720; --warn:#F2B347; --warn-soft:#33270E; --info:#7189FF; --info-soft:#1B2552;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 50px -24px rgba(0,0,0,.7);
  --ink:#E8F7F6; --ink-fg:#061A1C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;background-image:radial-gradient(1200px 600px at 85% -10%,var(--bg-2),transparent 60%),repeating-linear-gradient(125deg,transparent 0 120px,color-mix(in srgb,var(--sheet) 22%,transparent) 120px 190px,transparent 190px 300px);background-attachment:fixed}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.12;font-weight:600}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.serif{font-family:var(--f-serif);font-weight:400;font-style:italic;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
svg.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--sheet);font-weight:500;font-size:14px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-fg)}
.btn.primary:hover{background:var(--cta-2);border-color:var(--cta-2)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel)}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn.lg{height:46px;padding:0 22px;font-size:15px}
.btn.grad{background:linear-gradient(90deg,var(--cta),var(--cta-2));border:0;color:var(--cta-fg);box-shadow:0 8px 20px -10px var(--cta)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.ibtn{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;color:var(--muted);flex:none;position:relative}
.ibtn:hover{color:var(--fg);background:var(--panel)}
.ibtn.on{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.input{width:100%;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--sheet);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.err{border-color:var(--bad)}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--fg-2)}
.dd{height:30px;padding:0 26px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font-size:12.5px;font-weight:500;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.neutral{background:var(--panel);color:var(--muted);border-color:var(--line)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12.5px;color:#fff;flex:none;position:relative}
.av .on{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--mint-2);border:2px solid var(--sheet)}
.av .src{position:absolute;right:-3px;top:-3px;width:15px;height:15px;border-radius:50%;border:2px solid var(--sheet);display:grid;place-items:center;font-size:7px;font-weight:800;color:#fff}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.seg button{border:0;background:transparent;height:30px;padding:0 14px;border-radius:999px;font-weight:500;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--sheet);color:var(--fg);box-shadow:0 1px 3px rgba(15,43,46,.12);border:1px solid var(--line)}

/* ai text */
.ai-out{white-space:pre-wrap}
.ai-out b{font-weight:600}
.caret::after{content:"";display:inline-block;width:7px;height:14px;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite;border-radius:2px}
@keyframes blink{50%{opacity:0}}
.thinking{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bob 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}
.shimmer{background:linear-gradient(90deg,var(--muted) 0%,var(--accent) 40%,var(--muted) 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ================= landing ================= */
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.l-nav{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:40;margin:10px auto 0;max-width:1180px;padding-inline:20px}
.l-nav .bar{display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--sheet) 82%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 16px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;text-decoration:none;letter-spacing:-.02em}
.logo svg{width:28px;height:28px;flex:none}
.l-links{display:flex;gap:2px;margin:0 auto}
.l-links a{padding:7px 13px;border-radius:999px;text-decoration:none;font-size:14px;color:var(--fg-2)}
.l-links a:hover{background:var(--panel)}
.l-cta{display:flex;gap:6px}
@media (max-width:820px){.l-links{display:none}.l-cta{margin-left:auto}.l-cta .hide-m{display:none}}
.hero{padding-block:72px 32px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--sheet);border:1px solid var(--line);font-size:13px}
.badge b{background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:999px;font-weight:600;font-size:12px}
.hero h1{font-size:clamp(42px,7vw,86px);letter-spacing:-.045em;line-height:.98;margin:22px auto 20px;max-width:13ch;font-weight:600}
.hero h1 .serif{font-size:1.08em;color:var(--accent)}
.hero .lead{font-size:18px;color:var(--muted);max-width:54ch;margin:0 auto}
.ask{max-width:680px;margin:34px auto 0;background:var(--sheet);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);text-align:left;overflow:hidden}
.ask form{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 18px}
.ask input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;height:40px}
.ask .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--fg-2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.ask-ans{border-top:1px solid var(--line);padding:16px 18px;background:var(--panel);font-size:14.5px;display:grid;gap:10px}
.ask-ans .src{display:flex;gap:6px;flex-wrap:wrap}
.sheet-prev{max-width:1100px;margin:56px auto 0;padding:10px;border-radius:30px;background:color-mix(in srgb,var(--sheet) 45%,transparent);border:1px solid color-mix(in srgb,var(--sheet) 70%,transparent)}
.sheet-prev .inner{border-radius:22px;background:var(--sheet);box-shadow:var(--shadow);padding:18px;text-align:left;display:grid;grid-template-columns:1fr 300px;gap:14px}
@media (max-width:860px){.sheet-prev .inner{grid-template-columns:1fr}.sheet-prev .inner>aside{display:none}}
.logos{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 44px;margin-top:56px;color:var(--faint);font-weight:600;font-size:19px;letter-spacing:-.02em}
.logos .serif{font-size:23px}
section.l{padding-block:96px 0}
.sh{max-width:680px;margin-bottom:40px}
.sh.c{text-align:center;margin-inline:auto}
.sh h2{font-size:clamp(32px,4.6vw,54px);letter-spacing:-.04em;margin:10px 0 14px;line-height:1.02}
.sh h2 .serif{color:var(--accent)}
.sh p{color:var(--muted);font-size:17px}
.feat{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.fc{background:var(--sheet);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.fc h3{font-size:19px;letter-spacing:-.02em}
.fc p{color:var(--muted);font-size:14.5px}
.fc .viz{margin-top:auto;padding-top:14px}
.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media (max-width:900px){.feat{grid-template-columns:1fr}.s7,.s5,.s4{grid-column:auto}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:st}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.step{background:var(--sheet);border:1px solid var(--line);border-radius:24px;padding:24px;display:grid;gap:10px;align-content:start}
.step .n{font-family:var(--f-serif);font-style:italic;font-size:44px;line-height:1;color:var(--accent)}
.step h3{font-size:18px}
.step p{color:var(--muted);font-size:14.5px}
.pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px}
@media (max-width:900px){.pricing{grid-template-columns:1fr}}
.pc{background:var(--sheet);border:1px solid var(--line);border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:14px}
.pc.hl{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.pc.hl .muted,.pc.hl .fine{color:color-mix(in srgb,var(--ink-fg) 65%,transparent)}
.pc h3{font-size:17px;display:flex;justify-content:space-between;align-items:center}
.pc .pr{display:flex;align-items:baseline;gap:6px}
.pc .pr b{font-size:48px;letter-spacing:-.05em;font-weight:600;line-height:1}
.pc ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:14px}
.pc li{display:flex;gap:9px}
.pc li svg{color:var(--mint-2);margin-top:2px}
.pc .btn{margin-top:auto}
.pc.hl .btn{background:var(--ink-fg);color:var(--ink);border-color:transparent}
.fine{font-size:12.5px;color:var(--muted)}
.credits{background:var(--sheet);border:1px solid var(--line);border-radius:22px;padding:18px 22px;display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:center;margin-top:14px}
@media (max-width:640px){.credits{grid-template-columns:1fr}}
input[type=range]{width:100%;accent-color:var(--accent)}
.quotes{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media (max-width:820px){.quotes{grid-template-columns:1fr}}
.q{background:var(--sheet);border:1px solid var(--line);border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:22px;margin:0}
.q blockquote{margin:0;font-size:17px;line-height:1.55}
.q.big blockquote{font-family:var(--f-serif);font-size:30px;line-height:1.2;letter-spacing:-.01em}
.who{display:flex;gap:12px;align-items:center;margin-top:auto}
.who small{display:block;color:var(--muted);font-size:13px}
.faq{max-width:760px;margin:0 auto}
.faq details{background:var(--sheet);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;padding:0 20px}
.faq summary{list-style:none;cursor:pointer;padding:18px 0;font-weight:500;font-size:16px;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding-bottom:18px;color:var(--muted)}
.cta{margin-top:96px;background:var(--ink);color:var(--ink-fg);border-radius:32px;padding:64px 28px;text-align:center;position:relative;overflow:hidden}
.cta h2{font-size:clamp(34px,5vw,60px);letter-spacing:-.045em;max-width:16ch;margin:0 auto 16px;line-height:1}
.cta h2 .serif{color:var(--lav)}
.cta p{opacity:.7;margin:0 auto 26px;max-width:48ch}
.cta .orb{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 60%,transparent),transparent);right:-160px;top:-220px;pointer-events:none}
.cta .orb.b{left:-200px;right:auto;top:auto;bottom:-300px;background:radial-gradient(closest-side,color-mix(in srgb,var(--cta) 40%,transparent),transparent)}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:36px 90px;color:var(--muted);font-size:13px}
.foot nav{display:flex;gap:18px;flex-wrap:wrap}
.foot a{text-decoration:none}
.foot a:hover{color:var(--accent)}

/* ================= app ================= */
.app{max-width:1440px;margin:0 auto;padding:16px}
.sheet{background:var(--sheet);border-radius:26px;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);min-height:calc(100vh - 32px);display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ws{display:flex;align-items:center}
.ws .av{width:28px;height:28px;border:2px solid var(--sheet);margin-left:-7px;font-size:11px}
.ws .av:first-child{margin-left:0}
.ws button.av{border:2px solid var(--sheet);cursor:pointer;padding:0}
.ws button.av[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent);z-index:1}
.ws .add{width:28px;height:28px;border-radius:50%;border:1px dashed var(--line-2);background:transparent;display:grid;place-items:center;color:var(--muted);margin-left:6px}
.pnav{display:flex;gap:2px;margin:0 auto;padding:4px;border-radius:999px;border:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:none}
.pnav a{padding:6px 16px;border-radius:999px;text-decoration:none;font-size:13.5px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.pnav a:hover{color:var(--fg)}
.pnav a[aria-current="page"]{background:var(--sheet);color:var(--fg);box-shadow:0 1px 3px rgba(15,43,46,.12);font-weight:500}
.pnav .cnt{font-size:10.5px;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 6px;font-weight:600}
.tb-right{display:flex;gap:6px;align-items:center}
.meav{width:34px;height:34px;border-radius:50%;border:0;padding:0;background:linear-gradient(135deg,#FF6B6B,#FF9A7A);color:#fff;font-weight:600;font-size:12.5px}
@media (max-width:900px){.topbar{flex-wrap:wrap}.pnav{order:3;width:100%;margin:0}.tb-right{margin-left:auto}.ws .hide-s{display:none}}
.content{padding:18px;flex:1;min-width:0}
@media (max-width:600px){.app{padding:8px}.content{padding:12px}.sheet{border-radius:20px}}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media (max-width:1100px){.ov{grid-template-columns:1fr}}
.col{display:grid;gap:16px;align-content:start;min-width:0}
.box{border:1px solid var(--line);border-radius:20px;padding:18px;background:var(--sheet);min-width:0}
.box.tint{background:var(--panel);border-color:transparent}
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bh h3{font-size:15px;font-weight:600}
.bh .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.kpis>div{padding:16px 18px;display:grid;gap:10px}
.kpis>div+div{border-left:1px solid var(--line)}

.ra{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}

.ra-side{display:flex;flex-direction:column;gap:12px}
.lg-btn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;font-size:13px;text-align:left}
.lg-btn i{width:9px;height:9px;border-radius:50%;flex:none}
.lg-btn[aria-pressed="false"]{opacity:.45}
.lg-btn[aria-pressed="false"] span{text-decoration:line-through}
.tipbox{border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12.5px;color:var(--fg-2);display:flex;gap:8px;background:var(--panel)}
.tipbox svg{color:var(--accent);margin-top:1px}
.dots{position:relative}
.dots svg{display:block;width:100%;height:auto;overflow:visible}
.ax{fill:var(--muted);font-size:10.5px;font-family:var(--f-ui)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ink-fg);font-size:12px;padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .12s;z-index:5;line-height:1.45}
.tip.show{opacity:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--fg);border-color:var(--line-2);font-weight:500}
.tabs button .c{min-width:18px;height:18px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:10.5px;display:grid;place-items:center;padding:0 5px}
.tbl-wrap{position:relative;overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.tbl th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--panel)}
.cu{display:flex;gap:10px;align-items:center}
.cu b{display:block;font-weight:500;font-size:13.5px}
.cu small{color:var(--muted);font-size:11.5px}
.rm{border:0;background:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.rm:hover{background:var(--panel);color:var(--fg)}
.menu{position:absolute;z-index:60;background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -18px rgba(10,50,50,.3);padding:6px;min-width:190px}
.menu button,.menu a{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:9px;text-align:left;font-size:13px;text-decoration:none}
.menu button:hover,.menu a:hover{background:var(--panel)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.tasks{display:grid;gap:4px}
.task{border-radius:14px;padding:10px;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;border:1px solid transparent}
.task:hover{background:var(--panel)}
.task.open{background:var(--panel);border-color:var(--line)}
.task b{font-size:13.5px;font-weight:500}
.task .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:2px}
.task p{font-size:12px;color:var(--muted);margin-top:2px}
.ring{width:22px;height:22px}
.sub{display:grid;gap:6px;margin-top:10px}
.sub label{display:flex;gap:8px;align-items:center;font-size:12.5px}
.sub input{accent-color:var(--accent)}
.sub label.done span{text-decoration:line-through;color:var(--muted)}
.assist{border-radius:22px;padding:16px;background:linear-gradient(170deg,var(--accent-soft),var(--panel) 60%);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.assist .hi{text-align:center;display:grid;gap:2px}
.assist .hi small{color:var(--muted);font-size:12.5px}
.assist .hi b{font-size:20px;letter-spacing:-.02em;font-weight:600}
.assist .modes{display:flex;justify-content:center}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa button{border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:12px;text-align:left;display:grid;gap:14px;font-size:12.5px;font-weight:500;min-height:88px;align-content:space-between;transition:border-color .15s,transform .15s}
.qa button:hover{border-color:var(--accent);transform:translateY(-1px)}
.qa .qi{width:24px;height:24px;border-radius:7px;display:grid;place-items:center}
.qa .qi svg{width:14px;height:14px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:320px;overflow-y:auto;padding-right:2px}
.m{font-size:13px;padding:9px 12px;border-radius:14px;max-width:92%;line-height:1.5}
.m.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:5px}
.m.a{align-self:flex-start;background:var(--sheet);border:1px solid var(--line);border-bottom-left-radius:5px}
.askrow{display:flex;gap:6px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:5px 5px 5px 12px}
.askrow input{flex:1;min-width:0;border:0;outline:none;background:transparent;height:30px;font-size:13px}
.askrow button{width:30px;height:30px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}

/* clients */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1;max-width:340px;min-width:200px}
.search svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.search input{padding-left:36px;border-radius:999px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cc{border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:14px;text-align:left;background:var(--sheet);transition:border-color .15s,transform .15s}
.cc:hover{border-color:var(--accent);transform:translateY(-2px)}
.cc .top{display:flex;gap:12px;align-items:center}
.cc .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--muted)}
.cc .stats b{display:block;color:var(--fg);font-size:14px;font-weight:600}
.health{display:flex;align-items:center;gap:8px;font-size:12px}
.hbar{flex:1;height:6px;border-radius:6px;background:var(--dot-off);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:6px}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:420px;transition:background .15s,box-shadow .15s}
.kcol.over{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.kcol h4{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;padding:2px 4px}
.kcol h4 small{margin-left:auto;color:var(--muted);font-weight:500}
.kcard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;cursor:grab;position:relative}
.kcard:active{cursor:grabbing}
.kcard.drag{opacity:.4}
.kcard b{font-size:13.5px;font-weight:500;padding-right:24px}
.kcard .rm{position:absolute;top:8px;right:6px}
.kcard .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px}
.kadd{border:1px dashed var(--line-2);background:transparent;border-radius:14px;height:38px;color:var(--muted);font-size:13px}
.kadd:hover{border-color:var(--accent);color:var(--accent)}

/* inbox */
.inbox{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;height:calc(100vh - 150px);min-height:560px}

.conv{border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}

.conv-h .n{flex:1;min-width:0}
.conv-h .n b{font-weight:500;display:block}
.conv-h .n small{color:var(--muted);font-size:12px}
.conv-b{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:300px}
.day{align-self:center;font-size:11.5px;color:var(--muted);background:var(--panel);padding:2px 10px;border-radius:999px}

.bub small{font-size:11px;color:var(--muted)}

.bub.me{align-self:flex-end;text-align:right}
.bub.me p{background:var(--accent-soft);color:var(--fg);text-align:left}

.smart{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:16px;background:linear-gradient(180deg,var(--accent-soft),var(--sheet));padding:12px 14px;display:grid;gap:8px}

.list-b{overflow-y:auto;flex:1}

.li{display:flex;gap:10px;padding:10px 12px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line)}

.hb span.t i{display:block;height:100%;border-radius:6px;background:var(--accent)}

.overlay{position:fixed;inset:0;background:rgba(6,30,32,.4);backdrop-filter:blur(2px);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--sheet);border:1px solid var(--line);border-radius:24px;width:min(500px,100%);max-height:calc(100% - 32px);overflow-y:auto;box-shadow:0 30px 80px -20px rgba(6,40,40,.4);animation:pop .18s}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0}
.modal-h h3{font-size:18px}
.modal-b{padding:16px 20px;display:grid;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.drawer-ov{position:fixed;inset:0;background:rgba(6,30,32,.3);z-index:80;animation:fade .15s}
.drawer{position:fixed;top:10px;right:10px;bottom:10px;width:min(430px,calc(100% - 20px));background:var(--sheet);border:1px solid var(--line);border-radius:24px;z-index:81;overflow-y:auto;animation:slide .22s;box-shadow:var(--shadow)}
.toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:100;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--ink-fg);padding:10px 16px;border-radius:999px;font-size:13.5px;display:flex;gap:8px;align-items:center;animation:pop .2s;box-shadow:var(--shadow)}
.demo-badge{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 12px;font-size:12px;box-shadow:var(--shadow)}
.demo-badge b{font-weight:600}
.demo-badge button{border:0;background:var(--panel);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
@keyframes rise{from{opacity:.001;transform:translateY(16px)}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.07s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}

/* daily revenue */
function series(range){
  seed=range==='90'?5:range==='7'?9:11;
  const days=range==='90'?91:range==='7'?7:29;const out=[];
  for(let i=days-1;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);let v=40+rnd()*170+(Math.sin(i/3)+1)*30;if(i===15&&range==='30')v=285;out.push({d,v:Math.round(v),proj:false})}
  let pts=out;
  if(range==='90'){pts=[];for(let k=0;k<out.length;k+=7){const chunk=out.slice(k,k+7);pts.push({d:chunk[0].d,v:chunk.reduce((a,x)=>a+x.v,0),proj:false,week:true})}}
  const pn=range==='90'?2:range==='7'?3:7;const last=pts.slice(-5).reduce((a,x)=>a+x.v,0)/5;
  for(let k=1;k<=pn;k++){const d=new Date(now);d.setDate(d.getDate()+k*(range==='90'?7:1));pts.push({d,v:Math.round(last*(1.04+k*.025)+(rnd()-.5)*last*.2),proj:true,week:range==='90'})}
  return pts;
}

  if(/price|pricing|quote|charge/.test(s))return `Based on your last 12 projects, a **landing page** is quoted at $2,400–$3,200 and closes 68% of the time. Quotes above $3,500 close at 31%.\n\nFor a startup landing page, I'd suggest **$2,800 fixed**, with a 50% deposit and 2 revision rounds.`;

function ringSVG(p,size=22){const r=8,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 22 22" style="width:${size}px;height:${size}px"><circle cx="11" cy="11" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="2.4"/><circle cx="11" cy="11" r="${r}" fill="none" stroke="${p>=1?'var(--mint-2)':'var(--accent)'}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 11 11)"/>${p>=1?'<path d="m7.5 11.2 2.3 2.3 4.7-4.8" fill="none" stroke="var(--mint-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>':''}</svg>`}
function healthColor(h){return h>=75?'var(--mint-2)':h>=50?'var(--warn)':'var(--bad)'}
function healthRow(c){return `<div class="health">${av(c.name,{s:26})}<span style="width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name.split(' ')[0])}</span><span class="hbar"><i style="width:${c.health}%;background:${healthColor(c.health)}"></i></span><b class="num" style="width:26px;text-align:right">${c.health}</b></div>`}
function qaTiles(){return [['text','Text assistance','var(--good-soft)','var(--good)'],['flow','Process automation','var(--bad-soft)','var(--bad)'],['cal','Schedule optimization','var(--warn-soft)','var(--warn)'],['reply','Smart response','var(--accent-soft)','var(--accent)']].map(t=>`<button type="button" data-qa="${t[1]}"><span class="qi" style="background:${t[2]};color:${t[3]}">${ic(t[0])}</span>${t[1]}</button>`).join('')}
function kpiBlock(el){const act=series('30').filter(p=>!p.proj).reduce((a,p)=>a+p.v,0);
  el.innerHTML=[['Clients',S.clients.length,'+4','good','Compare 10 (last month)'],['Revenue','$'+fmt(act,2),'-8%','bad','$'+fmt(act/0.92,2)+' (last month)'],['Projects',S.projects.filter(p=>p.status!=='Cancelled').length,'+6','good','Compare 16 (last month)']].map(k=>`<div><div class="t">${k[0]}<span class="pill ${k[3]}">${k[2]}</span></div><div class="v"><b class="num">${k[1]}</b><small>${k[4]}</small></div></div>`).join('')}
function dotChart(el,pts,o={}){
  const rows=o.mini?8:10,n=pts.length;const W=o.mini?360:640,H=o.mini?120:(o.compact?170:210);const P={l:o.mini?0:34,r:4,t:10,b:o.mini?4:24};
  const max=Math.max(...pts.map(p=>p.v))*1.08;const cw=(W-P.l-P.r)/n,rh=(H-P.t-P.b)/rows;const rad=Math.max(1.8,Math.min(cw,rh)*.34);
  const sel=o.sel??pts.findIndex(p=>p.v===Math.max(...pts.filter(q=>!q.proj).map(q=>q.v)));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue per ${pts[0].week?'week':'day'}, dot matrix">`;
  if(!o.mini){for(let g=0;g<=3;g++){const v=max*g/3;const y=H-P.b-(g/3)*(H-P.t-P.b);s+=`<text x="0" y="${y+3}" class="ax num">$${fmt(Math.round(v/10)*10)}</text>`}}
  pts.forEach((p,i)=>{const on=Math.round(p.v/max*rows);const cx=P.l+cw*i+cw/2;const show=p.proj?S.showProj:S.showActual;
    for(let r=0;r<rows;r++){const cy=H-P.b-rh*r-rh/2;let f='var(--dot-off)';if(r<on&&show){f=p.proj?'var(--lav)':(i===sel?'var(--sec)':'var(--mint)')}s+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(2)}" fill="${f}"/>`}
    if(!o.mini&&(i%Math.ceil(n/7)===0))s+=`<text x="${cx}" y="${H-6}" text-anchor="middle" class="ax">${lbl(p.d)}</text>`;
    s+=`<rect x="${cx-cw/2}" y="0" width="${cw}" height="${H}" fill="transparent" data-i="${i}" class="hit"/>`});
  if(sel>=0&&!o.mini){const cx=P.l+cw*sel+cw/2;const on=Math.round(pts[sel].v/max*rows);const top=H-P.b-rh*on;s+=`<line x1="${P.l}" x2="${cx}" y1="${top}" y2="${top}" stroke="var(--sec)" stroke-dasharray="2 3" opacity=".6"/><rect x="${P.l-2}" y="${top-8}" width="${String(pts[sel].v).length*6.5+14}" height="16" rx="5" fill="var(--sec)"/><text x="${P.l+5}" y="${top+3.5}" class="num" style="font-size:10px;fill:#fff;font-weight:600">$${pts[sel].v}</text>`;
   s+=`<rect x="${cx-cw/2+1}" y="${H-P.b+6}" width="${cw-2}" height="16" rx="5" fill="var(--sec)" opacity=".15"/>`}
  el.innerHTML=`<div class="dots">${s}</svg><div class="tip"></div></div>`;
  if(o.mini)return;
  const tip=$('.tip',el),svg=$('svg',el);
  $$('.hit',el).forEach(h=>{h.addEventListener('mousemove',e=>{const i=+h.dataset.i,p=pts[i];const r=svg.getBoundingClientRect();tip.innerHTML=`<b>${p.week?'Week of ':''}${lbl(p.d)}</b><br>${p.proj?'AI projected':'Actual'}: $${fmt(p.v)}`;tip.style.left=((P.l+cw*i+cw/2)/W*r.width)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.classList.add('show')});
   h.addEventListener('mouseleave',()=>tip.classList.remove('show'));h.addEventListener('click',()=>{if(o.onSel)o.onSel(+h.dataset.i)})});
}

   <div id="lsBox" hidden style="padding:8px 12px;border-bottom:1px solid var(--line)"><label class="sr" for="lq">Search messages</label><input class="input" id="lq" placeholder="Search by name or text" value="${esc(S.inboxQ)}" style="height:34px"></div><div class="list-b" id="lb"></div></aside></div>`;

    return `<div class="li" role="button" tabindex="0" data-t="${i}" aria-current="${i===S.active}">${av(t.n,{src:c.src})}<div class="mid"><b>${esc(t.n)}</b><p>${esc(last?last[2]:'New conversation')}</p></div><div class="end"><span>${t.time}</span>${t.unread?`<span class="badge-n num">${t.unread}</span>`:`<button class="star" data-star="${i}" aria-pressed="${t.star}" aria-label="Star">${ic('star','width:14px;height:14px')}</button>`}</div></div>`}).join('')||'<p class="muted" style="padding:20px;text-align:center">No conversations match.</p>';
   $$('[data-t]').forEach(b=>{const open=e=>{if(e.target.closest('[data-star]'))return;S.active=+b.dataset.t;S.threads[S.active].unread=0;drawList();drawConv();updCnt()};b.onclick=open;b.onkeydown=e=>{if(e.key==='Enter')open(e)}});
   $$('[data-star]').forEach(s=>s.onclick=e=>{e.stopPropagation();const t=S.threads[+s.dataset.star];t.star=!t.star;drawList()})};
  const updCnt=()=>{const n=S.threads.reduce((a,t)=>a+t.unread,0);const a=$('.pnav a[href="#app-inbox"]');const c=$('.cnt',a);if(n){if(c)c.textContent=n}else c?.remove()};
  let smart=null,atts=[];
  const drawConv=()=>{const t=S.threads[S.active];const c=cl(t.n)||{co:'',country:'',tz:'UTC',src:'Email'};t.unread=0;
   $('#conv').innerHTML=`<div class="conv-h">${av(t.n,{on:true,s:38})}<div class="n"><b>${esc(t.n)}</b><small>${esc(c.country)} · Local time: ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:c.tz})} · via ${c.src}</small></div><button class="ibtn ${t.muted?'on':''}" id="mute" aria-label="Mute" aria-pressed="${!!t.muted}">${ic('mute','width:15px;height:15px')}</button><button class="ibtn ${t.star?'on':''}" id="starH" aria-label="Star conversation">${ic('star','width:15px;height:15px')}</button><button class="ibtn" id="more" aria-label="More">${ic('dots','width:15px;height:15px')}</button></div>
   <div class="conv-b" id="cb" data-scroll>${t.msgs.map(m=>`<div class="bub ${m[0]==='me'?'me':''}"><small>${esc(m[1])}</small><p>${esc(m[2])}</p>${m[3]?m[3].map(a=>`<span class="att">${ic('clip','width:13px;height:13px')}${esc(a)}</span>`).join(''):''}</div>`).join('')||'<p class="muted" style="text-align:center;margin:auto">Start the conversation with '+esc(t.n.split(' ')[0])+'.</p>'}<div id="aiZone"></div></div>
   <form class="composer" id="comp"><div class="atts" id="atts"></div><div class="row"><label class="sr" for="ci">Message</label><input id="ci" placeholder="Send message…" autocomplete="off"><button type="button" class="ibtn" id="improve" aria-label="Improve writing with AI" title="Improve writing">${ic('spark','width:15px;height:15px')}</button><button class="ibtn" aria-label="Send" style="background:var(--accent);color:var(--accent-fg);border:0">${ic('send','width:15px;height:15px')}</button></div><p class="fine">Tandem can make mistakes. Check important details before sending.</p></form>`;
   drawAI();drawAtts();const cb=$('#cb');cb.scrollTop=cb.scrollHeight;
   $('#starH').onclick=()=>{t.star=!t.star;drawConv();drawList()};$('#mute').onclick=()=>{t.muted=!t.muted;drawConv();toast(t.muted?'Notifications muted':'Notifications on')};
   $('#more').onclick=e=>{e.stopPropagation();menu(e.currentTarget,[{t:'View client profile',icon:'home',run:()=>{const cc=cl(t.n);if(cc)clientDrawer(cc)}},{t:'Mark as unread',icon:'mail',run:()=>{t.unread=1;drawList();updCnt()}},{t:'Summarise conversation',icon:'sum',run:()=>tool('Message Summarization')}])};
   $('#comp').onsubmit=e=>{e.preventDefault();send($('#ci').value)};
   $('#improve').onclick=()=>{const v=$('#ci').value.trim();if(!v){toast('Type a message first, then improve it');$('#ci').focus();return}const b=$('#improve');b.disabled=true;setTimeout(()=>{$('#ci').value=improve(v);b.disabled=false;toast('Rewritten: clearer and warmer')},700)}};
  const improve=v=>{let s=v.trim().replace(/\s+/g,' ');s=s[0].toUpperCase()+s.slice(1);if(!/[.!?]$/.test(s))s+='.';if(!/^(hi|hello|hey)/i.test(s))s=`Hi ${S.threads[S.active].n.split(' ')[0]}, `+s[0].toLowerCase()+s.slice(1);return s+' Let me know if anything is unclear.'};
  const drawAtts=()=>{$('#atts').innerHTML=atts.map((a,i)=>`<span>${ic('clip','width:12px;height:12px')}${esc(a)}<button type="button" data-ra="${i}" aria-label="Remove ${esc(a)}">${ic('x','width:12px;height:12px')}</button></span>`).join('');$$('[data-ra]').forEach(b=>b.onclick=()=>{atts.splice(+b.dataset.ra,1);drawAtts()})};
  const send=(txt)=>{const v=(txt||'').trim();if(!v&&!atts.length)return;const t=S.threads[S.active];t.msgs.push(['me',new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}),v||'Sharing the files here.',atts.length?[...atts]:null]);t.time='now';atts=[];smart=null;drawConv();drawList();toast('Sent via '+((cl(t.n)||{}).src||'Email'));
   const who=t;setTimeout(()=>{if(S.threads[S.active]===who&&$('#cb')){const ty=document.createElement('div');ty.className='thinking';ty.innerHTML=`<i></i><i></i><i></i>${esc(who.n.split(' ')[0])} is typing`;$('#aiZone').before(ty);$('#cb').scrollTop=1e6}},700);
   setTimeout(()=>{who.msgs.push(['them',new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}),pickReply(v)]);if(S.threads[S.active]!==who)who.unread++;if(location.hash==='#app-inbox'){if(S.threads[S.active]===who)drawConv();drawList();updCnt()}},2400)};
  const pickReply=v=>/price|\$|quote|estimate/i.test(v)?'That sounds fair. Could you send the estimate as a PDF so I can share it with my co-founder?':/call|meet|thursday|time/i.test(v)?'Thursday works. I\'ll send a calendar invite for 10:00 my time.':'Thanks, that\'s really helpful. Let me review and get back to you tomorrow.';
  const lastThem=()=>{const t=S.threads[S.active];return [...t.msgs].reverse().find(m=>m[0]==='them')};
  const REPLIES=v=>{const n=S.threads[S.active].n.split(' ')[0];const q=(v||'').toLowerCase();
   if(/process|pricing|price/.test(q))return ['Of course! I\'ll start by understanding your goals, creating wireframes, and refining the design in Figma, keeping communication open throughout. I offer fixed-rate and hourly pricing based on scope. Share more details, and I\'ll provide a tailored estimate. Excited to learn more!',`Happy to explain, ${n}. My process has four steps: discovery call, wireframes, high-fidelity design in Figma and a handover with a short Loom walkthrough. Most landing pages are a fixed $2,800 with two revision rounds.`];
   if(/wireframe|review|when/.test(q))return [`Great question, ${n}. The homepage wireframes are ready. Would Thursday at 9:30 your time work for a 30-minute walkthrough?`,`I can share the wireframes today as a Figma link, then we review live on Thursday. Does that work for you?`];
   if(/booking|form|add/.test(q))return [`Yes, we can add that, ${n}. A booking form with practice-management sync adds about 4 days and $1,200. Want me to update the quote?`,`Definitely possible. I'd suggest a simple 3-step booking flow. I'll send a quick sketch and a revised estimate tomorrow.`];
   if(/invoice|finance|pay/.test(q))return [`Thanks ${n}! For reference, INV-118 is $5,000 and was due on Sep 23. Happy to walk through the designs whenever suits you.`,`No problem. I'll resend INV-118 to your finance team with bank details for EUR transfers.`];
   if(/pause|january/.test(q))return [`Totally understand, ${n}. I'll pause the portal work and keep your files ready. Shall we pencil in a restart call for January 6?`];
   return [`Thanks for the update, ${n}! I'll take a look and come back to you by tomorrow.`,`Appreciate it, ${n}. I'll action this today and share progress by Friday.`]};
  const TONE={Friendly:s=>s.replace(/^Certainly\.|^Sure\./,'Of course!'),Formal:s=>s.replace(/^Of course!|^Happy to explain,|^Great question,|^Totally understand,|^Thanks for the update,|^Thanks /,m=>m.startsWith('Thanks')?'Thank you ':'Certainly,').replace(/I'll/g,'I will').replace(/!/g,'.').replace(/Excited to learn more\./,'I look forward to hearing from you.'),Concise:s=>s.split(/(?<=[.!?])\s/).slice(0,2).join(' ')};
  let variant=0;
  const drawAI=()=>{const z=$('#aiZone');if(!z)return;const lt=lastThem();
   if(smart){z.innerHTML=`<div class="smart"><div class="h">${ic('spark')}${esc(smart.title)}<div class="tools">${smart.kind==='reply'?`<button class="rm" id="regen" aria-label="Regenerate" title="Regenerate">${ic('refresh','width:15px;height:15px')}</button><button class="rm" id="edit" aria-label="Edit" title="Edit">${ic('edit','width:15px;height:15px')}</button>`:''}<button class="rm" id="closeAI" aria-label="Dismiss">${ic('x','width:15px;height:15px')}</button></div></div><div class="txt" id="aiTxt"></div>${smart.kind==='reply'?`<div class="why">This response builds trust, shows flexibility and keeps the conversation open.</div><div class="foot2">${['Friendly','Formal','Concise'].map(t=>`<button type="button" class="chip" data-tn="${t}" aria-pressed="${smart.tone===t}" style="height:26px">${t}</button>`).join('')}<button type="button" class="btn primary sm" id="useAI" style="margin-left:auto">${ic('send','width:13px;height:13px')}Send</button><button type="button" class="btn sm" id="insAI">Insert</button></div>`:''}${smart.kind==='list'?'<div class="foot2" id="aiList"></div>':''}</div>`;
    const tx=$('#aiTxt');if(smart.streamed)tx.innerHTML=md(smart.text);else{smart.streamed=true;stopStreams.push(stream(tx,smart.text,{think:smart.think||800,steps:['Reading thread',smart.kind==='reply'?'Drafting reply':'Working']}))}
    if(smart.kind==='list'){$('#aiList').innerHTML=smart.items.map((it,i)=>`<button type="button" class="chip" data-it="${i}">${esc(it.l)}</button>`).join('');$$('[data-it]').forEach(b=>b.onclick=()=>smart.items[+b.dataset.it].run())}
    $('#closeAI').onclick=()=>{smart=null;drawAI()};
    $('#regen')?.addEventListener('click',()=>{variant++;const arr=REPLIES(lt&&lt[2]);smart={...smart,text:TONE[smart.tone](arr[variant%arr.length]),streamed:false,think:500};drawAI()});
    $('#edit')?.addEventListener('click',()=>{const e=$('#aiTxt');const on=e.getAttribute('contenteditable')==='true';e.setAttribute('contenteditable',!on);if(!on){e.focus();toast('Edit the draft, then send')}else smart.text=e.innerText});
    $$('[data-tn]').forEach(b=>b.onclick=()=>{const arr=REPLIES(lt&&lt[2]);smart={...smart,tone:b.dataset.tn,text:TONE[b.dataset.tn](arr[variant%arr.length]),streamed:false,think:400};drawAI()});
    $('#useAI')?.addEventListener('click',()=>send($('#aiTxt').innerText));
    $('#insAI')?.addEventListener('click',()=>{$('#ci').value=$('#aiTxt').innerText;smart=null;drawAI();$('#ci').focus()});
   }else{z.innerHTML=`<div class="tiles">${[['reply','Smart Reply','var(--accent-soft)','var(--accent)'],['tone','Tone Adjustment','var(--bad-soft)','var(--bad)'],['arrow','Follow-Up Suggestions','var(--warn-soft)','var(--warn)'],['sum','Message Summarization','var(--good-soft)','var(--good)'],['clip','Suggested Attachments','var(--info-soft)','var(--info)'],['status','Automated Status Updates','var(--panel-2)','var(--muted)']].map(t=>`<button type="button" data-tool="${t[1]}"><span class="qi" style="background:${t[2]};color:${t[3]}">${ic(t[0])}</span>${t[1]}</button>`).join('')}</div>`;
    $$('[data-tool]').forEach(b=>b.onclick=()=>tool(b.dataset.tool))}
   const cb=$('#cb');if(cb)cb.scrollTop=cb.scrollHeight};
  const tool=name=>{const t=S.threads[S.active],lt=lastThem(),n=t.n.split(' ')[0];variant=0;
   if(name==='Smart Reply'){if(!lt){toast(`Nothing from ${n} to reply to yet`);return}smart={kind:'reply',title:'Smart Reply',tone:'Friendly',text:REPLIES(lt[2])[0]}}
   if(name==='Tone Adjustment'){const v=$('#ci').value.trim();if(!v&&lt){smart={kind:'reply',title:'Smart Reply · pick a tone',tone:'Formal',text:TONE.Formal(REPLIES(lt[2])[0])}}else if(v){smart={kind:'reply',title:'Rewritten in a formal tone',tone:'Formal',text:TONE.Formal(improve(v))}}else{toast('Type a message first');return}}
   if(name==='Follow-Up Suggestions'){const sug=[`Hi ${n}, just checking whether you had a chance to review my last message.`,`Hi ${n}, I've blocked time next week for your project. Shall we confirm the start date?`,`Hi ${n}, sharing a quick example of similar work. Happy to walk you through it.`];smart={kind:'list',title:'Follow-up suggestions',text:`Pick one to put it in the composer. Best time to send: **${new Date(Date.now()+3600e3*3).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:(cl(t.n)||{tz:'UTC'}).tz})} ${n}'s time**, when they usually reply fastest.`,items:sug.map((s,i)=>({l:['Gentle nudge','Confirm start','Share example'][i],run:()=>{$('#ci').value=s;$('#ci').focus()}}))}}
   if(name==='Message Summarization'){const them=t.msgs.filter(m=>m[0]==='them').length,me=t.msgs.length-them;smart={kind:'sum',title:'Summary',text:`**${t.msgs.length} messages** (${them} from ${n}, ${me} from you).\n\n${n} ${lt?'last wrote: “'+lt[2].slice(0,90)+(lt[2].length>90?'…':'')+'”':'has not written yet'}\n\n**Open question:** ${lt&&/\?/.test(lt[2])?'yes, they are waiting on your answer.':'none, the ball is in their court.'}\n**Sentiment:** positive · **Urgency:** ${t.unread?'high':'normal'}`}}
   if(name==='Suggested Attachments'){const files=['Studio process.pdf','Pricing 2026.pdf','Case study · Copperleaf.pdf','Proposal template.docx'];smart={kind:'list',title:'Suggested attachments',text:`Based on this thread, ${n} will probably want these. Click to attach.`,items:files.map(f=>({l:f,run:()=>{if(!atts.includes(f)){atts.push(f);drawAtts();toast(f+' attached')}}}))}}
   if(name==='Automated Status Updates'){t.auto=!t.auto;smart={kind:'sum',title:'Automated status updates',text:t.auto?`**On.** Every Friday at 16:00 ${n}'s time, Tandem will send a short update from project activity. You'll get a preview on Thursday to approve or edit.`:`**Off.** ${n} will no longer receive weekly status updates.`};toast(t.auto?'Weekly updates on for '+n:'Weekly updates off')}
   drawAI()};
  drawList();drawConv();updCnt();
  $('#plat').onchange=e=>{S.platform=e.target.value;drawList()};$('#lsBtn').onclick=()=>{const b=$('#lsBox');b.hidden=!b.hidden;if(!b.hidden)$('#lq').focus()};$('#lq').oninput=e=>{S.inboxQ=e.target.value;drawList()};
}

/* ---------- Analytics ---------- */
function pAnalytics(C){
  const stages=[['Leads',148,'var(--lav)'],['Qualified',86,'var(--accent-2)'],['Proposal sent',41,'var(--mint)'],['Won',19,'var(--mint-2)']];
  const src=[['Referrals',48],['LinkedIn',31],['Upwork',22],['Website',18],['Dribbble',12]];
  C.innerHTML=`<div class="bh" style="margin-bottom:16px"><div><h2 style="font-size:24px;letter-spacing:-.03em">Analytics</h2><p class="muted" style="font-size:13.5px">Last 90 days · all workspaces</p></div><div class="seg" role="group" aria-label="Currency">${['USD','EUR','AUD'].map(c=>`<button type="button" data-cur="${c}" aria-pressed="${(S.cur||'USD')===c}">${c}</button>`).join('')}</div></div>
  <div class="kpis" style="margin-bottom:16px;grid-template-columns:repeat(3,1fr)" id="ak"></div>
  <div class="an"><div class="col">
   <div class="box"><div class="bh"><h3>Revenue · actual vs AI forecast</h3><span class="pill acc">${ic('spark','width:12px;height:12px')}91% forecast accuracy</span></div><div id="line"></div></div>
   <div class="box"><div class="bh"><h3>Ask your data</h3></div><form class="askrow" id="adF" style="margin-bottom:10px"><label class="sr" for="adq">Ask about your numbers</label><input id="adq" placeholder="e.g. What is my average project value?"><button aria-label="Ask">${ic('send','width:15px;height:15px')}</button></form><div class="chips" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${['Which source wins most deals?','What is my average project value?','Where is revenue heading?'].map(q=>`<button type="button" class="chip" data-aq="${q}">${q}</button>`).join('')}</div><div id="adOut" data-scroll style="font-size:13.5px;max-height:220px;overflow-y:auto"></div></div>
  </div><div class="col">
   <div class="box"><div class="bh"><h3>Pipeline funnel</h3></div><div class="funnel">${stages.map(s=>`<div class="fr"><span>${s[0]}</span><span class="bar"><i style="width:${s[1]/stages[0][1]*100}%;background:${s[2]}">${Math.round(s[1]/stages[0][1]*100)}%</i></span><b class="num" style="text-align:right">${s[1]}</b></div>`).join('')}</div><p class="fine" style="margin-top:12px">Win rate from proposal: <b class="num">${Math.round(19/41*100)}%</b> · industry median 32%</p></div>
   <div class="box"><div class="bh"><h3>Won deals by source</h3></div><div class="hb">${src.map(s=>`<div><span>${s[0]}</span><span class="t"><i style="width:${s[1]/48*100}%"></i></span><b class="num" style="text-align:right">${s[1]}%</b></div>`).join('')}</div></div>
   <div class="box"><div class="bh"><h3>Clients by region</h3></div><div class="hb">${Object.entries(S.clients.reduce((a,c)=>(a[c.country]=(a[c.country]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`<div><span>${k}</span><span class="t"><i style="width:${v/5*100}%;background:var(--mint-2)"></i></span><b class="num" style="text-align:right">${v}</b></div>`).join('')}</div></div>
  </div></div>`;
  const RATE={USD:[1,'$'],EUR:[.92,'€'],AUD:[1.52,'A$']};
  const draw=()=>{const [r,sym]=RATE[S.cur||'USD'];$('#ak').innerHTML=[['Revenue (90d)',sym+fmt(41280*r),'+12%','good'],['Avg. project value',sym+fmt(7960*r),'+5%','good'],['Avg. reply time','2h 14m','-38%','good']].map(k=>`<div><div class="t">${k[0]}<span class="pill ${k[3]}">${k[2]}</span></div><div class="v"><b class="num">${k[1]}</b></div></div>`).join('');
   const m=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov'];const act=[9.2,11.4,10.1,13.8,12.9,14.6,null,null].map(v=>v&&v*r),fc=[null,null,null,null,null,14.6,16.1,17.4].map(v=>v&&v*r);
   const W=600,H=220,P={l:44,r:10,t:14,b:26};const mx=20*r;const x=i=>P.l+i*(W-P.l-P.r)/(m.length-1),y=v=>H-P.b-v/mx*(H-P.t-P.b);
   let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Monthly revenue with forecast">`;
   for(let g=0;g<=4;g++){const v=mx*g/4;s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${P.l-8}" y="${y(v)+4}" text-anchor="end" class="ax num">${sym}${fmt(v,0)}k</text>`}
   m.forEach((l,i)=>s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" class="ax">${l}</text>`);
   const band=fc.map((v,i)=>v?[i,v*1.1,v*.9]:null).filter(Boolean);s+=`<path d="${band.map((b,k)=>`${k?'L':'M'}${x(b[0])} ${y(b[1])}`).join(' ')} ${band.slice().reverse().map(b=>`L${x(b[0])} ${y(b[2])}`).join(' ')}Z" fill="var(--lav)" opacity=".45"/>`;
   const path=a=>a.map((v,i)=>v==null?'':`${a.slice(0,i).some(q=>q!=null)?'L':'M'}${x(i)} ${y(v)}`).join(' ');
   s+=`<path d="${path(act)} L${x(5)} ${H-P.b} L${x(0)} ${H-P.b}Z" fill="var(--mint)" opacity=".18"/><path d="${path(act)}" fill="none" stroke="var(--mint-2)" stroke-width="2.4"/><path d="${path(fc)}" fill="none" stroke="var(--sec)" stroke-width="2.4" stroke-dasharray="6 5"/>`;
   act.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--mint-2)"><title>${m[i]}: ${sym}${fmt(v,1)}k</title></circle>`});fc.forEach((v,i)=>{if(v!=null&&i>5)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--sheet)" stroke="var(--sec)" stroke-width="2"><title>${m[i]} forecast: ${sym}${fmt(v,1)}k</title></circle>`});
   $('#line').innerHTML=s+`</svg><div style="display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:8px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mint-2)"></i> Actual</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sec)"></i> AI forecast</span><span><i style="display:inline-block;width:14px;height:9px;border-radius:3px;background:var(--lav)"></i> ±10% range</span></div>`};
  draw();$$('[data-cur]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.cur;$$('[data-cur]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
  const ans=q=>{const s=q.toLowerCase();let a;if(/source|channel|win/.test(s))a=`**Referrals** win the most deals (48% of won revenue) and close fastest, 9 days on average. LinkedIn is second at 31%, but its deals are 40% larger.\n\nSuggestion: ask your 5 healthiest clients for an intro this month.`;else if(/average|avg|value/.test(s))a=`Your average project value is **$7,960** over the last 90 days, up 5%. Shopify builds average $6,200, marketing sites $11,600.`;else a=aiAnswer(q);stopStreams.push(stream($('#adOut'),a,{think:900,steps:['Querying 90 days of data','Writing']}))};
  $('#adF').onsubmit=e=>{e.preventDefault();const v=$('#adq').value.trim();if(v)ans(v)};$$('[data-aq]').forEach(b=>b.onclick=()=>{$('#adq').value=b.dataset.aq;ans(b.dataset.aq)});
}

applyTheme('light');
$('#demoClose').onclick=()=>$('#demoBadge').remove();
route();
})();
</script>
