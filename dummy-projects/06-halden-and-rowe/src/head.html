<title>Halden & Rowe · Wealth & Business Advisory</title>
<meta name="description" content="Halden & Rowe is a fictional wealth and business advisory firm. Portfolio demo by Organoo Studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Halden & Rowe — "Cobalt Citrus". Light editorial layout, serif display + grotesk UI, lots of scroll-driven motion. */
:root{
  color-scheme:light;
  --cobalt:#2F5BFF; --cobalt-d:#1D3FD6; --cobalt-2:#5B7CFF; --cobalt-soft:#E7ECFF; --cobalt-soft-2:#D5DEFF;
  --citrus:#FFC83D; --citrus-d:#F2B416; --citrus-soft:#FFF3D1;
  --mint:#19C39C; --mint-soft:#DDF7EF;
  --bg:#F4F6FF; --paper:#FFFFFF; --navy:#0B1640; --navy-2:#13215A;
  --ink:#0D1A3A; --fg-2:#3A476A; --muted:#66739A; --line:#E2E7F5; --line-2:#CDD5EE;
  --bad:#E5484D;
  --f-serif:"Fraunces",Georgia,"Times New Roman",serif;
  --f-ui:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --r:22px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;font-weight:500;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
h1,h2{font-family:var(--f-serif)}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--cobalt);outline-offset:3px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1240px;margin:0 auto;padding-inline:28px}
@media (max-width:640px){.wrap{padding-inline:16px}}
main{overflow-x:clip}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cobalt)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--citrus);transform:rotate(45deg)}
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--cobalt-soft),#F7F9FF)}
.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-serif);font-size:42px;color:var(--cobalt)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .15s}
.btn:hover{background:var(--ink);color:#fff}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.pri:hover{background:var(--cobalt-d);border-color:var(--cobalt-d)}
.btn.cit{background:var(--citrus);border-color:var(--citrus);color:var(--ink)}
.btn.cit:hover{background:var(--citrus-d);border-color:var(--citrus-d)}
.btn.ghost{border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.white{background:#fff;border-color:#fff;color:var(--ink)}
.btn.white:hover{background:var(--citrus);border-color:var(--citrus)}
.btn.sm{height:38px;padding:0 16px;font-size:13.5px}
.btn.lg{height:56px;padding:0 28px;font-size:16px}
.btn .go{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;margin-right:-12px;transition:transform .3s var(--ease)}
.btn.cit .go{background:var(--ink);color:var(--citrus)}
.btn:hover .go{transform:rotate(-45deg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:var(--cobalt)}
.chip{height:40px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--paper);font-weight:700;font-size:14px;transition:all .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.input,.sel{width:100%;height:50px;padding:0 16px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--paper);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:110px;padding:13px 16px;resize:vertical}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.input:focus,.sel:focus{border-color:var(--cobalt);box-shadow:0 0 0 4px var(--cobalt-soft)}
.input.err,.sel.err{border-color:var(--bad)}
.field{display:grid;gap:7px}
.field label{font-size:13.5px;font-weight:700;color:var(--fg-2)}
.err-t{font-size:13px;color:var(--bad);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--cobalt-soft);color:var(--cobalt-d)}
.tag.cit{background:var(--citrus-soft);color:#8A5B00}
.tag.mint{background:var(--mint-soft);color:#08775D}

/* ===== top chrome ===== */
.prog{position:fixed;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--cobalt),var(--mint),var(--citrus));transform-origin:left;transform:scaleX(0);z-index:60}
.nav{position:sticky;top:0;z-index:50;transition:padding .35s var(--ease)}
.nav .bar{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:16px 28px;transition:all .35s var(--ease)}
.nav.small .bar{margin-top:10px;max-width:1180px;padding:9px 10px 9px 18px;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;box-shadow:0 18px 40px -28px rgba(13,26,58,.45)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:18px}
.logo .m{width:40px;height:40px;border-radius:12px;background:var(--cobalt);display:grid;place-items:center;position:relative;transition:transform .5s var(--ease)}
.logo:hover .m{transform:rotate(-8deg)}
.logo .m svg{width:24px;height:24px}
.logo .m::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--citrus);border:2px solid var(--bg)}
.logo b{font-family:var(--f-serif);font-weight:600;font-size:20px;letter-spacing:-.02em;line-height:1}
.logo small{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:700}
.nl{display:flex;gap:2px}
.nl a{position:relative;padding:9px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14.5px;color:var(--fg-2);transition:color .2s,background .2s}
.nl a:hover{color:var(--ink);background:var(--cobalt-soft)}
.nl a[aria-current="page"]{color:var(--ink)}
.nl a[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--cobalt)}
.nav .sp{flex:1}
.nav .ib{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--paper);display:grid;place-items:center;position:relative}
.nav .ib .n{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:999px;background:var(--citrus);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.burger{display:none!important}
.mm{display:none}
@media (max-width:980px){
  .nl,.nav .bk{display:none}.burger{display:grid!important}
  .mm.open{display:grid;gap:6px;position:fixed;top:78px;left:14px;right:14px;z-index:55;background:#fff;border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:0 30px 60px -30px rgba(13,26,58,.5);animation:pop .3s var(--ease)}
  .mm a{padding:14px 16px;border-radius:14px;text-decoration:none;font-weight:700;background:var(--bg)}
  .mm a.btn{background:var(--citrus);justify-content:center}
  .nav .bar{padding:12px 16px}.nav.small .bar{margin-inline:10px;padding:8px 8px 8px 14px}
}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}}

/* ===== reveal utilities ===== */
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--dl,0s)}
.rv.in{opacity:1;transform:none}
.rv.clip{opacity:1;transform:none;clip-path:inset(12% 12% 12% 12% round 28px);transition:clip-path 1.2s var(--ease)}
.rv.clip.in{clip-path:inset(0 0 0 0 round 28px)}
.rv.clip .ph>img{transform:scale(1.18);transition:transform 1.6s var(--ease)}
.rv.clip.in .ph>img{transform:scale(1)}
.rv.blur{filter:blur(10px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease)}
.rv.blur.in{filter:none}
[data-speed]{will-change:transform}

/* ===== HERO ===== */
.hero{padding:38px 0 30px;position:relative}
.hero::before{content:"";position:absolute;left:50%;top:-140px;width:1100px;height:620px;translate:-50% 0;background:radial-gradient(40% 50% at 30% 40%,rgba(47,91,255,.16),transparent 70%),radial-gradient(35% 45% at 75% 35%,rgba(255,200,61,.22),transparent 70%);z-index:-1;pointer-events:none}
.h-top{text-align:center;display:grid;justify-items:center}
.h-badge{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 16px 0 6px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--fg-2);animation:rise .8s var(--ease) both}
.h-badge b{height:26px;padding:0 10px;border-radius:999px;background:var(--mint-soft);color:#08775D;display:inline-flex;align-items:center;gap:6px;font-size:12px}
.h-badge b i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(25,195,156,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(25,195,156,0)}100%{box-shadow:0 0 0 0 rgba(25,195,156,0)}}
.h-title{font-size:clamp(42px,6.4vw,92px);line-height:1.02;letter-spacing:-.035em;margin-top:22px;max-width:17ch;font-weight:500}
.h-title .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-bottom:-.08em}
.h-title .w>span{display:inline-block;animation:wUp 1s var(--ease) both;animation-delay:calc(var(--i)*.07s + .1s)}
@keyframes wUp{from{transform:translateY(110%) rotate(4deg)}}
.h-title em{font-style:italic;color:var(--cobalt);font-weight:400}
.pill{display:inline-block;vertical-align:middle;width:1.9em;height:.92em;border-radius:999px;overflow:hidden;position:relative;margin:0 .06em;top:-.05em;box-shadow:0 0 0 4px #fff,0 10px 30px -10px rgba(47,91,255,.6);animation:pillIn 1s .5s var(--ease) both}
@keyframes pillIn{from{width:0;opacity:0}}
.pill .ph{position:absolute;inset:0;opacity:0;transition:opacity .8s}
.pill .ph.on{opacity:1}
.h-lead{max-width:56ch;color:var(--fg-2);font-size:clamp(16px,1.35vw,18.5px);margin-top:22px;animation:rise .9s .45s var(--ease) both}
.h-cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:28px;animation:rise .9s .55s var(--ease) both}
.h-proof{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:13.5px;color:var(--muted);animation:rise .9s .65s var(--ease) both}
.avs{display:flex}
.avs .ph{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--bg);margin-left:-9px}
.avs .ph:first-child{margin-left:0}
.stars{color:var(--citrus-d);letter-spacing:1px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (max-width:640px){.h-badge .x2{display:none}.demo{font-size:11px;height:28px;padding-left:10px}.demo .x3{display:none}}
.bento{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:16px;margin-top:54px;align-items:stretch}
.bento .col{display:grid;gap:16px;align-content:start}
.bx{border-radius:var(--r);background:#fff;border:1px solid var(--line);padding:22px;position:relative;overflow:hidden}
.bx.cob{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.bx.cit{background:var(--citrus);border-color:var(--citrus)}
.bx .big{font-family:var(--f-serif);font-size:clamp(36px,3.4vw,52px);letter-spacing:-.03em;line-height:1}
.bx .lb{font-size:13.5px;opacity:.85;margin-top:6px}
.bx svg.spark{width:100%;height:70px;margin-top:14px;overflow:visible}
.bx svg.spark path.l{fill:none;stroke:var(--citrus);stroke-width:2.5;stroke-dasharray:600;stroke-dashoffset:600;transition:stroke-dashoffset 2s .3s var(--ease)}
.bx svg.spark path.a{fill:url(#spk);opacity:0;transition:opacity 1s 1.2s}
.bx.in svg.spark path.l{stroke-dashoffset:0}
.bx.in svg.spark path.a{opacity:1}
.bmain{border-radius:28px;min-height:480px;position:relative;overflow:hidden}
.bmain .ph{position:absolute;inset:0}
.bmain::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(11,22,64,.55))}
.slot{position:absolute;left:18px;right:18px;bottom:18px;z-index:2;display:flex;align-items:center;gap:14px;padding:14px 14px 14px 18px;border-radius:18px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.slot .dt{flex:1;min-width:0}
.slot small{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mint)}
.slot b{font-size:15.5px}
.bport{padding:0;min-height:300px;display:flex;flex-direction:column}
.bport .ph{flex:1;min-height:200px}
.bport .cap{padding:14px 16px;display:flex;align-items:center;gap:10px}
.bport .cap div{flex:1;min-width:0}
.bport .cap b{display:block;font-size:15px}
.bport .cap span{font-size:12.5px;color:var(--muted)}
.circ{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;border:0;text-decoration:none;flex:none;transition:transform .3s var(--ease),background .2s}
.circ:hover{transform:rotate(-45deg);background:var(--cobalt)}
.rot{height:1.3em;overflow:hidden;position:relative;font-family:var(--f-serif);font-size:24px;margin-top:6px}
.rot span{position:absolute;left:0;top:0;line-height:1.3em;white-space:nowrap;transition:transform .6s var(--ease),opacity .6s}
.rot span.out{transform:translateY(-110%);opacity:0}
.rot span.nx{transform:translateY(110%);opacity:0}
@media (max-width:980px){.bento{grid-template-columns:1fr 1fr}.bento .col.c2{grid-column:1/-1;order:-1}.bmain{min-height:380px}}
@media (max-width:600px){.bento{grid-template-columns:1fr}.bento .col{grid-template-columns:1fr 1fr}.bport{min-height:260px}}

/* marquee */
.logos{padding:40px 0 10px}
.logos p{text-align:center;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mq{overflow:hidden;margin-top:20px;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq .tr{display:flex;gap:60px;width:max-content;animation:mq 38s linear infinite}
.mq .lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;color:#7C88AD;letter-spacing:-.02em;white-space:nowrap}
.mq .lg svg{width:26px;height:26px}
@keyframes mq{to{transform:translateX(-50%)}}

/* ===== sections ===== */
section.s{padding-block:120px 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:42px}
.sh h2{font-size:clamp(34px,4.4vw,60px);letter-spacing:-.035em;max-width:17ch;margin-top:14px}
.sh h2 em{font-style:italic;color:var(--cobalt)}
.sh p{max-width:44ch;color:var(--fg-2)}

/* intro w/ word fill */
.intro{display:grid;grid-template-columns:1.4fr 1fr;gap:56px;align-items:end}
.fill{font-family:var(--f-serif);font-size:clamp(26px,2.9vw,42px);line-height:1.22;letter-spacing:-.02em;margin-top:18px}
.fill .wd{color:#C3CAE0;transition:color .3s}
.fill .wd.on{color:var(--ink)}
.fill .wd.hl.on{color:var(--cobalt)}
.intro .im{border-radius:28px;overflow:hidden;aspect-ratio:4/5}
.intro .im .ph{position:absolute;inset:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:56px}
.st{border-radius:var(--r);padding:26px 22px;background:#fff;border:1px solid var(--line);transition:transform .4s var(--ease),background .3s}
.st:hover{transform:translateY(-6px)}
.st b{font-family:var(--f-serif);font-weight:500;font-size:clamp(38px,3.6vw,54px);letter-spacing:-.03em;line-height:1;display:block}
.st span{display:block;margin-top:10px;font-size:14px;color:var(--fg-2)}
.st.hi{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.st.hi span{color:#DCE3FF}
@media (max-width:900px){.intro{grid-template-columns:1fr}.intro .im{aspect-ratio:16/10}.stats{grid-template-columns:1fr 1fr}}

/* services — pinned horizontal */
.hs{position:relative;margin-top:120px;background:var(--navy);color:#fff}
.hs-st{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.hs-st::before{content:"";position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(47,91,255,.45),transparent);left:-300px;top:-300px;pointer-events:none}
.hs-st::after{content:"";position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,200,61,.14),transparent);right:-200px;bottom:-250px;pointer-events:none}
.hs-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;position:relative;z-index:1}
.hs-head h2{font-size:clamp(34px,4.2vw,58px);letter-spacing:-.035em;max-width:14ch;margin-top:12px}
.hs-head h2 em{font-style:italic;color:var(--citrus)}
.hs-head .eyebrow{color:#9FB2FF}
.hs-ctr{display:flex;align-items:center;gap:14px;font-weight:700;color:#B7C3F0}
.hs-bar{width:160px;height:3px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.hs-bar i{display:block;height:100%;background:var(--citrus);transform-origin:left;transform:scaleX(0)}
.hs-track{display:flex;gap:22px;margin-top:40px;padding-left:max(28px,calc((100vw - 1240px)/2 + 28px));padding-right:10vw;will-change:transform;position:relative;z-index:1}
.sv{flex:none;width:clamp(300px,30vw,400px);border-radius:26px;background:var(--navy-2);border:1px solid rgba(255,255,255,.08);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:transform .5s var(--ease),border-color .3s}
.sv:hover{transform:translateY(-8px);border-color:rgba(255,200,61,.6)}
.sv .ph{height:210px;background:linear-gradient(135deg,#1C2E78,#0F1B4F)}
.sv .ph img{transition:transform 1s var(--ease)}
.sv:hover .ph img{transform:scale(1.06)}
.sv .bd{padding:22px 22px 24px;display:grid;gap:10px;flex:1}
.sv .no{font-family:var(--f-serif);font-size:15px;color:var(--citrus)}
.sv h3{font-family:var(--f-serif);font-size:27px;letter-spacing:-.02em}
.sv p{color:#B7C3F0;font-size:14.5px}
.sv ul{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.sv li{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#DCE3FF}
.sv .more{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-weight:700;padding-top:10px}
.sv .more span{width:40px;height:40px;border-radius:50%;background:var(--citrus);color:var(--ink);display:grid;place-items:center;transition:transform .35s var(--ease)}
.sv:hover .more span{transform:rotate(-45deg)}
.sv.end{background:var(--citrus);color:var(--ink);justify-content:center;align-items:flex-start;padding:30px;gap:16px}

/* process — line draws on scroll */
.proc{display:grid;grid-template-columns:1fr 1.25fr;gap:60px}
.proc-l{position:sticky;top:130px;align-self:start}
.proc-l h2{font-size:clamp(34px,4.2vw,56px);letter-spacing:-.035em;margin-top:14px}
.proc-l h2 em{font-style:italic;color:var(--cobalt)}
.proc-l p{color:var(--fg-2);margin-top:18px;max-width:40ch}
.steps{position:relative;padding-left:64px}
.steps svg.ln{position:absolute;left:21px;top:10px;width:4px;height:calc(100% - 20px);overflow:visible}
.steps svg.ln line{stroke:var(--line-2);stroke-width:3}
.steps svg.ln line.f{stroke:var(--cobalt);stroke-linecap:round}
.step{position:relative;padding:4px 0 70px}
.step:last-child{padding-bottom:0}
.step .dot{position:absolute;left:-64px;top:0;width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-serif);font-size:18px;color:var(--muted);transition:all .4s var(--ease)}
.step.on .dot{background:var(--cobalt);border-color:var(--cobalt);color:#fff;transform:scale(1.08);box-shadow:0 0 0 8px var(--cobalt-soft)}
.step h3{font-family:var(--f-serif);font-size:30px;letter-spacing:-.02em;transition:color .3s;color:var(--muted)}
.step.on h3{color:var(--ink)}
.step p{color:var(--fg-2);margin-top:10px;max-width:48ch}
.step .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media (max-width:900px){.proc{grid-template-columns:1fr;gap:34px}.proc-l{position:static}}

/* calculator */
.calc{display:grid;grid-template-columns:.9fr 1.3fr;gap:0;border-radius:32px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 40px 80px -60px rgba(13,26,58,.5)}
.calc-l{padding:34px;display:grid;gap:22px;align-content:start;border-right:1px solid var(--line)}
.rg{display:grid;gap:8px}
.rg .t{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px;color:var(--fg-2)}
.rg .t b{font-family:var(--f-serif);font-size:22px;color:var(--ink);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--cobalt) var(--p,50%),var(--cobalt-soft) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--cobalt);box-shadow:0 4px 10px rgba(47,91,255,.35);cursor:grab;transition:transform .15s}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.15)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--cobalt);cursor:grab}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--bg)}
.seg button{height:42px;border:0;border-radius:11px;background:transparent;font-weight:700;font-size:13.5px;color:var(--fg-2);transition:all .2s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 4px 12px -6px rgba(13,26,58,.3)}
.calc-r{padding:34px;background:linear-gradient(180deg,#FBFCFF,#F2F5FF);display:grid;gap:18px;align-content:start}
.calc-r .res{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.calc-r .res b{font-family:var(--f-serif);font-size:clamp(40px,4.6vw,64px);letter-spacing:-.035em;line-height:1;font-weight:500}
.calc-r .res small{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
.legend{display:flex;gap:16px;font-size:13px;font-weight:600;color:var(--fg-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:260px;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--f-ui)}
.chart .tip{pointer-events:none}
.brk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.brk div{border-radius:14px;background:#fff;border:1px solid var(--line);padding:12px 14px}
.brk small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.brk b{font-size:17px}
.disc{font-size:12px;color:var(--muted)}
@media (max-width:900px){.calc{grid-template-columns:1fr}.calc-l{border-right:0;border-bottom:1px solid var(--line)}.calc-l,.calc-r{padding:22px}.brk{grid-template-columns:1fr 1fr 1fr}.brk b{font-size:14px}}

/* stacking cards */
.stack{display:grid;gap:26px;margin-top:10px}
.sc{position:sticky;top:calc(110px + var(--k)*18px);border-radius:32px;padding:44px;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;min-height:420px;transform-origin:center top;transition:filter .2s;will-change:transform}
.sc:nth-child(1){background:#fff;border:1px solid var(--line)}

/* advisors */

.art .cover{border-radius:30px;height:420px;margin:30px 0}
.art .body p{font-size:18.5px;line-height:1.72;color:var(--fg-2);margin-bottom:20px}
.art .body p:first-child::first-letter{font-family:var(--f-serif);float:left;font-size:72px;line-height:.9;padding:6px 10px 0 0;color:var(--cobalt)}
.art .body h3{font-family:var(--f-serif);font-size:28px;margin:34px 0 12px}
.art .share{display:flex;gap:10px;align-items:center;border-top:1.5px solid var(--line);padding-top:22px;margin-top:30px}
.rprog{position:fixed;left:0;top:0;height:3px;background:var(--citrus);z-index:61;width:100%;transform-origin:left;transform:scaleX(0)}

/* image containers */
.sd-hero,.art .cover,.off-img{position:relative;overflow:hidden}
.sd-hero .ph,.art .cover .ph,.off-img .ph{position:absolute;inset:0}

/* booking */
.bk{display:grid;grid-template-columns:280px 1fr;gap:22px;margin-top:10px}
.bk-side{position:sticky;top:110px;align-self:start;display:grid;gap:8px}
.bk-s{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;font-weight:700;color:var(--muted);border:1.5px solid transparent;background:none;text-align:left;width:100%}
.bk-s i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#fff;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:13px;flex:none}
.bk-s.on{background:#fff;border-color:var(--line);color:var(--ink)}
.bk-s.on i{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.bk-s.dn{color:var(--ink)}
.bk-s.dn i{background:var(--mint);border-color:var(--mint);color:#fff}
.bk-s small{display:block;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.bk-main{border-radius:28px;background:#fff;border:1px solid var(--line);padding:30px;min-height:460px}
.bk-main h2{font-size:34px;letter-spacing:-.03em}
.bk-main>p{color:var(--fg-2);margin-top:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:22px}
.op{border-radius:18px;border:1.5px solid var(--line);background:#fff;padding:16px;text-align:left;display:grid;gap:6px;transition:all .2s;animation:rise .45s var(--d,0s) var(--ease) both}
.op:hover{border-color:var(--cobalt-2)}
.op[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:0 0 0 4px var(--cobalt-soft)}
.op b{font-size:16px}
.op span{font-size:13.5px;color:var(--muted)}
.op .ph{width:52px;height:52px;border-radius:50%}
.op .ic{width:42px;height:42px;border-radius:12px;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center}
.cal{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;margin-top:22px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-h b{font-size:17px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-g .dw{font-size:12px;font-weight:800;color:var(--muted);padding:6px 0}
.cal-g button{aspect-ratio:1;border-radius:12px;border:0;background:var(--bg);font-weight:700;font-size:14px;position:relative}
.cal-g button:disabled{background:none;color:#B9C1DB;cursor:default}
.cal-g button:not(:disabled):hover{background:var(--cobalt-soft)}
.cal-g button[aria-pressed="true"]{background:var(--cobalt);color:#fff}
.cal-g button .av{position:absolute;bottom:6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--mint)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.times button{height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.times button:hover{border-color:var(--cobalt)}
.times button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.times button:disabled{text-decoration:line-through;color:#B9C1DB;background:var(--bg);border-color:transparent;cursor:not-allowed}
.tzb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.bk-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:28px;padding-top:20px;border-top:1.5px solid var(--line)}
.conf{text-align:center;display:grid;justify-items:center;gap:14px;padding:20px 0}
.conf .ok{width:84px;height:84px;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;animation:okp .7s var(--ease) both}
.conf .ok svg{width:40px;height:40px;stroke-width:2.6;stroke-dasharray:30;stroke-dashoffset:30;animation:dr .6s .35s forwards}
@keyframes okp{from{transform:scale(0)}}
@keyframes dr{to{stroke-dashoffset:0}}
.sum{width:100%;max-width:460px;border-radius:20px;background:var(--bg);padding:18px;display:grid;gap:8px;text-align:left}
.sum div{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.sum span{color:var(--muted)}
.mybk{margin-top:26px;display:grid;gap:10px}
.mb{display:flex;align-items:center;gap:14px;border-radius:18px;background:#fff;border:1px solid var(--line);padding:14px 16px;flex-wrap:wrap}
.mb .d{width:58px;text-align:center;border-radius:12px;background:var(--cobalt-soft);padding:6px 0;color:var(--cobalt-d)}
.mb .d b{display:block;font-family:var(--f-serif);font-size:24px;line-height:1}
.mb .d small{font-size:11px;font-weight:800;text-transform:uppercase}
.mb .t{flex:1;min-width:180px}
.mb .t b{display:block}
.mb .t span{font-size:13.5px;color:var(--muted)}
@media (max-width:900px){.bk{grid-template-columns:1fr}.bk-side{position:static;grid-template-columns:repeat(5,1fr);gap:4px}.bk-s{justify-content:center;padding:8px}.bk-s span{display:none}.bk-main{padding:20px}.cal{grid-template-columns:1fr}}

/* modal & toast */
.mdl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(11,22,64,.45);backdrop-filter:blur(6px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.mdl .bx2{width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:30px;background:#fff;display:grid;grid-template-columns:.9fr 1.1fr;animation:pop .35s var(--ease)}
.mdl .bx2 .ph{min-height:360px}
.mdl .in{padding:30px;display:grid;gap:12px;align-content:start;position:relative}
.mdl .x{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center}
.mdl h3{font-family:var(--f-serif);font-size:34px;letter-spacing:-.02em;padding-right:40px}
.mdl .cred{display:flex;gap:6px;flex-wrap:wrap}
.mdl p{color:var(--fg-2)}
.mdl .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.mdl .kv span{color:var(--muted)}
@media (max-width:760px){.mdl .bx2{grid-template-columns:1fr}.mdl .bx2 .ph{min-height:260px}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:grid;gap:8px}
.toast{background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);animation:pop .3s var(--ease)}
.toast svg{color:var(--mint)}
.cur-sel{height:40px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;padding:0 34px 0 14px;font-weight:700;font-size:13.5px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px;background-repeat:no-repeat}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none;filter:none;clip-path:none}}
</style>
