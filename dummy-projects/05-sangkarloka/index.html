<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Sangkarloka · Mini Plant House</title>
<meta name="description" content="Sangkarloka — mini succulent & cactus house. Tanaman mini siap kirim dengan pot goni, kartu ucapan dan box gantung. Website by Organoo Studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one dark, leafy hero "greenhouse window" (rounded, full-width) with pill navigation and a giant word; everything after sits on warm cream paper with kraft and burlap accents taken from the real Sangkarloka packaging. Light-only by design. */
:root{
  color-scheme:light;
  --leaf:#658F33; --leaf-2:#77AB3F; --leaf-soft:#EAF3DD; --forest:#2C4416; --moss:#4B6E24;
  --kraft:#77AB3F; --burlap:#DCEBC6; --cream:#F7FAF1; --sand:#EDF4E2; --paper:#FFFFFF;
  --ink:#1D2B11; --fg-2:#3C4D2B; --muted:#687859; --line:#E1EBD2; --line-2:#CADAB3;
  --terra:#C9774E; --sun:#F4D35E; --good:#4E8A24; --bad:#C0463F;
  --f-display:"Unbounded","DM Sans",ui-sans-serif,system-ui,sans-serif;
  --f-ui:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Segoe Print",cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:700;line-height:1.1;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--leaf);outline-offset:3px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px}
@media (max-width:600px){.wrap{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf)}
.ph{position:relative;overflow:hidden;background:var(--sand)}
.ph>svg{position:absolute;inset:0;width:100%;height:100%}
.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 22px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.btn:hover{background:var(--ink);color:var(--cream)}
.btn:active{transform:scale(.98)}
.btn.leaf{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.leaf:hover{background:var(--moss);border-color:var(--moss)}
.btn.dark{background:var(--ink);color:var(--cream)}
.btn.dark:hover{background:var(--moss);border-color:var(--moss)}
.btn.wa{background:#25D366;border-color:#25D366;color:#0B3B1C}
.btn.wa:hover{background:#1FB857;color:#0B3B1C}
.btn.sm{height:36px;padding:0 15px;font-size:13px}
.btn.lg{height:54px;padding:0 28px;font-size:15.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.circle{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--cream);display:grid;place-items:center;flex:none;transition:transform .3s cubic-bezier(.3,1.4,.5,1),background .2s}
.circle:hover{transform:scale(1.08);background:var(--leaf)}
.circle.ok{background:var(--good)}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--paper);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.input{width:100%;height:48px;padding:0 16px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--paper);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:92px;padding:12px 16px;resize:vertical}
.input:focus{border-color:var(--leaf);box-shadow:0 0 0 4px var(--leaf-soft)}
.input.err{border-color:var(--bad)}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--fg-2)}
.err-t{font-size:12.5px;color:var(--bad)}
.stars{display:inline-flex;gap:1px;color:#E0A526}
.stars svg{width:13px;height:13px;fill:currentColor;stroke:none}
.pill-tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--leaf-soft);color:var(--moss)}
.pill-tag.warn{background:#FBEBD6;color:#9A5B1E}
.pill-tag.dark{background:var(--ink);color:var(--cream)}

/* ===== NAV (light, shared by every page) ===== */
.gnav{display:flex;align-items:center;gap:8px;padding:10px 12px}
.gnav .brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:10px}
.gnav .brand span.mark{width:44px;height:44px;border-radius:14px;background:var(--leaf-soft);display:grid;place-items:center}
.gnav .brand img{width:30px}
.gnav .brand b{font-family:var(--f-display);font-size:15px;letter-spacing:.02em;line-height:1;color:var(--leaf)}
.gnav .brand small{display:block;font-size:10px;letter-spacing:.22em;color:var(--muted);margin-top:4px}
.gp{height:42px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;background:transparent;color:var(--ink);display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;transition:background .2s,color .2s,border-color .2s}
.gp:hover{background:var(--leaf-soft)}
.gp[aria-current="page"]{background:var(--leaf);color:#fff}
.gp.icon{width:42px;padding:0;justify-content:center;position:relative;border-color:var(--line-2)}
.gp.icon:hover{border-color:var(--leaf);color:var(--leaf);background:transparent}
.gnav .sp{flex:1}
.cartn{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:999px;background:var(--leaf);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.lang{display:inline-flex;height:42px;border-radius:999px;border:1.5px solid var(--line-2);padding:3px}
.lang button{border:0;background:transparent;color:var(--fg-2);border-radius:999px;padding:0 12px;font-weight:700;font-size:12.5px}
.lang button[aria-pressed="true"]{background:var(--leaf);color:#fff}
.topbar{position:sticky;top:10px;z-index:30;margin:10px auto 0;max-width:1240px;width:calc(100% - 28px);border-radius:22px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px -20px rgba(45,70,20,.35)}
.burger{display:none}
.mmenu{display:none}
@media (max-width:900px){
  .gnav .gp:not(.icon),.gnav .lang{display:none}.burger{display:inline-flex!important}
  .mmenu.open{display:grid;gap:6px;padding:4px 10px 12px}
  .mmenu a{display:flex;padding:12px 14px;border-radius:14px;text-decoration:none;font-weight:700;background:var(--cream)}
  .mmenu .lang{display:inline-flex;justify-self:start}
}

/* ===== HERO: plant shelf ===== */
main{overflow-x:clip}
.hz{padding-top:18px}
.hz-in{position:relative;background:linear-gradient(180deg,#F1F8E7 0%,#E8F3DA 100%);border-radius:36px;padding:64px 0 0;overflow:hidden;isolation:isolate}
.hz-in::before{content:"";position:absolute;inset:auto -10% 30% -10%;height:60%;background:radial-gradient(50% 60% at 50% 70%,rgba(119,171,63,.22),transparent 70%);z-index:-1}
.hz-h{margin:0 auto;max-width:15ch;text-align:center;font-family:var(--f-display);font-weight:700;font-size:clamp(40px,5vw,72px);line-height:.94;letter-spacing:-.06em;color:var(--forest);position:relative;z-index:1}
.hz-h span{display:block;animation:hzUp 1s cubic-bezier(.2,.9,.2,1) both}
.hz-h .w2{animation-delay:.12s;color:var(--leaf)}
@keyframes hzUp{from{opacity:0;transform:translateY(40px)}}
.hz-prod{position:absolute;left:5%;top:36px;width:170px;text-decoration:none;display:grid;justify-items:center;gap:2px;z-index:3;animation:rise .9s .5s both}
.hz-prod .im{width:120px;height:160px;display:grid;place-items:end center;position:relative}
.hz-prod .im::after{content:"";position:absolute;bottom:-4px;left:18%;right:18%;height:12px;border-radius:50%;background:rgba(40,70,15,.18);filter:blur(4px);z-index:-1}
.hz-prod img{height:160px;width:auto;max-width:none;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.hz-prod:hover img{transform:translateY(-6px) rotate(-3deg)}
.hz-prod .go{position:absolute;top:118px;right:14px;width:44px;height:44px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;transform:rotate(-45deg);transition:transform .35s,background .2s}
.hz-prod:hover .go{transform:rotate(0);background:var(--leaf)}
.hz-prod .nm{font-size:14px;color:var(--fg-2);margin-top:10px}
.hz-prod b{font-family:var(--f-display);font-size:22px;color:var(--forest);letter-spacing:-.02em}
.hz-ig{position:absolute;right:5%;top:48px;width:158px;background:#fff;border-radius:18px;padding:6px 6px 12px;text-decoration:none;z-index:3;box-shadow:0 18px 40px -26px rgba(40,70,15,.5);animation:rise .9s .6s both;transition:transform .3s}
.hz-ig:hover{transform:translateY(-4px) rotate(1.5deg)}
.hz-ig .ph{height:150px;border-radius:13px}
.hz-ig .pl{position:absolute;left:50%;top:130px;translate:-50% 0;width:42px;height:42px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;border:3px solid #fff}
.hz-ig .tx{display:block;text-align:center;font-size:12.5px;line-height:1.35;margin-top:26px;padding:0 6px;color:var(--fg-2)}
.hz-row{display:grid;grid-template-columns:1fr 1.28fr 1fr;margin-top:-10px;position:relative}
.shelf{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:clamp(320px,31vw,460px)}
.shelf.c{margin-top:0}
.shelf .pl{position:absolute;left:50%;bottom:calc(var(--ph) - var(--sink));transform:translateX(-50%);z-index:0;filter:drop-shadow(0 20px 22px rgba(40,70,15,.22));animation:grow 1.1s cubic-bezier(.2,1.2,.3,1) both;transition:translate .5s ease-out}
.shelf.l .pl{width:min(62%,228px);--sink:62px;animation-delay:.35s}
.shelf.c .pl{width:min(52%,290px);--sink:125px;animation-delay:.2s}
.shelf.r .pl{width:min(58%,220px);--sink:44px;animation-delay:.45s}
@keyframes grow{from{transform:translate(-50%,55%);opacity:0}}
.shelf .pan{--ph:0px;position:relative;z-index:1;height:210px;padding:26px 28px;display:grid;align-content:center;justify-items:center;text-align:center;gap:8px}
.shelf{--ph:210px}
.shelf.l .pan,.shelf.r .pan{background:#C9E3A6}
.shelf.c .pan{background:var(--forest);color:#fff;border-radius:0}
.shelf.l .pan{border-top-left-radius:0}
.pan .big{display:flex;align-items:center;gap:12px}
.pan .big b{font-family:var(--f-display);font-size:clamp(34px,3.6vw,54px);letter-spacing:-.05em;color:var(--forest);line-height:1}
.pan p{font-size:14px;color:var(--moss);max-width:28ch;line-height:1.4}
.pan .add-c,.pan .tk{width:46px;height:46px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.pan .add-c:hover{transform:rotate(90deg) scale(1.06);background:var(--leaf)}
.pan .tk{background:#fff;color:var(--leaf)}
.shelf.c .pan p.t{font-family:var(--f-display);font-size:clamp(18px,1.8vw,24px);line-height:1.2;letter-spacing:-.02em;color:#fff;max-width:18ch}
.hz-cta{display:inline-flex;align-items:center;gap:14px;height:56px;padding:0 8px 0 26px;border-radius:999px;background:var(--sun);color:var(--forest);font-weight:800;text-decoration:none;margin-top:6px;transition:transform .2s}
.hz-cta span{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .3s}
.hz-cta:hover span{transform:translateX(4px)}
.hz-cta:active{transform:scale(.97)}
@media (max-width:1000px){.hz-prod{left:2%;width:130px}.hz-prod .im{width:90px;height:120px}.hz-prod img{height:120px}.hz-prod .go{top:84px;right:6px;width:38px;height:38px}.hz-ig{right:2%;width:128px}.hz-ig .ph{height:110px}.hz-ig .pl{top:94px}}
@media (max-width:760px){
  .hz{padding-inline:12px}
  .hz-in{padding-top:36px;border-radius:28px}
  .hz-h{font-size:clamp(30px,9.2vw,60px)}
  .hz-prod,.hz-ig{display:none}
  .hz-row{grid-template-columns:1fr 1fr;margin-top:0}
  .shelf.c{grid-column:1/-1;order:-1;margin-top:0;min-height:400px}
  .shelf{min-height:290px;--ph:190px}
  .shelf .pan{height:190px;padding:18px 14px}
  .shelf.c .pl{width:min(56%,240px)}
  .shelf.l .pl{width:86%;--sink:30px}.shelf.r .pl{width:70%;--sink:34px}
  .pan p{font-size:12.5px}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}


/* ===== plant match: sentence builder ===== */
.pm{display:grid;grid-template-columns:1.5fr .9fr;gap:48px;align-items:start}
.pm-h{font-size:clamp(28px,3.4vw,44px);letter-spacing:-.04em;margin-top:10px;max-width:20ch}
.pm-sent{font-family:var(--f-display);font-size:clamp(20px,2.2vw,30px);line-height:1.6;letter-spacing:-.02em;color:var(--fg-2);margin-top:26px;max-width:34ch}
.blank{font:inherit;border:0;background:none;padding:0 4px;margin:0 2px;color:var(--leaf);border-bottom:3px dashed var(--line-2);border-radius:0;cursor:pointer;min-width:5.5em;display:inline-block;text-align:left;line-height:1.2;transition:color .2s,border-color .2s,background .2s}
.blank span{display:inline-block;min-width:5em}
.blank.on{border-bottom:3px solid var(--leaf-2);background:linear-gradient(transparent 62%,#DDEEC6 0)}
.blank.cur{border-bottom-color:var(--leaf);animation:blink 1.4s ease-in-out infinite}
.blank.on.cur{animation:none;background:linear-gradient(transparent 62%,#CBE5A8 0)}
@keyframes blink{50%{border-bottom-color:transparent}}
.pm-q{display:flex;align-items:center;gap:12px;margin:30px 0 14px;font-weight:700;color:var(--ink)}
.pm-q .pm-n{height:30px;min-width:44px;padding:0 10px;border-radius:999px;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:13px}
.pm-q .link{margin-left:auto}
.pm-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pm-t{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:8px;text-align:left;display:grid;gap:10px;transition:border-color .2s,transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .2s;animation:rise .5s var(--d,0ms) both}
.pm-t:hover{transform:translateY(-4px);border-color:var(--leaf-2);box-shadow:0 16px 30px -22px rgba(45,70,20,.5)}
.pm-t.sel{border-color:var(--leaf);box-shadow:0 0 0 3px #DDEEC6}
.pm-t .ph{aspect-ratio:4/3;border-radius:15px}
.pm-t .ph.dr{background:var(--leaf-soft);display:grid;place-items:center}
.pm-t .ph.dr svg{position:static;width:58%;height:auto}
.pm-t .lb{padding:0 6px 6px;display:grid;gap:2px}
.pm-t .lb b{font-size:14.5px}
.pm-t .lb small{font-size:12.5px;color:var(--muted)}
.pm-r{position:sticky;top:100px}
.pm-r .tag{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:26px 26px 22px 22px;padding:22px 20px 20px;display:grid;gap:6px;transform:rotate(-1deg);box-shadow:0 30px 60px -40px rgba(45,70,20,.55)}
.pm-r .tag::before{content:"";position:absolute;left:50%;top:-38px;width:2px;height:40px;background:var(--line-2)}
.pm-r .hole{position:absolute;left:50%;top:10px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--cream);box-shadow:inset 0 0 0 2px var(--line-2)}
.pm-r .lbl{justify-self:start;margin-top:10px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf)}
.pm-r .im{display:block;border-radius:18px;overflow:hidden;margin:6px 0 8px}
.pm-r .im .ph{aspect-ratio:5/4}
.pm-r .nm{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.03em;text-decoration:none}
.pm-r i{font-size:13px;color:var(--muted)}
.pm-r ul{list-style:none;padding:0;margin:8px 0 2px;display:grid;gap:6px}
.pm-r li{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg-2)}
.pm-r li svg{width:18px;height:18px;padding:3px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf)}
.pm-r .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1.5px dashed var(--line);padding-top:12px;margin-top:8px}
.pm-r .ft b{font-family:var(--f-display);font-size:19px}
.pm-r .alt{display:grid;gap:4px;margin-top:6px}
.pm-r .alt small{color:var(--muted);font-size:12px}
.pm-r .alt a{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;text-decoration:none;padding:6px 0;border-bottom:1px solid var(--line)}
@media (max-width:900px){.pm{grid-template-columns:1fr;gap:34px}.pm-r{position:static;max-width:380px}.pm-opts{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pm-t{padding:5px;border-radius:16px}.pm-t .ph{border-radius:11px}.pm-t .lb b{font-size:12.5px}.pm-t .lb small{display:none}}

/* marquee */
.ticker{overflow:hidden;background:var(--leaf);color:#fff;padding:15px 0;margin-top:36px;transform:rotate(-1.2deg) scale(1.02)}
.ticker .track{display:flex;gap:34px;width:max-content;animation:mq 34s linear infinite;font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.02em}
.ticker span{display:flex;gap:34px;align-items:center;white-space:nowrap}
.ticker span::after{content:"✿";color:#D6EBB8}
@keyframes mq{to{transform:translateX(-50%)}}

/* sections */
section.s{padding-block:96px 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.sh h2{font-size:clamp(28px,3.8vw,48px);max-width:18ch;letter-spacing:-.04em}
.sh h2 .hand{font-family:var(--f-hand);font-weight:600;color:var(--leaf);font-size:1.2em;letter-spacing:0}
.sh p{max-width:44ch;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:800px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
.card{display:flex;flex-direction:column;gap:12px;position:relative}
.card .img{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:4/5;background:var(--sand);display:block}
.card .img .ph{position:absolute;inset:0;background:transparent}
.card:hover .img .ph>img{transform:scale(1.06)}
.card .img .ph>svg{transition:transform .6s}
.card:hover .img .ph>svg{transform:translateY(-6px) rotate(-2deg)}
.card .badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.card .imgw{position:relative}
.card .badges .pill-tag{background:rgba(255,253,248,.92)}
.card .badges .pill-tag.dark{background:var(--forest);color:#fff}
.card .add{position:absolute;right:12px;bottom:12px;z-index:2}
.card .meta{display:grid;gap:3px;padding:0 4px}
.card .meta a{text-decoration:none;font-weight:700;font-size:15.5px}
.card .meta i{font-size:12.5px;color:var(--muted)}
.card .meta .row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.card .meta .price{font-family:var(--f-display);font-size:15px;font-weight:700}

const CARE=()=>L()==='id'?[['Menyiram','Succulent lebih cepat mati karena kebanyakan air daripada kekeringan. Siram hanya saat media tanam benar-benar kering.',['Tusuk media dengan tusuk gigi. Jika keluar bersih dan kering, saatnya menyiram.','Siram sampai air keluar dari lubang pot, lalu buang sisa air di tatakan.','Jangan menyemprot daun roset; air yang menggenang di tengah bisa membuat busuk.']],['Cahaya','Kebanyakan succulent butuh 3–4 jam cahaya terang per hari. Tanda kurang cahaya: batang memanjang dan warna memudar.',['Taruh dekat jendela timur untuk matahari pagi yang lembut.','Putar pot seperempat putaran tiap minggu agar tumbuh simetris.','Haworthia dan terarium paling tahan cahaya tidak langsung.']],['Media tanam','Media harus porous supaya air cepat turun. Semua tanaman kami dikirim dengan campuran siap pakai.',['Campuran kami: sekam bakar, pasir malang, pumice dan sedikit kompos.','Hindari tanah kebun biasa yang padat dan menahan air.','Tambahkan pupuk slow release sedikit setiap 3 bulan.']],['Pot & ganti pot','Pot goni kami sudah dilapisi pot plastik berlubang di dalamnya, jadi aman disiram langsung.',['Ganti pot setiap 12–18 bulan atau saat akar keluar dari lubang.','Pilih pot 1–2 cm lebih besar, jangan terlalu jauh.','Diamkan 2–3 hari tanpa disiram setelah ganti pot agar akar pulih.']]]:[['Watering','Succulents die from too much water far more often than from drought. Only water when the mix is completely dry.',['Poke the mix with a toothpick. If it comes out clean and dry, it is time to water.','Water until it drains from the pot, then empty the saucer.','Do not mist rosettes; water sitting in the centre can cause rot.']],['Light','Most succulents want 3–4 hours of bright light a day. Signs of too little: stretched stems and faded colour.',['Place near an east-facing window for gentle morning sun.','Turn the pot a quarter turn each week so it grows evenly.','Haworthia and terrariums cope best with indirect light.']],['Soil mix','The mix must be porous so water drains fast. Every plant ships in our ready-to-use blend.',['Our blend: burnt rice husk, volcanic sand, pumice and a little compost.','Avoid regular garden soil, which is dense and holds water.','Add a pinch of slow-release fertiliser every 3 months.']],['Pots & repotting','Our burlap pots have a perforated plastic liner inside, so you can water them directly.',['Repot every 12–18 months or when roots poke out of the drainage hole.','Choose a pot only 1–2 cm larger.','Wait 2–3 days before watering after repotting so the roots can heal.']]];
