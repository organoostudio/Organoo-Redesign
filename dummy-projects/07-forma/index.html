<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>FORMA · Fitness & Recovery Club</title>
<meta name="description" content="FORMA is a fictional fitness and recovery club with QR check-in, class booking and a member portal. Portfolio demo by Organoo Studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* FORMA — palette from Organoo: ink #1C1C1C, mist #F2F2F2, lime #A1EA93, white. Bold expanded display type, soft cards, calm but energetic. */
:root{
  color-scheme:light;
  --ink:#1C1C1C; --ink-2:#2B2B2B; --mist:#F2F2F2; --lime:#A1EA93; --lime-d:#7FD36E; --lime-soft:#E3F8DE; --white:#FFFFFF;
  --fg-2:#3D3D3D; --muted:#707070; --line:#E3E3E3; --line-2:#D0D0D0;
  --ok:#3FAE4F; --warn:#E9A23B; --warn-soft:#FDF1DC; --bad:#E5534B; --bad-soft:#FDE7E5;
  --t-yoga:#E6EBFF; --t-pil:#FCE8F2; --t-hiit:#FFE9DA; --t-str:#EDEDED; --t-mob:#E3F8DE; --t-rec:#EEE7FF;
  --f-d:"Archivo","Arial Black",ui-sans-serif,system-ui,sans-serif;
  --f-ui:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;font-family:var(--f-d);font-weight:800;line-height:1;letter-spacing:-.02em;text-wrap:balance}
.xp{font-stretch:118%;text-transform:uppercase;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1280px;margin:0 auto;padding-inline:28px}
@media (max-width:640px){.wrap{padding-inline:16px}}
main{overflow-x:clip}
.ph{position:relative;overflow:hidden;background:var(--mist)}
.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av{border-radius:50%;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;color:var(--ink);overflow:hidden;flex:none;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px var(--lime-soft)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .15s}
.btn:hover{background:var(--ink);color:#fff}
.btn:active{transform:scale(.97)}
.btn.ink{background:var(--ink);color:#fff}
.btn.ink:hover{background:#000}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.btn.lime:hover{background:var(--lime-d);border-color:var(--lime-d)}
.btn.ghost{border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.white{background:#fff;border-color:#fff;color:var(--ink)}
.btn.sm{height:38px;padding:0 16px;font-size:13.5px}
.btn.lg{height:56px;padding:0 28px;font-size:16px}
.btn .go{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;margin-right:-12px;transition:transform .3s var(--ease)}
.btn.ink .go{background:var(--lime);color:var(--ink)}
.btn:hover .go{transform:rotate(-45deg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chip{height:40px;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;font-weight:700;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;transition:all .2s}
.chip:hover{background:var(--mist)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.input,.sel{width:100%;height:50px;padding:0 16px;border:1.5px solid var(--line-2);border-radius:14px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:96px;padding:12px 16px;resize:vertical}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.input:focus,.sel:focus{border-color:var(--ink);box-shadow:0 0 0 4px var(--lime-soft)}
.input.err,.sel.err{border-color:var(--bad)}
.field{display:grid;gap:7px}
.field label{font-size:13.5px;font-weight:700;color:var(--fg-2)}
.err-t{font-size:13px;color:var(--bad);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--mist)}
.pill.ok{background:var(--lime-soft);color:#23702E}
.pill.warn{background:var(--warn-soft);color:#8A5A0B}
.pill.bad{background:var(--bad-soft);color:#A52A23}
.pill.dark{background:var(--ink);color:#fff}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}

/* chrome */
.ann{background:var(--ink);color:#fff;font-size:13.5px;text-align:center;padding:9px 16px}
.ann b{color:var(--lime)}
.ann a{color:#fff;font-weight:700}
.nav{position:sticky;top:0;z-index:50;transition:all .35s var(--ease)}
.nav .bar{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:16px 28px;transition:all .35s var(--ease)}
.nav.small .bar{margin-top:10px;max-width:1220px;padding:8px 8px 8px 18px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;box-shadow:0 18px 40px -30px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:20px}
.logo .m{width:38px;height:38px;border-radius:12px;background:var(--lime);display:grid;place-items:center;transition:transform .5s var(--ease)}
.logo:hover .m{transform:rotate(-12deg)}
.logo b{font-family:var(--f-d);font-weight:900;font-stretch:125%;font-size:22px;letter-spacing:.02em}
.nl{display:flex;gap:2px;padding:4px;border:1.5px solid var(--line);border-radius:999px;background:#fff}
.nl a{padding:8px 15px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14.5px;color:var(--fg-2);transition:all .2s}
.nl a:hover{background:var(--mist);color:var(--ink)}
.nl a[aria-current="page"]{background:var(--ink);color:#fff}
.nav .sp{flex:1}
.nav .ib{height:44px;padding:0 14px 0 6px;border-radius:999px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px}
.nav .ib .av{width:32px;height:32px;background:var(--lime);font-size:13px}
.burger{display:none!important;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;place-items:center}
.mm{display:none}
@media (max-width:1040px){
  .nl,.nav .jn{display:none}.burger{display:grid!important}.nav .ib span.t{display:none}.nav .ib{padding:0 6px}
  .mm.open{display:grid;gap:6px;position:fixed;top:74px;left:14px;right:14px;z-index:55;background:#fff;border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5);animation:pop .3s var(--ease)}
  .mm a{padding:14px 16px;border-radius:14px;text-decoration:none;font-weight:700;background:var(--mist)}
  .mm a.btn{background:var(--lime);justify-content:center;border:0}
  .nav .bar{padding:12px 16px}.nav.small .bar{margin-inline:10px;padding:7px 7px 7px 14px}
}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.rv{opacity:0;transform:translateY(30px);transition:opacity .85s var(--ease),transform .85s var(--ease);transition-delay:var(--dl,0s)}
.rv.in{opacity:1;transform:none}
.rv.zoom .ph>img{transform:scale(1.15);transition:transform 1.4s var(--ease)}
.rv.zoom.in .ph>img{transform:scale(1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* ===== HERO ===== */
.hero{padding:14px 0 0}
.hz{position:relative;border-radius:40px;background:var(--mist);min-height:min(88vh,780px);overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr;isolation:isolate}
.hz-l{padding:64px 0 48px 56px;display:flex;flex-direction:column;z-index:3}
.hz-tag{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--fg-2);animation:rise .8s both}
.hz-tag b{background:var(--lime);padding:3px 10px;border-radius:999px;color:var(--ink)}
.hz h1{font-size:clamp(50px,7.2vw,112px);line-height:.9;letter-spacing:-.045em;margin-top:22px;font-weight:900}
.hz h1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
.hz h1 .ln>span{display:inline-block;animation:lnUp 1s var(--ease) both;animation-delay:calc(var(--i)*.1s + .1s)}
.hz h1 .hl{position:relative;z-index:0;font-weight:500;font-style:italic}
.hz h1 .hl::after{content:"";position:absolute;left:-.08em;right:-.08em;bottom:.08em;height:.36em;background:var(--lime);z-index:-1;border-radius:.1em;transform-origin:left;animation:hlIn .8s .8s var(--ease) both}
@keyframes lnUp{from{transform:translateY(105%)}}
@keyframes hlIn{from{transform:scaleX(0)}}
.hz .lead{max-width:44ch;color:var(--fg-2);font-size:17.5px;margin-top:24px;animation:rise .9s .4s both}
.hz-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px;animation:rise .9s .5s both}
.hz-chips a{height:38px;padding:0 16px;border-radius:999px;border:1.5px solid var(--ink);display:inline-flex;align-items:center;font-weight:600;font-size:14px;text-decoration:none;background:rgba(255,255,255,.6);transition:all .2s}
.hz-chips a:hover{background:var(--ink);color:#fff}
.hz-cta{display:flex;gap:12px;align-items:center;margin-top:auto;padding-top:34px;animation:rise .9s .6s both;flex-wrap:wrap}
.sq{width:84px;height:84px;border-radius:24px;background:var(--lime);display:grid;place-items:center;text-decoration:none;box-shadow:0 0 0 8px rgba(161,234,147,.35);transition:transform .35s var(--ease),box-shadow .35s}
.sq:hover{transform:rotate(-8deg) scale(1.04);box-shadow:0 0 0 14px rgba(161,234,147,.3)}
.sq svg{width:34px;height:34px;stroke-width:2.2}
.hz-r{position:relative}
.blob{position:absolute;right:-8%;bottom:-18%;width:min(640px,58vw);aspect-ratio:1;border-radius:50%;background:var(--lime);animation:blobIn 1.2s .1s var(--ease) both}
.blob::before{content:"";position:absolute;inset:-9%;border-radius:50%;border:2px dashed rgba(28,28,28,.18);animation:spin 60s linear infinite}
@keyframes blobIn{from{transform:scale(.4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.athlete{position:absolute;right:4%;bottom:0;height:96%;max-width:none;z-index:1;filter:drop-shadow(0 30px 30px rgba(0,0,0,.18));animation:athIn 1.2s .25s var(--ease) both}
@keyframes athIn{from{transform:translateY(12%);opacity:0}}
.fc{position:absolute;z-index:4;background:#fff;border-radius:22px;padding:14px;box-shadow:0 24px 50px -28px rgba(0,0,0,.45);animation:rise .9s var(--d,.8s) both}
.fc.nx{left:-4%;top:14%;width:250px}
.fc.nx small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fc.nx b{display:block;font-family:var(--f-d);font-size:19px;margin-top:6px}
.fc.nx .r{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13.5px;color:var(--fg-2)}
.fc.nx .r a{width:36px;height:36px;border-radius:50%;background:var(--lime);display:grid;place-items:center;transition:transform .3s}
.fc.nx .r a:hover{transform:rotate(-45deg)}
.fc.ci{right:5%;top:8%;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;--d:1s}
.fc.ci .dot{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--lime);display:grid;place-items:center}
.fc.ci b{font-family:var(--f-d);font-size:22px;line-height:1}
.fc.ci span{font-size:12.5px;color:var(--muted);display:block}
.fc.ci .live{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.fc.qr{right:-2%;bottom:12%;width:170px;padding:12px;--d:1.15s;text-align:center}
.fc.qr .code{border-radius:12px;overflow:hidden;background:#fff}
.fc.qr small{display:block;font-size:11.5px;font-weight:700;margin-top:8px}
.ring{--p:1;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*360deg),var(--line) 0);display:inline-block;vertical-align:middle;margin-right:6px;-webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
@media (max-width:980px){.hz{grid-template-columns:1fr;min-height:0}.hz-l{padding:40px 24px 10px}.hz-r{min-height:520px}.blob{right:auto;left:50%;translate:-50% 0;width:560px;bottom:-30%}.athlete{right:50%;translate:50% 0;height:100%}.fc.nx{left:12px;top:auto;bottom:24px;width:220px}.fc.ci{right:12px;top:14px}.fc.qr{display:none}}
@media (max-width:560px){.hz{border-radius:28px}.hz-r{min-height:440px}.fc.nx{width:200px;padding:12px}.fc.nx b{font-size:16px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:14px;border-radius:28px;border:1.5px solid var(--line);overflow:hidden}
.stats div{padding:22px 24px;border-right:1.5px solid var(--line)}
.stats div:last-child{border:0}
.stats b{font-family:var(--f-d);font-size:clamp(30px,3vw,44px);font-weight:900;letter-spacing:-.03em;display:block;line-height:1}
.stats span{font-size:14px;color:var(--muted)}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(2){border-right:0}.stats div:nth-child(-n+2){border-bottom:1.5px solid var(--line)}}

.mq{overflow:hidden;background:var(--lime);margin-top:70px;padding:18px 0;transform:rotate(-1.5deg) scale(1.03)}
.mq .tr{display:flex;gap:40px;width:max-content;animation:mq 30s linear infinite;font-family:var(--f-d);font-weight:900;font-stretch:120%;text-transform:uppercase;font-size:26px}
.mq span{display:flex;gap:40px;align-items:center;white-space:nowrap}
.mq span::after{content:"✳"}
@keyframes mq{to{transform:translateX(-50%)}}

section.s{padding-block:110px 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.sh h2{font-size:clamp(38px,5vw,72px);font-weight:900;letter-spacing:-.04em;max-width:15ch;margin-top:14px}
.sh h2 .t{color:var(--muted);font-weight:500;font-style:italic}
.sh p{max-width:42ch;color:var(--fg-2)}

/* programs */
.prg{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:220px;gap:14px}
.pg{position:relative;border-radius:28px;overflow:hidden;text-decoration:none;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;isolation:isolate}
.pg .ph{position:absolute;inset:0;z-index:-2}
.pg .ph img{transition:transform 1s var(--ease)}
.pg:hover .ph img{transform:scale(1.07)}
.pg::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.65))}
.pg h3{font-size:clamp(22px,2vw,30px);font-stretch:115%;text-transform:uppercase}
.pg p{font-size:14px;opacity:.9;margin-top:6px;max-width:34ch}
.pg .ar{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;transition:transform .35s var(--ease)}
.pg:hover .ar{transform:rotate(-45deg) scale(1.08)}
.pg .tg{position:absolute;top:16px;left:16px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--ink);font-size:12.5px;font-weight:700}
.pg.a{grid-column:span 3;grid-row:span 2}.pg.b{grid-column:span 3}.pg.c{grid-column:span 2}.pg.d{grid-column:span 1}
.pg.e{grid-column:span 3}.pg.f{grid-column:span 3}
@media (max-width:900px){.prg{grid-template-columns:1fr 1fr;grid-auto-rows:200px}.pg.a,.pg.b,.pg.c,.pg.d,.pg.e,.pg.f{grid-column:span 1;grid-row:span 1}.pg.a{grid-column:span 2;grid-row:span 2}}

/* coaches */
.coach-band{background:var(--ink);color:#fff;border-radius:40px;margin:110px 14px 0;padding:80px 0}
.coach-band .sh h2{color:#fff}
.coach-band .sh p{color:#BDBDBD}
.coach-band .eyebrow{color:#BDBDBD}
.cg{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:280px 280px;gap:14px}
.co{position:relative;border-radius:26px;overflow:hidden;border:0;padding:0;text-align:left;color:#fff;background:#333}
.co .ph{position:absolute;inset:0;background:#333}
.co .ph img{filter:grayscale(1);transition:filter .6s,transform 1s var(--ease)}
.co:hover .ph img,.co:focus-visible .ph img{filter:none;transform:scale(1.05)}
.co::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.72))}
.co .cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:1}
.co .cap b{font-family:var(--f-d);font-size:26px;font-weight:900;display:block;letter-spacing:-.02em}
.co .cap span{font-size:14px;opacity:.85}
.co .hrs{position:absolute;top:14px;left:14px;z-index:1;padding:6px 12px;border-radius:999px;background:var(--lime);color:var(--ink);font-weight:800;font-size:12.5px;transform:translateY(-140%);transition:transform .45s var(--ease)}
.co:hover .hrs,.co:focus-visible .hrs{transform:none}
.co.tall{grid-row:span 2}
.cstat{border-radius:26px;background:var(--lime);color:var(--ink);padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.cstat b{font-family:var(--f-d);font-size:clamp(46px,5vw,76px);font-weight:900;letter-spacing:-.04em;line-height:1}
.cstat p{font-weight:600;font-size:17px;max-width:18ch}
@media (max-width:900px){.cg{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:240px}.co.tall{grid-row:span 1}.coach-band{border-radius:28px;padding:60px 0}}

/* schedule */
.sch{border-radius:32px;border:1.5px solid var(--line);padding:26px;background:#fff}
.sch-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.sch-f{display:flex;gap:6px;flex-wrap:wrap}
.sch-club{display:flex;gap:10px;align-items:center}
.wk{display:grid;grid-template-columns:44px repeat(7,1fr) 44px;align-items:center;gap:6px;margin-top:24px}
.wk .rb{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;display:grid;place-items:center}
.wk .rb:disabled{opacity:.3;cursor:default}
.wk .d{text-align:center;padding:10px 0;border-bottom:2px solid var(--line);font-weight:600;color:var(--muted);font-size:15px;border-radius:12px 12px 0 0}
.wk .d.today{color:var(--ink);border-color:var(--ink);background:var(--mist)}
.grid{display:grid;grid-template-columns:64px repeat(7,1fr);gap:8px;margin-top:14px}
.grid .tm{font-family:var(--f-d);font-weight:700;font-size:17px;display:flex;align-items:center}
.cl{min-height:96px;border-radius:16px;border:1.5px solid transparent;background:var(--mist);padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;position:relative;transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .45s var(--d,0s) both}
.cl.emp{background:#FAFAFA;cursor:default;animation:none}
.cl:not(.emp):not(.past):hover{transform:translateY(-3px);box-shadow:0 14px 26px -18px rgba(0,0,0,.5);border-color:var(--ink)}
.cl .ic{position:absolute;top:10px;left:12px;opacity:.7}
.cl b{font-size:14.5px;font-weight:700;line-height:1.2}
.cl span{font-size:12.5px;color:var(--fg-2);display:flex;align-items:center;gap:5px}
.cl.full,.cl.past{opacity:.5}
.cl.full b{text-decoration:line-through}
.cl.mine{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.cl.mine::after{content:"Booked";position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--ink);color:var(--lime)}
.cl.yoga{background:var(--t-yoga)}.cl.pil{background:var(--t-pil)}.cl.hiit{background:var(--t-hiit)}.cl.str{background:var(--t-str)}.cl.mob{background:var(--t-mob)}.cl.rec{background:var(--t-rec)}
.sch-note{text-align:center;margin-top:22px;color:var(--fg-2)}
@media (max-width:980px){.sch{padding:14px}.wk{display:none}.grid{display:none}}
.day-list{display:none}
@media (max-width:980px){.day-list{display:grid;gap:8px;margin-top:16px}.dtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-top:16px;scrollbar-width:none}.dtabs button{flex:none;height:62px;width:58px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;line-height:1.2}.dtabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}.day-list .cl{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding:14px}.day-list .cl .ic{position:static}.day-list .cl .tt{font-family:var(--f-d);font-weight:800;width:52px}.day-list .cl div{display:grid;flex:1}}
.dtabs{display:none}
@media (max-width:980px){.dtabs{display:flex}}

/* check-in band */
.ck{background:var(--ink);color:#fff;border-radius:40px;margin:110px 14px 0;padding:90px 0 0;overflow:hidden;position:relative}
.ck h2{font-size:clamp(40px,5.8vw,86px);font-weight:900;letter-spacing:-.045em;text-align:center;color:var(--lime);max-width:14ch;margin:0 auto}
.ck .sub{text-align:center;color:#C9C9C9;max-width:54ch;margin:18px auto 0}
.ck-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:40px;align-items:center;margin-top:60px;position:relative;z-index:2}
.ck-list{display:grid;gap:14px}
.ck-it{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:22px;background:#262626;border:1px solid #333}
.ck-it .n{width:38px;height:38px;border-radius:12px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-family:var(--f-d);font-weight:900;flex:none}
.ck-it b{display:block;font-size:16px}
.ck-it span{font-size:14px;color:#BDBDBD}
.phone{width:290px;height:590px;border-radius:46px;background:#0E0E0E;padding:12px;box-shadow:0 0 0 2px #3A3A3A,0 60px 80px -30px rgba(0,0,0,.8);position:relative}
.phone .scr{height:100%;border-radius:36px;background:var(--mist);color:var(--ink);overflow:hidden;display:flex;flex-direction:column}
.phone .notch{position:absolute;left:50%;top:22px;translate:-50% 0;width:90px;height:26px;border-radius:999px;background:#0E0E0E;z-index:2}
.mcard{margin:48px 14px 0;border-radius:24px;background:var(--ink);color:#fff;padding:16px;position:relative;overflow:hidden}
.mcard::after{content:"";position:absolute;right:-62px;top:-78px;width:120px;height:120px;border-radius:50%;background:var(--lime);opacity:.9}
.mcard>*{position:relative;z-index:1}
.mcard .who{display:flex;align-items:center;gap:10px}
.mcard .who .av{width:40px;height:40px;background:var(--lime);font-size:14px}
.mcard .who b{display:block;font-size:15px}
.mcard .who span{font-size:12px;color:#BDBDBD}
.qrbox{margin:14px 14px 0;border-radius:24px;background:#fff;padding:16px;text-align:center}
.qrbox .code{width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden}
.qrbox .code svg{width:100%;height:100%}
.qrbox .t{display:flex;justify-content:center;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-top:10px}
.qrbox .pin{font-family:var(--f-d);font-size:22px;font-weight:900;letter-spacing:.18em;margin-top:4px}
.scan-line{position:absolute;left:10%;right:10%;height:3px;border-radius:9px;background:var(--lime);box-shadow:0 0 18px 4px rgba(161,234,147,.7);animation:scan 2.4s ease-in-out infinite;z-index:3}
@keyframes scan{0%,100%{top:22%}50%{top:62%}}
.bigtxt{font-family:var(--f-d);font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:clamp(80px,15vw,230px);line-height:.85;white-space:nowrap;color:var(--lime);margin-top:-40px;position:relative;z-index:1;will-change:transform}
.bigtxt.o{color:transparent;-webkit-text-stroke:2px #3A3A3A}
@media (max-width:980px){.ck-grid{grid-template-columns:1fr;justify-items:center}.ck{border-radius:28px;padding-top:60px}.bigtxt{margin-top:0}}

/* plans */
.pl-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:999px;background:var(--mist)}
.seg button{height:40px;padding:0 18px;border:0;border-radius:999px;background:transparent;font-weight:700;font-size:14px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button small{color:var(--ok);font-weight:800;margin-left:4px}
.seg button[aria-pressed="true"] small{color:var(--lime)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:28px;border-top:1.5px solid var(--ink)}
.plan{padding:30px 28px;border-right:1.5px solid var(--line);display:flex;flex-direction:column;gap:14px;transition:background .3s}
.plan:last-child{border-right:0}
.plan:hover{background:var(--mist)}
.plan.feat{background:var(--lime)}
.plan .nm{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.plan .pr{font-family:var(--f-d);font-size:clamp(44px,4.4vw,64px);font-weight:900;letter-spacing:-.04em;line-height:1}
.plan .pr small{font-family:var(--f-ui);font-size:15px;font-weight:500;letter-spacing:0;color:var(--fg-2)}
.plan ul{list-style:none;padding:0;margin:4px 0 10px;display:grid;gap:10px;flex:1}
.plan li{display:flex;gap:10px;font-size:15px}
.plan li svg{margin-top:2px}
.plan li.x{color:var(--muted)}
@media (max-width:900px){.plans{grid-template-columns:1fr}.plan{border-right:0;border-bottom:1.5px solid var(--line)}}
.cur{height:40px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;padding:0 34px 0 14px;font-weight:700;font-size:13.5px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px;background-repeat:no-repeat}

/* recovery */
.recv{display:grid;grid-template-columns:1fr 1.1fr;gap:18px}
.recv .img{border-radius:32px;min-height:520px}
.rl{display:grid;gap:10px;align-content:start}
.ri{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:22px 24px;border-radius:24px;background:var(--mist);transition:background .25s,transform .3s var(--ease)}
.ri:hover{background:var(--t-rec);transform:translateX(6px)}
.ri b{font-family:var(--f-d);font-size:22px;font-weight:800}
.ri span{font-size:14px;color:var(--fg-2)}
.ri .p{font-family:var(--f-d);font-size:20px;font-weight:800;text-align:right}
.ri .btn{grid-column:2}
.trust{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
@media (max-width:900px){.recv{grid-template-columns:1fr}.recv .img{min-height:280px}}

/* journal bento */
.jb{display:grid;grid-template-columns:1.35fr 1.2fr .8fr;grid-template-rows:auto auto;gap:12px}
.jc{border-radius:30px;overflow:hidden;position:relative;text-decoration:none;display:flex;flex-direction:column;transition:transform .4s var(--ease)}
.jc:hover{transform:translateY(-4px)}
.jc .ph img{transition:transform 1s var(--ease)}
.jc:hover .ph img{transform:scale(1.05)}
.jc.big{grid-row:span 2;min-height:640px;background:var(--mist)}
.jc.big .ph{position:absolute;inset:0}
.jc.big .cap{position:absolute;left:0;bottom:0;background:#fff;border-radius:0 30px 0 0;padding:22px 26px 20px;max-width:88%}
.jc .meta{font-size:13px;color:var(--fg-2);display:flex;gap:8px}
.jc .meta b{color:var(--ink)}
.jc h3{font-family:var(--f-d);font-weight:900;font-stretch:112%;text-transform:uppercase;font-size:clamp(22px,2.2vw,34px);letter-spacing:-.01em;margin-top:8px;line-height:1.02}
.jc.lime{background:var(--lime);padding:26px}
.jc.lime p{font-size:14px;margin-top:14px;color:var(--fg-2)}
.jc.lime .lst{margin:18px -26px -26px;border-top:1.5px solid rgba(28,28,28,.25)}
.jc.lime .lst a{display:flex;justify-content:space-between;align-items:center;padding:16px 26px;border-bottom:1.5px solid rgba(28,28,28,.25);font-weight:800;font-size:14px;text-transform:uppercase;text-decoration:none}
.jc.lime .lst a:last-child{border:0}
.jc.lime .lst a:hover{background:rgba(255,255,255,.35)}
.jc.tall{background:var(--t-yoga);padding:22px 22px 0;min-height:300px}
.jc.tall h3{font-size:24px}
.jc.tall .ph{flex:1;margin:14px -22px 0;min-height:180px;background:transparent}
.jc.vid{background:var(--t-pil);min-height:280px}
.jc.vid .ph{position:absolute;inset:0}
.jc.vid .cap{position:absolute;left:22px;right:22px;bottom:18px;color:#fff;z-index:1}
.jc.vid::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.6))}
.jc.vid .play{position:absolute;left:50%;top:45%;translate:-50% -50%;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.35);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:1;color:#fff}
.jc.cats{background:var(--t-rec);padding:22px;justify-content:space-between;min-height:280px}
.jc.cats .cw{display:flex;flex-wrap:wrap;gap:8px}
.jc.cats .cw button{height:40px;padding:0 16px;border-radius:999px;border:0;background:#FFF6CC;font-weight:600;font-size:14px}
.jc.cats .cw button[aria-pressed="true"]{background:var(--ink);color:#fff}
.jc.cats .ft{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-d);font-weight:800;font-size:20px;margin-top:20px}
.jc.cats .ft span{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center}
@media (max-width:980px){.jb{grid-template-columns:1fr 1fr}.jc.big{grid-column:span 2;grid-row:auto;min-height:460px}}
@media (max-width:600px){.jb{grid-template-columns:1fr}.jc.big{grid-column:auto}}

/* faq */
.faq{display:grid;grid-template-columns:1fr 1.5fr;gap:50px}
.qa{border-bottom:1.5px solid var(--line)}
.qa button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;border:0;background:none;text-align:left;font-weight:700;font-size:18px}
.qa button i{width:36px;height:36px;border-radius:50%;background:var(--mist);display:grid;place-items:center;flex:none;transition:transform .35s var(--ease),background .2s}
.qa button[aria-expanded="true"] i{transform:rotate(45deg);background:var(--lime)}
.qa .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.qa .a>div{overflow:hidden}
.qa .a p{padding:0 0 22px;color:var(--fg-2);max-width:62ch}
.qa button[aria-expanded="true"]+.a{grid-template-rows:1fr}
@media (max-width:900px){.faq{grid-template-columns:1fr;gap:20px}}

/* join band + footer */
.jn-band{margin:110px 14px 0;border-radius:40px;background:var(--lime);position:relative;overflow:hidden;min-height:520px;display:flex;align-items:flex-end}
.jn-band .ph{position:absolute;right:0;top:0;bottom:0;width:48%;background:transparent}
.jn-band .ph img{object-position:50% 20%}
.jn-band .in{position:relative;z-index:1;padding:50px}
.jn-band h2{font-size:clamp(60px,10vw,160px);font-weight:900;font-stretch:120%;text-transform:uppercase;letter-spacing:-.04em;line-height:.85}
.jn-band p{max-width:40ch;margin:20px 0 26px;font-size:17px}
@media (max-width:900px){.jn-band{flex-direction:column;align-items:stretch}.jn-band .ph{position:relative;width:100%;height:320px}.jn-band .in{padding:30px 24px}}
footer.f{padding:80px 0 30px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px}
.fg h4{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:700}
.fg a{display:block;padding:5px 0;text-decoration:none;font-size:15px}
.fg a:hover{text-decoration:underline}
.fg .staff a{display:flex;align-items:center;gap:8px}
.fbot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1.5px solid var(--line);padding-top:20px;margin-top:50px;font-size:13px;color:var(--muted)}
@media (max-width:900px){.fg{grid-template-columns:1fr 1fr}}

/* ===== inner pages ===== */
.ph-h{padding:50px 0 24px}
.crumbs{display:flex;gap:8px;font-size:13.5px;color:var(--muted);font-weight:600}
.crumbs a{text-decoration:none}
.ph-h h1{font-size:clamp(46px,7vw,100px);font-weight:900;letter-spacing:-.045em;margin-top:16px}
.ph-h p{max-width:56ch;color:var(--fg-2);margin-top:16px;font-size:17px}
.panel{border-radius:28px;background:#fff;border:1.5px solid var(--line);padding:28px}
.steps-bar{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.op{border-radius:22px;border:1.5px solid var(--line);background:#fff;padding:22px;text-align:left;display:grid;gap:8px;transition:all .2s}
.op:hover{border-color:var(--ink)}
.op[aria-pressed="true"]{border-color:var(--ink);background:var(--lime-soft);box-shadow:inset 0 0 0 1.5px var(--ink)}
.op b{font-family:var(--f-d);font-size:22px;font-weight:800}
.op .pr{font-family:var(--f-d);font-size:34px;font-weight:900}
.op span{font-size:14px;color:var(--fg-2)}
@media (max-width:800px){.opts{grid-template-columns:1fr}}
.upl{display:flex;gap:16px;align-items:center}
.upl .av{width:84px;height:84px;background:var(--mist);font-size:26px;border:2px dashed var(--line-2)}
.welcome{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center}
@media (max-width:800px){.welcome{grid-template-columns:1fr;justify-items:center;text-align:center}}

/* member portal */
.mp{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
.mp-card{position:sticky;top:100px;border-radius:32px;background:var(--ink);color:#fff;padding:22px;display:grid;gap:14px}
.mp-card .top{display:flex;align-items:center;gap:12px}
.mp-card .top .av{width:54px;height:54px;background:var(--lime);font-size:18px}
.mp-card .top b{display:block;font-size:18px}
.mp-card .top span{font-size:13px;color:#BDBDBD}
.mp-card .qrbox{margin:0}
.mp-card .qrbox .code{max-width:260px;margin:0 auto}
.vbar{height:8px;border-radius:9px;background:#3A3A3A;overflow:hidden}
.vbar i{display:block;height:100%;background:var(--lime);border-radius:9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv span{color:#BDBDBD}
.kv b{text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.hist{display:grid;gap:8px}
.hr{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--mist);font-size:14.5px}
.hr .d{width:52px;text-align:center;font-family:var(--f-d);font-weight:800;line-height:1}
.hr .d small{display:block;font-family:var(--f-ui);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.hr .g{flex:1}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:420px}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--mist);position:relative}
.heat i.on{background:var(--lime)}
.heat i.two{background:var(--lime-d)}
.heat i.td{box-shadow:inset 0 0 0 2px var(--ink)}
.heat .dw{font-size:11px;font-weight:700;color:var(--muted);text-align:center;aspect-ratio:auto;background:none}
.demo-users{display:flex;gap:8px;flex-wrap:wrap}
.du{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.du:hover{border-color:var(--ink)}
.du .av{width:34px;height:34px;background:var(--lime);font-size:12px}
@media (max-width:900px){.mp{grid-template-columns:1fr}.mp-card{position:static}}

/* scanner kiosk */
.kiosk{background:var(--ink);color:#fff;min-height:100vh}
.kiosk .wrap{padding-top:26px;padding-bottom:60px}
.k-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.k-top .logo b{color:#fff}
.k-clock{font-family:var(--f-d);font-size:30px;font-weight:800}
.k-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-top:22px}
.k-box{border-radius:28px;background:#262626;border:1px solid #333;padding:22px}
.k-box h3{font-size:22px;font-weight:800}
.vf{position:relative;aspect-ratio:4/3;border-radius:22px;background:#111;overflow:hidden;margin-top:14px;display:grid;place-items:center;text-align:center;color:#9A9A9A}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf .fr{position:absolute;inset:18%;border:3px solid var(--lime);border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.35);z-index:2}
.k-man{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:14px}
.k-man .input{background:#1B1B1B;border-color:#3A3A3A;color:#fff}
.k-man .input::placeholder{color:#777}
.res{border-radius:28px;padding:26px;min-height:360px;display:grid;align-content:start;gap:14px;background:#262626;border:1px solid #333;transition:background .3s}
.res.ok{background:#1F3A22;border-color:#3FAE4F}
.res.warn{background:#3A2F18;border-color:var(--warn)}
.res.bad{background:#3F1F1D;border-color:var(--bad)}
.res .hd{display:flex;align-items:center;gap:14px}
.res .big{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;flex:none}
.res.ok .big{background:var(--lime);color:var(--ink)}.res.warn .big{background:var(--warn);color:var(--ink)}.res.bad .big{background:var(--bad);color:#fff}
.res .big svg{width:34px;height:34px;stroke-width:2.6}
.res h3{font-size:clamp(26px,2.6vw,36px);font-weight:900}
.res .why{font-size:16px;color:#E8E8E8}
.res .pp{display:flex;gap:18px;align-items:center;background:rgba(0,0,0,.25);border-radius:20px;padding:14px}
.res .pp .av{width:110px;height:110px;border-radius:22px;background:var(--lime);font-size:34px}
.res .pp .kv span{color:#AFAFAF}
.res .pp .kv{flex:1}
.res .pp .kv b{text-align:left}
.k-log{display:grid;gap:6px;margin-top:12px;max-height:340px;overflow:auto}
.k-log div{display:flex;gap:10px;align-items:center;font-size:14px;padding:9px 12px;border-radius:12px;background:#1E1E1E}
.k-log .st{width:9px;height:9px;border-radius:50%;flex:none}
.k-log time{color:#9A9A9A;font-variant-numeric:tabular-nums;width:48px}
.sim{margin-top:18px;border-radius:28px;border:1.5px dashed #444;padding:20px}
.sim-g{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start;margin-top:12px}
.sim .phone{width:230px;height:430px;border-radius:36px;padding:9px}
.sim .phone .scr{border-radius:28px}
.sim .mcard{margin:34px 10px 0;padding:12px;border-radius:18px}
.sim .qrbox{margin:10px 10px 0;padding:10px;border-radius:18px}
.sim-btns{display:grid;gap:8px}
.sim-btns .btn{justify-content:flex-start;border-color:#4A4A4A;color:#fff;height:auto;min-height:48px;padding:10px 16px;white-space:normal;text-align:left}
.sim-btns .btn:hover{background:#333}
.sim-btns .btn small{display:block;font-weight:500;color:#AFAFAF;font-size:12.5px}
.sim .sel{background-color:#1B1B1B;border-color:#3A3A3A;color:#fff;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%)}
@media (max-width:980px){.k-grid,.sim-g{grid-template-columns:1fr}.sim .phone{margin:0 auto}.k-man{grid-template-columns:1fr 1fr}.k-man .btn{grid-column:1/-1}}

/* admin */
.adm{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start;padding-top:24px}
.side{position:sticky;top:100px;display:grid;gap:4px;padding:10px;border-radius:24px;background:var(--mist)}
.side button{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;border:0;background:none;font-weight:700;font-size:14.5px;color:var(--fg-2);text-align:left}
.side button:hover{background:#fff}
.side button[aria-pressed="true"]{background:var(--ink);color:#fff}
.side button .c{margin-left:auto;min-width:22px;height:22px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;display:grid;place-items:center;padding:0 6px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{border-radius:22px;border:1.5px solid var(--line);padding:18px;display:grid;gap:4px;text-align:left;background:#fff;transition:border-color .2s,transform .2s}
button.kpi:hover{border-color:var(--ink);transform:translateY(-2px)}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-d);font-size:36px;font-weight:900;letter-spacing:-.03em;line-height:1.05}
.kpi small{font-size:12.5px;color:var(--fg-2)}
.kpi.lime{background:var(--lime);border-color:var(--lime)}
.kpi.warn b{color:#B27511}.kpi.bad b{color:var(--bad)}
.a-row{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}
.card{border-radius:24px;border:1.5px solid var(--line);padding:20px;background:#fff;min-width:0}
.card h3{font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.bars{width:100%;height:220px;overflow:visible}
.bars text{font-size:11px;fill:var(--muted);font-family:var(--f-ui)}
.bars rect.b{fill:var(--line-2);transition:fill .2s}
.bars rect.b.t{fill:var(--lime-d)}
.bars rect.b:hover{fill:var(--ink)}
.feed{display:grid;gap:6px;max-height:300px;overflow:auto}
.feed div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--mist);font-size:14px;animation:rise .4s both}
.feed .av{width:30px;height:30px;background:var(--lime);font-size:11px}
.feed time{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tbar .input{height:44px;max-width:280px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.cl2{cursor:pointer}
.tbl tr.cl2:hover td{background:var(--mist)}
.tbl .who{display:flex;align-items:center;gap:10px}
.tbl .who .av{width:34px;height:34px;background:var(--lime);font-size:12px}
.tbl .who b{display:block}
.tbl .who span{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:#fff;z-index:85;box-shadow:-30px 0 60px -30px rgba(0,0,0,.4);overflow:auto;animation:slin .35s var(--ease);padding:24px;display:grid;gap:16px;align-content:start}
@keyframes slin{from{transform:translateX(100%)}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:84;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.dr-h{display:flex;gap:14px;align-items:center}
.dr-h .av{width:72px;height:72px;background:var(--lime);font-size:24px;border-radius:22px}
.dr-h b{font-family:var(--f-d);font-size:24px;display:block}
.acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.a-row{grid-template-columns:1fr}}
@media (max-width:900px){.adm{grid-template-columns:1fr}.side{position:static;grid-auto-flow:column;overflow-x:auto}.side button{white-space:nowrap}.kpis{grid-template-columns:1fr 1fr}}
.gate{max-width:420px;margin:60px auto;text-align:center;display:grid;gap:16px}
.pinrow{display:flex;gap:10px;justify-content:center}
.pinrow input{width:58px;height:66px;text-align:center;font-family:var(--f-d);font-size:28px;font-weight:800;border-radius:16px;border:1.5px solid var(--line-2)}
.pinrow input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px var(--lime-soft)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* article */
.art{max-width:760px;margin:0 auto}
.art .cover{border-radius:30px;height:440px;margin:28px 0}
.art .body p{font-size:18.5px;line-height:1.72;color:var(--fg-2);margin-bottom:20px}
.art .body h3{font-size:26px;margin:32px 0 12px}

/* modal & toast */
.mdl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);animation:fade .25s}
.mdl .bx{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:30px;background:#fff;padding:28px;display:grid;gap:14px;position:relative;animation:pop .35s var(--ease)}
.mdl .bx.wide{width:min(820px,100%);grid-template-columns:.9fr 1.1fr;padding:0;gap:0}
.mdl .bx.wide .ph{min-height:420px}
.mdl .bx.wide .in{padding:28px;display:grid;gap:12px;align-content:start}
.mdl .x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--mist);display:grid;place-items:center;z-index:2}
.mdl h3{font-size:30px;font-weight:900;padding-right:40px}
@media (max-width:700px){.mdl .bx.wide{grid-template-columns:1fr}.mdl .bx.wide .ph{min-height:260px}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:95;display:grid;gap:8px}
.toast{background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);animation:pop .3s var(--ease)}
.toast svg{color:var(--lime)}
.demo{position:fixed;left:14px;bottom:14px;z-index:40;display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 14px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;font-weight:700}
.demo button{width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center}
@media (max-width:640px){.demo .x3{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}

/* Minimal QR Code encoder (byte mode, ECC level M, versions 1–6). Written for FORMA; no dependencies. */
const QR=(()=>{

 const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55}return r};

 const rem=(data,div)=>{const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r};
 const MASK=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
 function encode(text){
  const bytes=[...new TextEncoder().encode(text)];let v=1;
  for(;v<=6;v++){if(Math.floor(raw(v)/8)-ECC[v]*NB[v]>=bytes.length+2)break}if(v>6)throw new Error('QR payload too long');
  const cap=Math.floor(raw(v)/8)-ECC[v]*NB[v];const bits=[];const push=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
  push(4,4);push(bytes.length,8);bytes.forEach(b=>push(b,8));push(0,Math.min(4,cap*8-bits.length));while(bits.length%8)bits.push(0);
  const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));for(let p=0xEC;data.length<cap;p^=0xEC^0x11)data.push(p);

  const n=v*4+17,M=[...Array(n)].map(()=>Array(n).fill(false)),F=[...Array(n)].map(()=>Array(n).fill(false));

  for(let i=0;i<n;i++){set(6,i,i%2===0);set(i,6,i%2===0)}

   for(let i=0;i<=5;i++)set(8,i,bit(i));set(8,7,bit(6));set(8,8,bit(7));set(7,8,bit(8));for(let i=9;i<15;i++)set(14-i,8,bit(i));

  let best=0,bp=1e9;for(let m=0;m<8;m++){apply(m);fmt(m);const p=pen();if(p<bp){bp=p;best=m}apply(m)}
  apply(best);fmt(best);return M}

/* ---------- validation at the gate ---------- */
function validate(input,opt={}){const now=Date.now();let id,ok=false,stale=false;
 if(typeof input==='string'){const p=input.trim().split('|');if(p[0]!=='FORMA'||p.length!==4)return res('bad','Not a FORMA code','This QR code does not belong to FORMA.',null,'Unknown code');id=p[1];const w=+p[2];if(code6(id,w)!==p[3])return res('bad','Invalid code','The code signature does not match. It may have been edited.',mem(id),'Tampered QR code');
  const cw=win(now);if(w>cw+1||w<cw-1)stale=true;ok=true}
 else{id=(input.id||'').trim().toUpperCase();if(!/^FM-\d{4}$/.test(id))return res('bad','Unknown member ID','Check the ID on the member’s card, e.g. FM-1001.',null,'Unknown member ID');const cw=win(now);ok=[cw,cw-1].some(w=>code6(id,w)===String(input.code).trim());if(!ok)return res('bad','Wrong or expired code','The 6-digit code changes every 30 seconds. Ask the member to read the current one.',mem(id),'Wrong or expired 6-digit code')}
 const m=mem(id);if(!m)return res('bad','Member not found',`No member with ID ${esc(id)}.`,null,'Unknown member ID');
 if(stale)return res('bad','QR code expired','This code is more than 60 seconds old. It is probably a screenshot or photo of someone else’s phone. Ask the member to open the live card.',m,'QR code expired (possible screenshot)');
 const st=status(m);
 if(st==='frozen')return res('bad','Membership frozen','This membership is on hold. The member can unfreeze it in the app or at the desk.',m,'Frozen membership');
 if(st==='expired')return res('bad','Membership expired',`Expired on ${fmtD(m.exp,{month:'long',day:'numeric'})}. Renew at the desk before entry.`,m,'Membership expired');
 const d=new Date(now),h=d.getHours()+d.getMinutes()/60,dow=d.getDay();
 if(m.plan==='offpeak'&&(dow===0||dow===6||h<10||h>=16))return res('bad','Outside Off-Peak hours','Off-Peak members can enter on weekdays 10:00–16:00. Offer a day pass or an Unlimited upgrade.',m,'Off-peak plan used outside 10:00–16:00');
 const last=visits().filter(v=>v.id===id).pop();
 if(!opt.override&&last&&now-last.t<3*36e5){const mins=Math.round((now-last.t)/6e4);return res('bad','Already checked in',`This card was used ${mins<1?'moments':mins+' min'} ago at ${fmtT(last.t)}. One entry per 3 hours: the card may be shared. Compare the photo before overriding.`,m,`Already checked in ${mins} min ago (possible card sharing)`,true)}
 const dl=diffDays(m.exp,today());
 if(st==='expiring')return res('warn',`Welcome, ${esc(m.n.split(' ')[0])}`,`Entry allowed. Membership expires in ${dl} day${dl===1?'':'s'}: remind them to renew.`,m);
 return res('ok',`Welcome, ${esc(m.n.split(' ')[0])}`,'Entry allowed. Check the photo matches.',m);
 function res(lvl,title,why,m,flag,canOverride){return {lvl,title,why,m,flag,canOverride}}}

async function startCam(){const msg=$('#camMsg');if(!navigator.mediaDevices?.getUserMedia){msg.textContent='Camera access is not available in this browser. Use the 6-digit code instead.';return}
 if(!('BarcodeDetector' in window)){msg.innerHTML='This browser can’t read QR codes from the camera (try Chrome on Android or macOS). Use the 6-digit code below.';return}
 try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});S.stream=st;const vf=$('#vf');vf.innerHTML='<video playsinline muted></video><div class="fr"></div><span class="scan-line" style="left:22%;right:22%"></span>';const v=$('video',vf);v.srcObject=st;await v.play();
  const det=new BarcodeDetector({formats:['qr_code']});let busy=false,pause=0;const loop=async()=>{if(!S.stream||!document.body.contains(v))return;if(!busy&&Date.now()>pause){busy=true;try{const r=await det.detect(v);if(r[0]){doScan(r[0].rawValue,'cam');pause=Date.now()+2500}}catch(e){}busy=false}requestAnimationFrame(loop)};loop()}
 catch(e){msg.textContent=e&&e.name==='NotAllowedError'?'Camera permission was blocked. Allow the camera, or use the 6-digit code below.':'The camera could not start here (it may be blocked in this preview). Use the 6-digit code below.'}}
function stopCam(){S.stream?.getTracks().forEach(t=>t.stop());S.stream=null}

 if(tab==='alerts'){const rev=ls('rev')||[];const l=A.filter(s=>!s.ok).reverse();el.innerHTML=`<h1 style="font-size:40px;font-weight:900;margin-bottom:6px">Alerts</h1><p class="muted" style="margin-bottom:16px">Every denied entry is logged here so you can follow up on screenshots, shared cards and expired memberships.</p><div class="card"><div class="hist">${l.map(s=>{const m=mem(s.id);const r=rev.includes(s.sid);return `<div class="hr" style="${r?'opacity:.55':''}"><span class="d" style="width:auto;min-width:70px;text-align:left"><b class="num">${fmtT(s.t)}</b><small>${fmtD(dsOf(new Date(s.t)))}</small></span><span class="g"><b>${m?esc(m.n):esc(s.id)}</b> <span class="muted">${esc(s.id)}</span><br><span class="pill bad" style="margin-top:4px">${ic('alert','width:13px;height:13px')}${esc(s.why)}</span></span>${m?`<button class="btn ghost sm" data-mem="${m.id}">Member</button>`:''}${r?'<span class="pill">Reviewed</span>':`<button class="btn ink sm" data-rev="${s.sid}">Mark reviewed</button>`}</div>`}).join('')||'<p class="muted">No alerts.</p>'}</div></div>`;
  $$('[data-rev]',el).forEach(b=>b.onclick=()=>{const r=ls('rev')||[];r.push(b.dataset.rev);ls('rev',r);render('admin')});bindMemRows(el)}
 $$('[data-go]',el).forEach(b=>b.onclick=()=>{const [t,f]=b.dataset.go.split(':');S.admTab=t;if(f)S.memF=f;$$('[data-at]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.at===t));drawAdmin()});bindMemRows(el)}
function drawFeed(){const el=$('#feed');if(!el)return;el.innerHTML=allScans().slice(-12).reverse().map(s=>{const m=mem(s.id);return `<div data-mem="${s.id}" style="cursor:pointer">${m?avatar(m):''}<span><b>${m?esc(m.n.split(' ')[0]+(m.n.split(' ')[1]?' '+m.n.split(' ')[1][0]+'.':'')):esc(s.id)}</b> ${s.ok?`<span class="muted">checked in · ${CLUBS[s.club]?.n}</span>`:`<span style="color:var(--bad);font-weight:600">denied · ${esc(s.why.split('(')[0])}</span>`}</span><time>${dsOf(new Date(s.t))===today()?fmtT(s.t):fmtD(dsOf(new Date(s.t)))}</time></div>`}).join('');bindMemRows(el)}
function bindMemRows(root){$$('[data-mem]',root).forEach(r=>r.onclick=()=>openMember(r.dataset.mem))}
function openMember(id){const m=mem(id);if(!m)return;closeModal();const V=visits().filter(v=>v.id===id),F=allScans().filter(s=>s.id===id&&!s.ok);const T=today();
 let heat=['M','T','W','T','F','S','S'].map(d=>`<i class="dw">${d}</i>`).join('');const start=addDs(monday(),-28);const by={};V.forEach(v=>{const d=dsOf(new Date(v.t));by[d]=(by[d]||0)+1});for(let i=0;i<35;i++){const ds=addDs(start,i);const n=by[ds]||0;heat+=`<i class="${n>1?'two':n?'on':''} ${ds===T?'td':''}" title="${fmtD(ds)}: ${n}" style="${ds>T?'opacity:.3':''}"></i>`}
 const sc=document.createElement('div');sc.className='scrim';sc.onclick=closeModal;document.body.appendChild(sc);const d=document.createElement('aside');d.className='drawer';d.setAttribute('role','dialog');d.setAttribute('aria-label',m.n);
 d.innerHTML=`<button class="x" style="position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:50%;border:0;background:var(--mist);display:grid;place-items:center" aria-label="Close">${ic('x')}</button><div class="dr-h">${avatar(m)}<div><b>${esc(m.n)}</b><span class="muted">${m.id} · ${CLUBS[m.club].n}</span><div style="margin-top:6px">${sPill(m)}</div></div></div>
 <div class="kv" style="font-size:14.5px"><span class="muted">Plan</span><b>${PLANS[m.plan].n}</b><span class="muted">Expires</span><b>${fmtD(m.exp,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</b><span class="muted">Email</span><b style="word-break:break-all">${esc(m.e)}</b><span class="muted">Mobile</span><b>${esc(m.tel)}</b><span class="muted">Member since</span><b>${fmtD(m.joined,{month:'short',year:'numeric'})}</b></div>
 <div><b style="display:block;margin-bottom:8px">Extend membership</b><div class="acts">${[[1,'+1 month'],[3,'+3 months'],[12,'+12 months']].map(x=>`<button class="btn sm ghost" data-ex="${x[0]}">${x[1]}</button>`).join('')}</div></div>
 <div class="acts"><button class="btn sm ${m.frozen?'ink':'ghost'}" id="frz">${ic('snow','width:15px;height:15px')}${m.frozen?'Unfreeze':'Freeze 14 days'}</button><a class="btn sm ghost" href="mailto:${esc(m.e)}?subject=${encodeURIComponent('Your FORMA membership')}&body=${encodeURIComponent(`Hi ${m.n.split(' ')[0]},\n\nYour FORMA ${PLANS[m.plan].n} membership ${status(m)==='expired'?'expired':'expires'} on ${fmtD(m.exp,{month:'long',day:'numeric'})}. Renew in the member area or at the front desk.\n\nSee you soon,\nFORMA ${CLUBS[m.club].n}`)}">${ic('mail','width:15px;height:15px')}Email reminder</a><a class="btn sm ghost" href="https://wa.me/${m.tel.replace(/\D/g,'')}?text=${encodeURIComponent(`Hi ${m.n.split(' ')[0]}, your FORMA membership ${status(m)==='expired'?'expired':'expires'} on ${fmtD(m.exp,{month:'long',day:'numeric'})}. Renew in the app or at the desk.`)}" target="_blank" rel="noopener">WhatsApp</a></div>
 <div><b style="display:block;margin-bottom:8px">Last 5 weeks · ${V.filter(v=>Date.now()-v.t<35*DAY).length} visits</b><div class="heat" style="max-width:none">${heat}</div></div>
 <div><b style="display:block;margin-bottom:8px">Recent activity</b><div class="hist">${allScans().filter(s=>s.id===id).slice(-8).reverse().map(s=>`<div class="hr" style="padding:9px 12px"><span class="g">${fmtDT(s.t)}</span>${s.ok?`<span class="pill ok">Allowed</span>`:`<span class="pill bad" title="${esc(s.why)}">Denied</span>`}</div>`).join('')||'<p class="muted">No visits yet.</p>'}</div>${F.length?`<p class="err-t" style="margin-top:8px">${F.length} denied attempt${F.length>1?'s':''} on record.</p>`:''}</div>`;
 document.body.appendChild(d);d.querySelector('.x').focus();d.querySelector('.x').onclick=closeModal;
 $$('[data-ex]',d).forEach(b=>b.onclick=()=>{const base=status(m)==='expired'?today():m.exp;const x=parseDs(base);x.setMonth(x.getMonth()+ +b.dataset.ex);patchMember(id,{exp:dsOf(x)});toast(`${m.n.split(' ')[0]} extended to ${fmtD(dsOf(x),{month:'short',day:'numeric',year:'numeric'})}`);drawAdmin();openMember(id)});
 $('#frz',d).onclick=()=>{patchMember(id,m.frozen?{frozen:0}:{frozen:1,exp:addDs(m.exp,14)});toast(m.frozen?'Unfrozen':'Frozen for 14 days');drawAdmin();openMember(id)}}
function bindAdmin(){if(ss('adm')!=='1'){const ins=$$('[data-pin]');ins[0].focus();ins.forEach((inp,i)=>{inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&i<3)ins[i+1].focus();const v=ins.map(x=>x.value).join('');if(v.length===4){if(v==='2468'){ss('adm','1');render('admin')}else{$('#pinF').classList.add('shake');$('#pinE').hidden=false;setTimeout(()=>{$('#pinF').classList.remove('shake');ins.forEach(x=>x.value='');ins[0].focus()},450)}}};inp.onkeydown=e=>{if(e.key==='Backspace'&&!inp.value&&i)ins[i-1].focus()}});return}
 $$('[data-at]').forEach(b=>b.onclick=()=>{S.admTab=b.dataset.at;$$('[data-at]').forEach(x=>x.setAttribute('aria-pressed',x===b));drawAdmin()});
 $('#admOut').onclick=()=>{ss('adm','0');render('admin')};drawAdmin();
 S.onStore=()=>{if(S.admTab==='overview')drawAdmin();else drawFeed()}}

/* ---------- motion ---------- */
let io;
function initReveal(){io?.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -5% 0px'});$$('.rv').forEach(el=>RM?el.classList.add('in'):io.observe(el))}
let ticking=false;
function frame(){ticking=false;const y=scrollY,vh=innerHeight;$('#nav')?.classList.toggle('small',y>40);if(RM)return;
 const a=$('.athlete[data-par]');if(a)a.style.transform=`translateY(${(y*+a.dataset.par).toFixed(1)}px)`;
 const ck=$('#checkin');if(ck){const r=ck.getBoundingClientRect();if(r.bottom>0&&r.top<vh){const p=(vh-r.top)/(vh+r.height);$('#big1').style.transform=`translateX(${(-p*40).toFixed(2)}%)`;$('#big2').style.transform=`translateX(${(-30+p*30).toFixed(2)}%)`}}}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(frame)}},{passive:true});
addEventListener('storage',e=>{if(!e.key||!e.key.startsWith('fm_'))return;loadMembers();S.onStore&&S.onStore();if(S.page==='scan')drawLog()});

/* ---------- router ---------- */
const JUMPS=['coaches','plans','recovery','schedule','checkin','faq','programs'];
function route(){let h=(location.hash||'#home').slice(1)||'home';closeModal();$('#mm')?.classList.remove('open');
 if(JUMPS.includes(h)){const was=S.page==='home';if(!was)render('home');document.getElementById(h)?.scrollIntoView({behavior:was?'smooth':'instant',block:'start'});return}
 render(h);scrollTo(0,0)}
function render(h){S.timers.forEach(clearInterval);S.timers=[];S.onStore=null;if(h!=='scan')stopCam();loadMembers();
 let body,bind,cur=h,mode='';
 if(h==='classes'){body=pageClasses();bind=bindClasses}
 else if(h==='join'){body=pageJoin();bind=bindJoin}
 else if(h==='member'){body=pageMember();bind=bindMember}
 else if(h==='scan'){body=pageScan();bind=bindScan;mode='scan'}
 else if(h==='admin'){body=pageAdmin();bind=bindAdmin;mode='admin'}
 else if(h==='journal'){body=pageJournal();bind=bindJournal}
 else if(h.startsWith('article-')&&art(h.slice(8))){const a=art(h.slice(8));body=pageArticle(a);cur='journal'}
 else{h='home';cur='home';body=pageHome();bind=bindHome}
 S.page=h;document.title=({classes:'Classes',join:'Join',member:'Member area',scan:'Front desk',admin:'Admin',journal:'Journal'}[h]||'')+(h==='home'?'FORMA · Fitness & Recovery Club':' · FORMA');
 mount(cur,body,mode);bind&&bind();
 $$('[data-f]').forEach(a=>a.addEventListener('click',()=>{S.fil=a.dataset.f}));
 initReveal();frame()}
addEventListener('hashchange',route);
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const h=a.getAttribute('href').slice(1);if(location.hash==='#'+h){e.preventDefault();route()}});
route();
})();

</script>
