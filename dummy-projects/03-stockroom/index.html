<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stockroom</title>
<meta name="description" content="Stockroom — store analytics and admin for direct-to-consumer brands. Demo project by Organoo Studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap">
<script>document.documentElement.setAttribute("data-ui","light")</script>
<style>
/* Layout: Corelystic layout. Marketing pages on a 1200px column; the store admin is a white sidebar + a floating white workspace on a soft sea-glass ground. Palette: sea green + navy + sky. */
:root{
  --bg:#EEF7F4; --bg-2:#F6FBF9; --surface:#FFFFFF; --surface-2:#F5FAF8; --line:#E2EEEA; --line-2:#CFE2DB;
  --fg:#10231F; --fg-2:#2B433D; --muted:#5E7670; --faint:#97ABA5;
  --accent:#2E9E7F; --accent-2:#38B28F; --accent-soft:#DEF3EC; --accent-fg:#FFFFFF;
  --navy:#3A4FA8; --navy-soft:#E6EAF8; --sky:#4BB5E0; --sky-soft:#E0F3FB;
  --good:#1E9E62; --good-soft:#E0F5EA; --bad:#E0434F; --bad-soft:#FDE7E9; --warn:#C27800; --warn-soft:#FFF2D4;
  --shadow:0 1px 2px rgba(16,35,31,.04),0 12px 32px -18px rgba(16,60,50,.22);
  --ink:#10231F; --ink-fg:#FFFFFF;
  --f-ui:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Sora","Manrope",ui-sans-serif,system-ui,sans-serif;
}
:root[data-ui="dark"]{
  --bg:#07120F; --bg-2:#0B1915; --surface:#0F1E1A; --surface-2:#132621; --line:#1C3330; --line-2:#28453F;
  --fg:#E7F4F0; --fg-2:#C2D8D2; --muted:#8AA59E; --faint:#5A736D;
  --accent:#3FC39C; --accent-2:#62D3B1; --accent-soft:#113A30; --accent-fg:#04150F;
  --navy:#8193F0; --navy-soft:#1B2450; --sky:#5CC6F0; --sky-soft:#0F2F3D;
  --good:#46D492; --good-soft:#12352A; --bad:#FF7285; --bad-soft:#3B1720; --warn:#F2B347; --warn-soft:#33270E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -18px rgba(0,0,0,.7);
  --ink:#E7F4F0; --ink-fg:#07120F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
svg.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn.lg{height:48px;padding:0 22px;font-size:15px;border-radius:12px}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg-2);position:relative;flex:none}
.ibtn:hover{background:var(--surface-2)}
.ibtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.input{width:100%;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.err{border-color:var(--bad)}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--fg-2)}
.hint{font-size:12px;color:var(--muted)}
.hint.err{color:var(--bad)}
.dd{height:32px;padding:0 28px 0 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:600;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 10px) 14px;background-size:4px 4px;background-repeat:no-repeat}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill svg{width:13px;height:13px}
.pill.good{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 25%,transparent)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.pill.navy{background:var(--navy-soft);color:var(--navy)}
.pill.sky{background:var(--sky-soft);color:var(--sky)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;flex:none}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.seg button{border:0;background:transparent;height:32px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg .save{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--sky-soft);color:var(--navy)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}

/* ================= marketing ================= */
.wrap{max-width:1200px;margin:0 auto;padding-inline:24px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg-2) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:22px;height:66px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:600;font-size:19px;text-decoration:none;letter-spacing:-.02em}
.logo svg{width:28px;height:28px;flex:none}
.links{display:flex;gap:2px}
.links a{padding:8px 12px;border-radius:9px;text-decoration:none;font-weight:600;font-size:14px;color:var(--fg-2)}
.links a:hover,.links a[aria-current="page"]{background:var(--surface);color:var(--fg)}
.nav-cta{margin-left:auto;display:flex;gap:8px;align-items:center}
.ibtn.burger{display:none}
.mmenu{display:none}
@media (max-width:860px){.links,.nav-cta .hide-m{display:none}.ibtn.burger{display:grid}.mmenu.open{display:grid;padding:6px 24px 16px;border-top:1px solid var(--line)}.mmenu a{padding:12px 2px;text-decoration:none;font-weight:600;border-bottom:1px solid var(--line)}}
.hero{padding-block:64px 24px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.hero-grid>*{min-width:0}
@media (max-width:960px){.hero-grid{grid-template-columns:1fr}}
.hero .tag{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;text-decoration:none}
.hero .tag b{background:var(--accent);color:var(--accent-fg);padding:2px 9px;border-radius:999px;font-size:11px;letter-spacing:.04em}
.hero h1{font-family:var(--f-display);font-size:clamp(38px,5.4vw,64px);font-weight:600;letter-spacing:-.04em;line-height:1.02;margin:20px 0 18px}
.hero h1 span{color:var(--accent)}
.hero .lead{font-size:17.5px;color:var(--muted);max-width:52ch}
.hero-form{display:flex;gap:8px;margin-top:28px;max-width:470px;padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero-form input{flex:1;min-width:0;border:0;background:transparent;padding:0 12px;outline:none}
.hero-note{font-size:13px;color:var(--muted);margin-top:10px}
.hero-note.err{color:var(--bad)}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-size:13px;color:var(--muted)}
.trust span{display:flex;gap:6px;align-items:center}
.trust svg{color:var(--accent)}
.stage{position:relative;border-radius:26px;padding:26px;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--sky) 30%,transparent),transparent 60%),radial-gradient(90% 80% at 0% 100%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 60%),var(--accent-soft);overflow:hidden}
.stage .ring{position:absolute;border-radius:50%;border:40px solid color-mix(in srgb,var(--surface) 35%,transparent);pointer-events:none}
.stage .card{position:relative}
.float{position:absolute;right:18px;bottom:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-size:13px;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.logo-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 46px;color:var(--faint);font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.02em;padding-block:40px 8px}
section.b{padding-block:88px 0}
.sh{max-width:640px;margin-bottom:40px}
.sh.c{margin-inline:auto;text-align:center}
.sh h2{font-family:var(--f-display);font-size:clamp(30px,4vw,46px);font-weight:600;letter-spacing:-.035em;margin:10px 0 14px}
.sh p{color:var(--muted);font-size:17px}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.bento{grid-template-columns:1fr}}
.bc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bc.wide{grid-column:span 2}
@media (max-width:900px){.bc.wide{grid-column:auto}}
.bc h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.bc p{color:var(--muted);font-size:14.5px}
.bc .viz{margin-top:auto;padding-top:14px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:13px}
.alert+.alert{margin-top:8px}
.calc{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:30px}
@media (max-width:860px){.calc{grid-template-columns:1fr;padding:22px}}
.rr{display:grid;gap:8px;margin-bottom:20px}
.rr .top{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.calc-out{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--navy)));color:#fff;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:14px}
.calc-out .k{font-size:13px;opacity:.85}
.calc-out .v{font-family:var(--f-display);font-size:42px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.calc-out .row{display:flex;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25);font-size:14px}
.calc-out .btn{background:#fff;color:#10231F;border:0;margin-top:auto}
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.quotes{grid-template-columns:1fr}}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:20px;margin:0}
.quote blockquote{margin:0;font-size:15.5px;line-height:1.6}
.who{display:flex;gap:12px;align-items:center;margin-top:auto}
.who small{display:block;color:var(--muted);font-size:13px}
.cta{margin-top:88px;border-radius:28px;padding:60px 32px;text-align:center;background:linear-gradient(135deg,var(--navy),color-mix(in srgb,var(--navy) 40%,var(--accent)));color:#fff;position:relative;overflow:hidden}
.cta h2{font-family:var(--f-display);font-size:clamp(30px,4.4vw,50px);letter-spacing:-.035em;font-weight:600;max-width:18ch;margin:0 auto 14px}
.cta p{opacity:.8;max-width:50ch;margin:0 auto 26px}
.cta .btn{border:0}
.cta .btn.light{background:#fff;color:#10231F}
.cta .btn.out{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
footer.site{padding-block:56px 40px;border-top:1px solid var(--line);margin-top:88px}
.fgrid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px}
.fgrid h4{font-size:13px;margin-bottom:10px;color:var(--muted)}
.fgrid a{display:block;text-decoration:none;padding:4px 0;font-size:14px;color:var(--fg-2)}
.fgrid a:hover{color:var(--accent)}
.fbot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:40px;color:var(--muted);font-size:13px}
@media (max-width:760px){.fgrid{grid-template-columns:1fr 1fr}.fgrid>div:first-child{grid-column:span 2}}
.page-head{padding-block:60px 28px;text-align:center}
.page-head h1{font-family:var(--f-display);font-size:clamp(34px,5vw,58px);letter-spacing:-.04em;font-weight:600;margin:12px auto 14px;max-width:18ch}
.page-head p{color:var(--muted);font-size:17px;max-width:56ch;margin:0 auto}
.ctrls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
@media (max-width:900px){.plans{grid-template-columns:1fr}}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:14px;position:relative}
.plan.feat{border:2px solid var(--accent);box-shadow:0 20px 50px -26px color-mix(in srgb,var(--accent) 70%,transparent)}
.plan .badge{position:absolute;top:-12px;left:24px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.plan h3{font-size:18px}
.plan .price{display:flex;align-items:baseline;gap:6px}
.plan .price b{font-family:var(--f-display);font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:9px;font-size:14px}
.plan li{display:flex;gap:9px}
.plan li svg{color:var(--accent);margin-top:2px}
.plan .btn{margin-top:auto}
.gmv{max-width:720px;margin:26px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 22px;display:grid;gap:8px}
.gmv .top{display:flex;justify-content:space-between;font-weight:700;font-size:14px;gap:10px;flex-wrap:wrap}
.cmp-wrap{position:relative;overflow-x:auto;margin-top:60px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
table.cmp{width:100%;border-collapse:collapse;min-width:640px;font-size:14px}
table.cmp th,table.cmp td{padding:13px 18px;border-bottom:1px solid var(--line);text-align:left}
table.cmp td:not(:first-child),table.cmp th:not(:first-child){text-align:center}
table.cmp thead th{font-size:13px;color:var(--muted)}
.faq{max-width:760px;margin:80px auto 0}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:20px 0;font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;color:var(--accent);line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding-bottom:20px;color:var(--muted);max-width:65ch}
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.int{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:border-color .15s,transform .15s}
.int:hover{border-color:var(--accent);transform:translateY(-2px)}
.int .top{display:flex;justify-content:space-between;align-items:center}
.mono{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.int h3{font-size:15.5px}
.int p{font-size:13.5px;color:var(--muted);flex:1}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:28px 0 18px}
.search{position:relative;flex:1;max-width:360px;min-width:200px}
.search svg{position:absolute;left:11px;top:11px;color:var(--muted);width:16px;height:16px}
.search input{padding-left:34px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.auth{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
.auth-form{display:flex;flex-direction:column;justify-content:center;gap:20px;padding:40px 24px;max-width:430px;width:100%;margin:0 auto}
.auth-form h1{font-family:var(--f-display);font-size:34px;letter-spacing:-.03em;font-weight:600}
.auth-art{background:linear-gradient(160deg,var(--accent),var(--navy));color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.auth-art blockquote{margin:0;font-family:var(--f-display);font-size:26px;line-height:1.3;letter-spacing:-.02em;max-width:22ch}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-art{display:none}}

/* ================= app ================= */
.app{display:grid;grid-template-columns:260px 1fr;height:100%;padding:14px;gap:14px}
.side{background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow-y:auto}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 16px;border-bottom:1px solid var(--line)}
.side-top .logo{font-size:18px}
.side nav{padding:14px 12px;display:grid;gap:2px}
.side h6{margin:10px 8px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.side a.nl{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--fg-2);font-size:14px;font-weight:600;position:relative}

function smooth(pts){if(pts.length<2)return '';let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0]} ${p2[1]}`}return d}
function curveChart(el,data,labels,opts={}){

  const W=640,H=240,P={l:opts.axis?40:8,r:8,t:18,b:28};const all=keys.flatMap(k=>data[k]);const max=Math.max(...all,1)*1.12;
  const x=i=>P.l+i*(W-P.l-P.r)/(labels.length-1),y=v=>H-P.b-v/max*(H-P.t-P.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label||'Line chart'}"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".18"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  labels.forEach((l,i)=>{s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${x(i)}" y="${H-7}" text-anchor="middle" class="ax lbl" data-i="${i}">${l}</text>`});
  if(opts.axis){for(let g=0;g<=3;g++){const v=max*g/3;s+=`<text x="${P.l-8}" y="${y(v)+4}" text-anchor="end" class="ax num">${opts.fmt?opts.fmt(v):fmt(v)}</text>`}}
  keys.forEach((k,ki)=>{const pts=data[k].map((v,i)=>[+x(i).toFixed(1),+y(v).toFixed(1)]);const d=smooth(pts);if(ki===0)s+=`<path d="${d} L${x(labels.length-1)} ${H-P.b} L${x(0)} ${H-P.b}Z" fill="url(#cg)"/>`;s+=`<path d="${d}" fill="none" stroke="${cols[k]||'var(--accent)'}" stroke-width="2.4" stroke-linecap="round"/>`});
  s+=`<g class="hl" opacity="0"></g><rect x="${P.l}" y="0" width="${W-P.l-P.r}" height="${H}" fill="transparent" class="hit"/></svg>`;
  el.innerHTML=`<div class="chart">${s}<div class="tip"></div></div>`;
  const svg=$('svg',el),tip=$('.tip',el),hl=$('.hl',el);
  const show=i=>{const r=svg.getBoundingClientRect();hl.setAttribute('opacity',1);hl.innerHTML=keys.map(k=>`<circle cx="${x(i)}" cy="${y(data[k][i])}" r="5.5" fill="${cols[k]}" stroke="var(--surface)" stroke-width="2.5"/>`).join('');
    $$('.lbl',el).forEach(t=>t.setAttribute('class','ax lbl'+(+t.dataset.i===i?' ax-b':'')));
    const top=Math.min(...keys.map(k=>y(data[k][i])));tip.innerHTML=keys.map(k=>`<b class="num">${opts.fmt?opts.fmt(data[k][i],1):fmt(data[k][i])}</b> <span style="opacity:.7">${k}</span>`).join('<br>')+`<br><span style="opacity:.7">${opts.tipLabel?opts.tipLabel(i):labels[i]}</span>`;
    tip.style.left=(x(i)/W*r.width)+'px';tip.style.top=(top/H*r.height)+'px';tip.classList.add('show')};
  $('.hit',el).addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*W;show(Math.max(0,Math.min(labels.length-1,Math.round((px-P.l)/((W-P.l-P.r)/(labels.length-1))))))});
  $('.hit',el).addEventListener('mouseleave',()=>{tip.classList.remove('show');hl.setAttribute('opacity',0);$$('.lbl',el).forEach(t=>t.setAttribute('class','ax lbl'))});
  if(opts.pin!=null)show(opts.pin);
}
function donut(el,parts,center){const R=62,sw=20,C=2*Math.PI*R;const tot=parts.reduce((a,p)=>a+p.v,0);let off=0;

  parts.forEach(p=>{const l=C*p.v/tot;s+=`<circle cx="85" cy="85" r="${R}" fill="none" stroke="${p.c}" stroke-width="${sw}" stroke-dasharray="${Math.max(0,l-3)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"><title>${p.k}: ${Math.round(p.v/tot*100)}%</title></circle>`;off+=l});
  el.innerHTML=s+`<text x="85" y="80" text-anchor="middle" class="ax">${center[0]}</text><text x="85" y="101" text-anchor="middle" style="font-size:19px;font-weight:800;fill:var(--fg)" class="num">${center[1]}</text></svg>`}

const statusPill=s=>{const m={'In Stock':'good','Low Stock':'warn','Out of Stock':'bad','Draft':'neutral',Paid:'good',Pending:'warn',Refunded:'neutral',Unfulfilled:'warn',Fulfilled:'sky',Delivered:'good',Returned:'bad',Succeeded:'good','In transit':'sky',VIP:'navy',Returning:'acc',New:'sky','At risk':'bad'};const i={'In Stock':'checkc',Paid:'checkc',Delivered:'checkc',Succeeded:'checkc'};return `<span class="pill ${m[s]||'neutral'}">${i[s]?ic(i[s]):''}${s}</span>`};

/* ---------- Products table (shared) ---------- */
function productTable(el,{compact}={}){
  const per=compact?5:10;
  const list=()=>{const q=S.prodQ.toLowerCase();let l=S.products.filter(p=>(S.prodStatus==='All status'||p.status===S.prodStatus)&&(S.prodCat==='All'||p.cat===S.prodCat)&&(p.name+p.sku).toLowerCase().includes(q));const {k,d}=S.prodSort;l.sort((a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0)*d);return l};
  const draw=()=>{const l=list();const pages=Math.max(1,Math.ceil(l.length/per));S.prodPage=Math.min(S.prodPage,pages);const sl=l.slice((S.prodPage-1)*per,S.prodPage*per);const selN=S.prodSel.size;
   el.innerHTML=`<div class="ch"><h3>Products${S.prodCat!=='All'?` <span class="pill acc" style="margin-left:4px">${S.prodCat} <button type="button" id="clrCat" aria-label="Clear category" style="border:0;background:none;padding:0;color:inherit;display:grid">${ic('x','width:12px;height:12px')}</button></span>`:''}</h3><div class="filters"><div class="search">${ic('search')}<label class="sr" for="pq">Search products</label><input class="input" id="pq" placeholder="Search Product..." value="${esc(S.prodQ)}"></div><label class="sr" for="ps">Status</label><select class="dd" id="ps" style="height:34px">${['All status','In Stock','Low Stock','Out of Stock','Draft'].map(s=>`<option ${s===S.prodStatus?'selected':''}>${s}</option>`).join('')}</select><button class="btn primary sm" id="pAdd" style="height:34px">Add New Product ${ic('pluscircle','width:15px;height:15px')}</button></div></div>
   ${selN?`<div class="bulk"><span>${selN} selected</span><button class="btn sm" id="bStock">Restock +50</button><button class="btn sm" id="bDraft">Set as draft</button><button class="btn sm danger" id="bDel">Delete</button><button class="btn ghost sm" id="bClr" style="margin-left:auto">Clear</button></div>`:''}
   <div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:44px"><input type="checkbox" id="pAll" aria-label="Select all on this page" ${sl.length&&sl.every(p=>S.prodSel.has(p.id))?'checked':''}></th>${[['name','Product'],['price','Price'],['stock','Stock'],['revenue','Revenue'],['status','Status']].map(c=>`<th><button type="button" data-ps="${c[0]}">${c[1]}${S.prodSort.k===c[0]?(S.prodSort.d>0?' ↑':' ↓'):''}</button></th>`).join('')}<th><span class="sr">Actions</span></th></tr></thead><tbody>
   ${sl.map(p=>`<tr class="${S.prodSel.has(p.id)?'sel':''}"><td><input type="checkbox" data-sel="${p.id}" ${S.prodSel.has(p.id)?'checked':''} aria-label="Select ${esc(p.name)}"></td><td><div class="cu"><span class="thumb" style="background:${catColor(p.cat)}">${esc(ini(p.name))}</span><div><b style="font-weight:600">${esc(p.name)}</b><small>${p.sku} · ${p.cat}</small></div></div></td><td class="num">${money(p.price)}</td><td class="num">${fmt(p.stock)}</td><td class="num">${money(p.revenue)}</td><td>${statusPill(p.status)}</td><td><button class="rm" data-pm="${p.id}" aria-label="Actions for ${esc(p.name)}">${ic('dots')}</button></td></tr>`).join('')||`<tr><td colspan="7"><div class="empty">No products match. <button class="btn sm" type="button" id="pReset">Reset filters</button></div></td></tr>`}
   </tbody></table></div><div class="pager"><span>${l.length?`Showing ${(S.prodPage-1)*per+1}–${Math.min(S.prodPage*per,l.length)} of ${l.length} products`:'0 products'}</span><div class="b">${compact?'<a class="btn sm" href="#app-products">View all</a>':''}<button class="btn sm" id="pPrev" ${S.prodPage<=1?'disabled':''}>Previous</button><button class="btn sm" id="pNext" ${S.prodPage>=pages?'disabled':''}>Next</button></div></div>`;
   const q=$('#pq',el);q.oninput=()=>{S.prodQ=q.value;S.prodPage=1;draw();const n=$('#pq',el);n.focus();n.setSelectionRange(n.value.length,n.value.length)};
   $('#ps',el).onchange=e=>{S.prodStatus=e.target.value;S.prodPage=1;draw()};$('#clrCat',el)?.addEventListener('click',()=>{S.prodCat='All';draw()});$('#pReset',el)?.addEventListener('click',()=>{S.prodQ='';S.prodStatus='All status';S.prodCat='All';draw()});
   $$('[data-ps]',el).forEach(b=>b.onclick=()=>{const k=b.dataset.ps;S.prodSort={k,d:S.prodSort.k===k?-S.prodSort.d:(k==='name'?1:-1)};draw()});

   $('#pAdd',el).onclick=()=>productForm(null,draw);
   $$('[data-pm]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();const p=S.products.find(x=>x.id===+b.dataset.pm);menu(b,[{t:'Edit product',icon:'edit',run:()=>productForm(p,draw)},{t:'Adjust stock',icon:'box',run:()=>stockForm(p,draw)},{t:p.status==='Draft'?'Publish':'Set as draft',icon:'checkc',run:()=>{p.status=p.status==='Draft'?stockStatus(p.stock):'Draft';draw();toast(p.status==='Draft'?'Moved to drafts':'Product published')}},{t:'Duplicate',icon:'copy',run:()=>{S.products.unshift({...p,id:Date.now(),name:p.name+' (copy)',sku:p.sku+'-C',sold:0,revenue:0,status:'Draft'});draw();toast('Duplicated as draft')}},'-',{t:'Delete',icon:'trash',danger:1,run:()=>modal({title:'Delete product?',submit:'Delete',body:`<p>Delete <b>${esc(p.name)}</b>?</p>`,onSubmit:()=>{S.products=S.products.filter(x=>x!==p);S.prodSel.delete(p.id);draw();toast('Product deleted')}})}])});

   <button class="btn sm" data-gu="${g.id}">Log progress</button></div>`}).join('')}</div>`;

 onSubmit:f=>{if(!req(f,['n','t','c']))return false;if(+f.elements.t.value<=0){f.elements.t.classList.add('err');toast('Target must be above zero');return false}const dd=new Date(f.elements.d.value);const v={name:f.elements.n.value.trim(),metric:f.elements.m.value,target:+f.elements.t.value,current:+f.elements.c.value,due:isNaN(dd)?'Dec 31, 2026':dstr(dd)};if(e)Object.assign(g,v);else S.goals.push({id:Date.now(),color:['var(--accent)','var(--navy)','var(--sky)','#E0784A','#D9468F'][S.goals.length%5],...v});after();toast(e?'Goal saved':'Goal created')}})}

  const items=[...Object.entries(APP).map(([h,t])=>({t:'Go to '+t,k:'Page',run:()=>location.hash=h})),{t:'Add new product',k:'Action',run:()=>{location.hash='app-products';setTimeout(()=>$('#pAdd')?.click(),60)}},{t:'Create order',k:'Action',run:()=>{location.hash='app-orders';setTimeout(()=>$('#oNew')?.click(),60)}},{t:'Create discount code',k:'Action',run:()=>{location.hash='app-marketing';setTimeout(()=>$('#dNew')?.click(),60)}},{t:'Toggle dark mode',k:'Action',run:()=>{applyTheme(isDark()?'light':'dark');route()}},...S.products.map(p=>({t:p.name,k:'Product',run:()=>{S.prodQ=p.name;S.prodCat='All';S.prodStatus='All status';location.hash='app-products';if(location.hash==='#app-products')route()}})),...S.orders.slice(0,15).map(o=>({t:'#'+o.no+' · '+o.cust,k:'Order',run:()=>{location.hash='app-orders';setTimeout(()=>orderDrawer(o,()=>route()),80)}}))];
  const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="pal" role="dialog" aria-label="Search"><input id="palQ" placeholder="Search products, orders or pages…" aria-label="Search"><ul id="palL"></ul></div>`;document.body.appendChild(ov);
  let sel=0,cur=[];const close=()=>ov.remove();const draw=()=>{const q=$('#palQ').value.toLowerCase();cur=items.filter(i=>i.t.toLowerCase().includes(q)).slice(0,9);sel=Math.min(sel,Math.max(0,cur.length-1));$('#palL').innerHTML=cur.length?cur.map((i,k)=>`<li class="${k===sel?'on':''}" data-k="${k}">${esc(i.t)}<small>${i.k}</small></li>`).join(''):'<li class="muted" style="cursor:default">No matches</li>';$$('#palL [data-k]').forEach(li=>li.onclick=()=>{close();cur[+li.dataset.k].run()})};
  draw();$('#palQ').focus();$('#palQ').oninput=()=>{sel=0;draw()};ov.addEventListener('click',e=>{if(e.target===ov)close()});
  $('#palQ').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(cur.length-1,sel+1);draw();e.preventDefault()}if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}if(e.key==='Enter'&&cur[sel]){close();cur[sel].run()}if(e.key==='Escape')close()})}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='b'&&$('#sideX')){e.preventDefault();$('#sideX').click()}});

$('#demoClose').onclick=()=>$('#demoBadge').remove();
route();
})();
</script>
