<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arbor &amp; Co.</title>
<meta name="description" content="Arbor & Co. — slow-made, sustainable furniture for everyday living. A Shopify storefront demo by Organoo Studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: editorial catalogue. Split nav with centred wordmark, full-bleed photo hero with shop-the-look hotspots, room tiles, product carousel, asymmetric bestseller grid, sticky "made to last" story, UGC wall, light sand footer with oversized wordmark. Light-only by design. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --soft:#F3F3F1; --soft-2:#EAEAE6; --line:#E4E4E0; --line-2:#D4D4CF;
  --ink:#151515; --fg:#1A1A1A; --fg-2:#3B3B39; --muted:#6D6D69; --faint:#A3A39E;
  --blue:#7C9BBB; --blue-deep:#45688E; --blue-soft:#E7EEF5; --oak:#C08A55; --sage:#9DB8A2; --sand:#E9DECD; --mustard:#D8B44A;
  --good:#2F8F5B; --bad:#C8423B; --warn:#B7791F;
  --f-display:"Urbanist",ui-sans-serif,system-ui,sans-serif;
  --f-ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-card:22px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;line-height:1.08;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue-deep);outline-offset:3px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px}
@media (max-width:600px){.wrap{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--ink);background:var(--bg);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#333}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn.lg{height:52px;padding:0 26px;font-size:15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .go{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;margin-right:-12px;transition:transform .3s}
.btn:hover .go{transform:rotate(45deg)}
.circ{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;border:0;display:grid;place-items:center;flex:none;transition:transform .3s cubic-bezier(.3,1.4,.5,1),background .2s}
.circ:hover{transform:rotate(45deg) scale(1.06)}
.circ.added{background:var(--good)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;position:relative;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}
.badge-n{position:absolute;top:3px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.badge-n.pop{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.35)}}
.chip{height:34px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);background:var(--bg);font-size:13px;font-weight:500;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.input{width:100%;height:46px;padding:0 16px;border:1px solid var(--line-2);border-radius:14px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:96px;padding:12px 16px;resize:vertical}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--soft-2)}
.input.err{border-color:var(--bad)}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--fg-2)}
.err-t{font-size:12px;color:var(--bad)}
.stars{display:inline-flex;gap:1px;color:var(--mustard)}
.stars svg{width:13px;height:13px;fill:currentColor;stroke:none}
.stars .off{color:var(--line-2)}
.dot-sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2);cursor:pointer;padding:0}
.dot-sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* announcement + nav */
.announce{background:var(--ink);color:#fff;font-size:12.5px;text-align:center;padding:8px 16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.announce b{font-weight:600}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);transition:box-shadow .2s}
.nav.scrolled{box-shadow:0 1px 0 var(--line)}
.nav .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:74px;gap:16px}
.logo{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:20px;text-decoration:none;letter-spacing:-.02em}
.logo svg{width:26px;height:26px}
.links{display:flex;gap:26px;font-size:14px;font-weight:500}
.links a{text-decoration:none;position:relative;padding:6px 0}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.links a:hover::after,.links a[aria-current="page"]::after{transform:scaleX(1)}
.nav-r{display:flex;justify-content:flex-end;align-items:center;gap:2px}
.cur{height:34px;border:1px solid var(--line-2);border-radius:999px;padding:0 10px;background:#fff;font-size:12.5px;font-weight:600;margin-right:6px}
.burger{display:none}
.mmenu{display:none}
@media (max-width:900px){.links{display:none}.nav .wrap{grid-template-columns:auto 1fr;height:64px}.burger{display:grid}.mmenu.open{display:grid;padding:4px 24px 18px}.mmenu a{padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600;font-family:var(--f-display);font-size:19px}.cur{display:none}}

/* hero */
.hero{padding-block:34px 18px}
.hero h1{font-size:clamp(34px,5.6vw,68px);text-align:center;font-weight:600;letter-spacing:-.035em;line-height:1.12}
.hero h1 .w{display:inline-block;animation:wordUp .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes wordUp{from{transform:translateY(40%);opacity:.001;filter:blur(6px)}}
.pill-img{display:inline-block;vertical-align:middle;height:.82em;width:1.25em;border-radius:999px;background:var(--soft);overflow:hidden;margin:0 .08em;transition:width .5s cubic-bezier(.3,1.2,.4,1);position:relative;top:-.06em}
.pill-img.wide{width:2em}
.pill-img:hover{width:2.6em}
.pill-img svg{width:100%;height:100%}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;margin-top:34px}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.stage{aspect-ratio:4/3.2}}
@media (max-width:600px){.announce span:not(:first-child){display:none}.nav-r .hide-s{display:none}}
.stage{position:relative;border-radius:30px;overflow:hidden;background:#EEF0F1;aspect-ratio:16/9;max-width:100%}
.stage>svg{width:100%;height:100%;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.tab{position:absolute;background:var(--bg);display:flex;align-items:center;gap:10px;z-index:2}
.tab::before,.tab::after{content:"";position:absolute;width:24px;height:24px}
.tab.tl{top:0;left:0;border-radius:0 0 24px 0;padding:10px 16px 12px 10px}
.tab.tl::before{top:0;right:-24px;background:radial-gradient(circle at 100% 100%,transparent 23.5px,var(--bg) 24px)}
.tab.tl::after{left:0;bottom:-24px;background:radial-gradient(circle at 100% 100%,transparent 23.5px,var(--bg) 24px)}
.tab.br{right:0;bottom:0;border-radius:24px 0 0 0;padding:12px 10px 10px 14px}
.tab.br::before{bottom:0;left:-24px;background:radial-gradient(circle at 0 0,transparent 23.5px,var(--bg) 24px)}
.tab.br::after{right:0;top:-24px;background:radial-gradient(circle at 0 0,transparent 23.5px,var(--bg) 24px)}
.tab.tr{right:0;top:0;border-radius:0 0 0 24px;padding:10px 10px 12px 14px}
.tab.tr::before{top:0;left:-24px;background:radial-gradient(circle at 0 100%,transparent 23.5px,var(--bg) 24px)}
.tab.tr::after{right:0;bottom:-24px;background:radial-gradient(circle at 0 100%,transparent 23.5px,var(--bg) 24px)}
.avs{display:flex}
.avs span{width:34px;height:34px;border-radius:50%;border:2px solid #fff;margin-left:-10px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.avs span:first-child{margin-left:0}
.tab small{font-size:12px;line-height:1.25;font-weight:600;display:block}
.minis{display:grid;gap:18px}
@media (max-width:860px){.minis{grid-template-columns:1fr 1fr}}
.mini{background:var(--soft);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px;text-decoration:none;position:relative;transition:transform .3s}
.mini:hover{transform:translateY(-4px)}
.mini .pic{background:#fff;border-radius:16px;aspect-ratio:1.15;overflow:hidden;position:relative}
.mini .pic svg{width:100%;height:100%}
.mini .sws{position:absolute;left:10px;top:10px;display:grid;gap:4px}
.mini .sws i{width:9px;height:9px;border-radius:50%;display:block}
.mini .meta{display:flex;justify-content:space-between;align-items:flex-end;padding:0 6px 4px;font-size:13px;font-weight:600}

/* stats + marquee */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-block:52px 40px;text-align:center}
.stats b{font-family:var(--f-display);font-weight:500;font-size:clamp(44px,6vw,68px);letter-spacing:-.04em;display:block;line-height:1}
.stats span{display:block;margin:12px auto 0;color:var(--muted);font-size:13.5px;max-width:24ch}
@media (max-width:640px){.stats{grid-template-columns:1fr;gap:34px}}
.marquee{border-block:1px solid var(--line);overflow:hidden;padding-block:16px;background:var(--bg)}
.marquee .track{display:flex;gap:44px;width:max-content;animation:mq 40s linear infinite;font-family:var(--f-display);font-size:20px;font-weight:500}
.marquee .track span{display:flex;align-items:center;gap:44px;white-space:nowrap}
.marquee .track span::after{content:"✦";color:var(--blue)}
@keyframes mq{to{transform:translateX(-50%)}}
.marquee:hover .track{animation-play-state:paused}

/* sections */
section.s{padding-block:88px 0}
.sh{text-align:center;margin-bottom:26px}
.sh h2{font-size:clamp(30px,3.8vw,44px)}
.sh p{color:var(--muted);margin-top:10px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.pcard{position:relative;display:flex;flex-direction:column}
.pcard .plinth{background:var(--soft);border-radius:var(--r-card);aspect-ratio:1/0.98;position:relative;overflow:hidden;display:block;text-decoration:none}
.pcard .plinth svg.art{position:absolute;left:0;right:0;top:-7%;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.pcard:hover .plinth svg.art{transform:translateY(-10px) scale(1.04)}
.pcard .plinth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard .label{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 0 0 18px;pointer-events:none}
.pcard .label .txt{display:flex;justify-content:space-between;align-items:center;flex:1;gap:10px;padding-bottom:18px;padding-right:14px;font-size:14px}
.pcard .label .txt b{font-size:17px;font-weight:600}
.pcard .label .tab{position:relative;pointer-events:auto}
.pcard .heart{position:absolute;top:14px;right:14px;z-index:2}
.pcard .tag{position:absolute;top:16px;left:16px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;z-index:2}
.pcard .tag.sale{background:var(--ink);color:#fff}
.heart svg.i{transition:fill .2s,transform .3s}
.heart[aria-pressed="true"] svg.i{fill:#E0525A;stroke:#E0525A;transform:scale(1.12)}
.empty{padding:48px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:22px}

/* why */
.why{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
@media (max-width:900px){.why{grid-template-columns:1fr}}
.vid{position:relative;border-radius:var(--r-card);overflow:hidden;aspect-ratio:4/3;background:#EDEAE6;display:block;width:100%;border:0;padding:0;text-align:left}
.vid svg.scene{width:100%;height:100%;display:block}
.vid .play{position:absolute;right:0;bottom:0}
.vid .play .circ{width:52px;height:52px}
.vid:hover .play .circ{transform:scale(1.1)}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;padding:18px 4px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:22px;font-weight:400;transition:transform .3s}
.acc details[open] summary::after{transform:rotate(45deg)}
.acc details p{padding:0 4px 18px;color:var(--muted);max-width:56ch;font-size:14.5px}

/* showroom banner */
.banner{position:relative;border-radius:30px;overflow:hidden;background:#5E7690;color:#fff;min-height:360px;display:flex;align-items:center}
.banner svg.scene{position:absolute;inset:0;width:100%;height:100%}
.banner .copy{position:relative;padding:48px;max-width:560px;display:grid;gap:20px;justify-items:start}
.banner h2{font-size:clamp(28px,3.6vw,42px);line-height:1.15;text-shadow:0 2px 20px rgba(0,0,0,.18)}
.banner .btn{border-color:#fff;color:var(--ink)}
@media (max-width:640px){.banner .copy{padding:28px 22px 88px}}

/* reviews slider */
.rev-wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:40px;align-items:center}
@media (max-width:900px){.rev-wrap{grid-template-columns:1fr}}
.rev-track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.rev-track::-webkit-scrollbar{display:none}
.rev{flex:0 0 min(360px,85%);scroll-snap-align:start;background:var(--soft);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:16px}
.rev blockquote{margin:0;font-size:15.5px;line-height:1.6}
.who{display:flex;gap:12px;align-items:center;margin-top:auto;font-size:13px}
.who .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.who b{display:block;font-size:14px}

/* newsletter */
.news{text-align:center;padding-block:96px 90px}
.news h2{font-size:clamp(28px,3.6vw,42px);font-weight:500}
.news h2 b{font-weight:700}
.news form{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:24px;flex-wrap:wrap}
.news .input{max-width:360px;border-radius:999px;height:46px}
.code-box{display:inline-flex;align-items:center;gap:12px;margin-top:22px;padding:10px 10px 10px 18px;border:1.5px dashed var(--ink);border-radius:999px;font-weight:700;letter-spacing:.08em}

/* footer */
footer.site{background:var(--ink);color:#CFCFCB;padding-block:56px 30px;margin-top:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr 1fr;gap:28px;align-items:start}
.fgrid h4{font-family:var(--f-ui);font-size:14px;color:#fff;font-weight:600;margin-bottom:12px;letter-spacing:0}
.fgrid a{display:block;text-decoration:none;font-size:13px;padding:3px 0;color:#A9A9A4}
.fgrid a:hover{color:#fff}
.fgrid .logo{--logo-bg:#fff;--logo-fg:#151515;color:#fff;font-size:28px;justify-self:center;align-self:center}
.fgrid .logo svg{width:34px;height:34px}
.fbot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid #333;margin-top:40px;padding-top:20px;font-size:12px;color:#8C8C88}
.fbot a{text-decoration:none;margin-left:18px}
.shopify{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid #3a3a3a;border-radius:999px;color:#D6D6D2;font-size:12px}
.shopify i{width:8px;height:8px;border-radius:50%;background:#95BF47;display:inline-block}
@media (max-width:900px){.fgrid{grid-template-columns:1fr 1fr}.fgrid .logo{grid-column:1/-1;justify-self:start;order:-1}}

/* shop page */
.page-h{padding-block:44px 28px}
.crumbs{display:flex;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.page-h h1{font-size:clamp(34px,5vw,58px);margin-top:12px;letter-spacing:-.035em}
.shop{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px}
@media (max-width:900px){.shop{grid-template-columns:1fr}}
.filters{display:grid;gap:26px;align-content:start;position:sticky;top:90px}
@media (max-width:900px){.filters{position:static;background:var(--soft);padding:18px;border-radius:18px}}
.filters h4{font-family:var(--f-ui);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;color:var(--muted)}
.filters label.ck{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px;cursor:pointer}
.filters input[type=checkbox],.filters input[type=radio]{accent-color:var(--ink);width:16px;height:16px}
.filters .sws{display:flex;gap:8px;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--ink)}
.shop-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.sel{height:40px;border:1px solid var(--line-2);border-radius:999px;padding:0 34px 0 16px;background:#fff;font-size:13.5px;font-weight:500;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 17px,calc(100% - 13px) 17px;background-size:5px 5px;background-repeat:no-repeat}

/* product page */
.pdp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;padding-bottom:40px}
@media (max-width:900px){.pdp{grid-template-columns:1fr;gap:28px}}
.gallery{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-self:start;position:sticky;top:90px}
@media (max-width:900px){.gallery{position:static;grid-template-columns:1fr}.thumbs{order:2;display:flex!important}}
.thumbs{display:grid;gap:12px;align-content:start}
.thumbs button{width:84px;height:84px;border-radius:16px;background:var(--soft);border:2px solid transparent;padding:0;overflow:hidden}
.thumbs button[aria-pressed="true"]{border-color:var(--ink)}
.thumbs svg{width:100%;height:100%}
.main-img{background:var(--soft);border-radius:28px;aspect-ratio:1;position:relative;overflow:hidden;cursor:zoom-in}
.main-img svg{width:100%;height:100%;transition:transform .5s}
.main-img.zoom{cursor:zoom-out}
.main-img.zoom svg{transform:scale(1.7)}
.info{display:grid;gap:20px;align-content:start}
.info h1{font-size:clamp(32px,3.6vw,46px);letter-spacing:-.03em}
.price-row{display:flex;align-items:baseline;gap:12px}
.price-row b{font-family:var(--f-display);font-size:30px;font-weight:600}
.price-row s{color:var(--muted)}
.opt-h{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:10px}
.opt-h span{color:var(--muted);font-weight:500}
.sw-row{display:flex;gap:10px}
.sw-row .dot-sw{width:34px;height:34px}
.buy{display:flex;gap:10px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;height:52px}
.qty button{width:44px;height:100%;border:0;background:none;font-size:18px}
.qty input{width:40px;text-align:center;border:0;outline:none;font-weight:700;background:transparent}
.usp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.usp div{background:var(--soft);border-radius:16px;padding:12px;font-size:12.5px;display:grid;gap:6px}
.usp svg{color:var(--blue-deep)}
.eta{display:flex;gap:8px}
.eta .input{height:44px}
.dims{width:100%;border-collapse:collapse;font-size:14px}
.dims td{padding:8px 0;border-bottom:1px solid var(--line)}
.dims td:last-child{text-align:right;font-weight:600}
.sticky-buy{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 24px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;transform:translateY(110%);transition:transform .35s}
.sticky-buy.show{transform:none}
.sticky-buy .th{width:48px;height:48px;border-radius:12px;background:var(--soft);overflow:hidden;flex:none}
.sticky-buy .th svg{width:100%;height:100%}
.revs{display:grid;grid-template-columns:280px minmax(0,1fr);gap:40px}
@media (max-width:900px){.revs{grid-template-columns:1fr}}
.dist{display:grid;gap:6px;font-size:13px}
.dist div{display:grid;grid-template-columns:34px 1fr 30px;gap:8px;align-items:center}
.dist span.t{height:7px;border-radius:6px;background:var(--soft-2);overflow:hidden}
.dist span.t i{display:block;height:100%;background:var(--ink);border-radius:6px}
.rv{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.rv .top{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.rv b{font-size:15px}
.star-in{display:flex;gap:4px}
.star-in button{border:0;background:none;padding:2px;color:var(--line-2)}
.star-in button svg{width:24px;height:24px;fill:currentColor;stroke:none}
.star-in button.on{color:var(--mustard)}

/* cart drawer */
.ov{position:fixed;inset:0;background:rgba(20,20,20,.38);z-index:80;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:81;display:flex;flex-direction:column;animation:slideIn .32s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)}
.dr-h{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.dr-h h3{font-size:22px}
.dr-b{flex:1;overflow-y:auto;padding:18px 22px;display:grid;gap:16px;align-content:start}
.dr-f{border-top:1px solid var(--line);padding:18px 22px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.ship-bar{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:13px;display:grid;gap:8px}
.ship-bar .t{height:6px;border-radius:6px;background:#fff;overflow:hidden}
.ship-bar .t i{display:block;height:100%;background:var(--good);border-radius:6px;transition:width .5s}
.line{display:grid;grid-template-columns:84px 1fr;gap:14px}
.line .th{width:84px;height:84px;border-radius:16px;background:var(--soft);overflow:hidden}
.line .th svg{width:100%;height:100%}
.line .t1{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14.5px}
.line small{color:var(--muted);font-size:12.5px}
.line .ctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.qty.sm{height:34px}
.qty.sm button{width:32px;font-size:15px}
.qty.sm input{width:28px;font-size:13px}
.link{border:0;background:none;padding:0;font-size:12.5px;text-decoration:underline;color:var(--muted)}
.sum-row{display:flex;justify-content:space-between;font-size:14px}
.sum-row.total{font-size:17px;font-weight:700;font-family:var(--f-display)}
.promo{display:flex;gap:8px}
.promo .input{height:42px;border-radius:999px;text-transform:uppercase}

/* checkout */
.co{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;padding-block:30px 80px}
@media (max-width:900px){.co{grid-template-columns:1fr}.co-sum{order:-1}}
.steps{display:flex;gap:8px;font-size:13px;margin-bottom:26px;flex-wrap:wrap}
.steps span{display:flex;gap:8px;align-items:center;color:var(--faint);font-weight:600}
.steps span.on{color:var(--ink)}
.steps span.done{color:var(--good)}
.steps i{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:12px}
.co form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
@media (max-width:560px){.two,.three{grid-template-columns:1fr}}
.radio-card{display:flex;gap:12px;align-items:center;border:1px solid var(--line-2);border-radius:16px;padding:14px 16px;cursor:pointer}
.radio-card:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.radio-card input{accent-color:var(--ink)}
.radio-card div{flex:1}
.radio-card small{display:block;color:var(--muted);font-size:12.5px}
.co-sum{background:var(--soft);border-radius:24px;padding:24px;display:grid;gap:14px;align-content:start;position:sticky;top:90px}
.demo-note{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;background:#fff;border-radius:12px;padding:10px 12px}
.confirm{text-align:center;padding-block:70px 90px;display:grid;gap:18px;justify-items:center}
.confirm .ok{width:78px;height:78px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;animation:popIn .6s cubic-bezier(.3,1.5,.5,1)}
.confirm .ok svg{width:36px;height:36px;stroke-width:2.4}
@keyframes popIn{from{transform:scale(.3);opacity:0}}

/* story / stores / delivery */
.story-hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;padding-block:40px 60px}
@media (max-width:900px){.story-hero{grid-template-columns:1fr}}
.story-hero p{font-size:18px;color:var(--fg-2)}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:y}
@media (max-width:900px){.timeline{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.timeline{grid-template-columns:1fr}}
.timeline div{border-top:2px solid var(--ink);padding-top:16px;display:grid;gap:8px}
.timeline b{font-family:var(--f-display);font-size:34px;font-weight:600;letter-spacing:-.03em}
.timeline p{color:var(--muted);font-size:14px}
.mat{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.mat{grid-template-columns:1fr}}
.mat div{background:var(--soft);border-radius:22px;padding:24px;display:grid;gap:10px}
.mat .sw{height:120px;border-radius:14px}
.stores{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (max-width:800px){.stores{grid-template-columns:1fr}}
.store{background:var(--soft);border-radius:22px;padding:24px;display:grid;gap:12px}
.store .hrs{font-size:13px;color:var(--muted)}
.open{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#DFF1E6;color:var(--good);justify-self:start}
.open.closed{background:#F8E3E1;color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tbl-wrap{position:relative;overflow-x:auto}
.calc{background:var(--soft);border-radius:22px;padding:24px;display:grid;gap:14px}
.calc .res{background:#fff;border-radius:16px;padding:16px;font-size:14px}

/* modal, search, toast, badge */
.modal-ov{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:90;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{background:#fff;border-radius:26px;width:min(520px,100%);max-height:calc(100% - 32px);overflow-y:auto;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(880px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 4px}
.modal-h h3{font-size:24px}
.modal-b{padding:16px 24px 24px;display:grid;gap:14px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots button{height:40px;border-radius:12px;border:1px solid var(--line-2);background:#fff;font-size:13px;font-weight:600}
.slots button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.slots button[disabled]{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.film{position:relative;border-radius:18px;overflow:hidden;background:#EDEAE6;aspect-ratio:16/9}
.film svg{width:100%;height:100%;display:block}
.film .cap{position:absolute;left:18px;bottom:52px;right:18px;color:#fff;font-family:var(--f-display);font-size:clamp(18px,2.6vw,28px);font-weight:600;text-shadow:0 2px 14px rgba(0,0,0,.35);animation:rise .6s}
.film .ctl{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;display:flex;gap:12px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.film .ctl button{width:34px;height:34px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center}
.film .bar{flex:1;height:4px;background:rgba(255,255,255,.35);border-radius:4px;overflow:hidden}
.film .bar i{display:block;height:100%;background:#fff;width:0}
.film .t{color:#fff;font-size:12px;font-weight:600}
.search-ov{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:90;animation:fade .2s;overflow-y:auto}
.search-ov .wrap{padding-block:30px}
.search-ov input{width:100%;border:0;border-bottom:2px solid var(--ink);font-family:var(--f-display);font-size:clamp(26px,4vw,44px);padding:10px 0;outline:none;background:transparent}
.toasts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:999px;padding:10px 12px 10px 18px;font-size:13.5px;font-weight:500;display:flex;gap:12px;align-items:center;animation:rise .3s;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);pointer-events:auto}
.toast button{border:0;background:#fff;color:var(--ink);border-radius:999px;height:28px;padding:0 12px;font-size:12.5px;font-weight:700}
.demo-badge{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 12px;font-size:12px;box-shadow:0 10px 30px -14px rgba(0,0,0,.3)}
.demo-badge b{font-weight:700}
.demo-badge button{border:0;background:var(--soft);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.reveal{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.reveal.pre{transform:translateY(40px)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}}

/* ===== v2 editorial layout ===== */
:root{--sandbg:#F6F2EB;--sand-2:#EDE6DA;--terra:#C8704F}
.nav2 .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:78px;gap:16px}
.nav2 .links{justify-self:start}
.nav2 .logo{font-size:24px;letter-spacing:-.03em}
.ph{position:relative;overflow:hidden;background:var(--soft)}
.ph>svg,.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph>img{transition:transform 1.2s cubic-bezier(.2,.8,.2,1),opacity .4s}
.hero2{padding-top:12px}
.hero2 .frame{position:relative;border-radius:32px;overflow:hidden;height:min(78vh,720px);min-height:520px;background:#E9ECEE}
.hero2 .frame>.ph{position:absolute;inset:0}
.hero2 .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(10,14,20,.55));pointer-events:none}
.hero2 .copy{position:absolute;left:40px;bottom:40px;right:40px;z-index:3;color:#fff;display:grid;gap:18px;max-width:640px}
.hero2 h1{font-size:clamp(40px,6.4vw,84px);letter-spacing:-.045em;line-height:.98;font-weight:600;text-shadow:0 4px 30px rgba(0,0,0,.25)}
.hero2 h1 em{font-style:normal;font-weight:400;opacity:.92}
.hero2 .lead{font-size:17px;max-width:44ch;opacity:.9}
.hero2 .ctas{display:flex;gap:10px;flex-wrap:wrap}
.hero2 .btn.glass{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.55);color:#fff;backdrop-filter:blur(10px)}
.hero2 .btn.light{background:#fff;border-color:#fff;color:var(--ink)}
.hero2 .line{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:4;background:rgba(255,255,255,.25)}
.hero2 .line i{display:block;height:100%;background:#fff;width:0}
.hero2 .slides{position:absolute;top:22px;left:24px;z-index:4;display:flex;gap:6px}
.hero2 .slides button{height:32px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:rgba(20,20,20,.18);color:#fff;font-size:12.5px;font-weight:600;backdrop-filter:blur(8px)}
.hero2 .slides button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
.spot{position:absolute;z-index:3;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:0;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.spot::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
.spot i{width:10px;height:10px;border-radius:50%;background:var(--ink)}
@keyframes ping{75%,100%{transform:scale(1.6);opacity:0}}
.spot-card{position:absolute;z-index:5;width:250px;background:#fff;border-radius:18px;padding:10px;display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;box-shadow:0 20px 50px -18px rgba(0,0,0,.45);animation:rise .25s}
.spot-card .ph{width:70px;height:70px;border-radius:12px}
.spot-card b{display:block;font-size:14px}
.spot-card .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.side-card{position:absolute;right:24px;bottom:24px;z-index:4;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-radius:22px;padding:14px;width:260px;display:grid;gap:10px;color:var(--ink)}
.side-card .thumbs2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.side-card .thumbs2 a{aspect-ratio:1;border-radius:12px;display:block}
@media (max-width:900px){.side-card{display:none}.hero2 .copy{left:22px;right:22px;bottom:26px}.hero2 .frame{min-height:560px;border-radius:24px}}
.trust2{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-block:26px;border-bottom:1px solid var(--line)}
.trust2 div{display:flex;gap:12px;align-items:center;font-size:13.5px}
.trust2 svg{width:22px;height:22px;color:var(--blue-deep)}
.trust2 b{display:block;font-size:14px}
@media (max-width:900px){.trust2{grid-template-columns:1fr 1fr}}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(30px,4vw,50px);letter-spacing:-.035em;max-width:16ch}
.sec-h p{color:var(--muted);max-width:40ch}
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:900px){.rooms{grid-template-columns:1fr 1fr}}
.room{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:3/4;display:block;text-decoration:none;color:#fff}
.room .ph{position:absolute;inset:0}
.room:hover .ph>img,.room:hover .ph>svg{transform:scale(1.06)}
.room .ph>svg{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.room::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.55))}
.room .t{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;display:flex;justify-content:space-between;align-items:flex-end}
.room .t b{font-family:var(--f-display);font-size:24px;font-weight:600;display:block}
.room .t small{font-size:13px;opacity:.85}
.room .go2{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;transition:transform .3s}
.room:hover .go2{transform:rotate(-45deg)}
.carousel{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px}
.carousel::-webkit-scrollbar{display:none}
.carousel>.p2{flex:0 0 calc((100% - 60px)/4);scroll-snap-align:start}
@media (max-width:1000px){.carousel>.p2{flex-basis:calc((100% - 20px)/2)}}
@media (max-width:560px){.carousel>.p2{flex-basis:78%}}
.arrows{display:flex;gap:8px}
.arrows button{width:46px;height:46px;border-radius:50%;border:1px solid var(--ink);background:#fff;display:grid;place-items:center}
.arrows button:hover{background:var(--ink);color:#fff}
.p2{display:flex;flex-direction:column;gap:12px;position:relative}
.p2 .img{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/5;background:var(--soft);display:block}
.p2 .img .ph{position:absolute;inset:0;background:transparent}
.p2 .img .ph>svg{inset:6% 0 auto;height:88%}
.p2:hover .img .ph>img{transform:scale(1.05)}
.p2:hover .img .ph>svg{transform:translateY(-8px) scale(1.03)}
.p2 .img .ph>svg{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.p2 .quick{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;height:44px;border-radius:999px;border:0;background:#fff;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;transform:translateY(130%);transition:transform .35s cubic-bezier(.2,.8,.2,1),background .2s;box-shadow:0 10px 24px -12px rgba(0,0,0,.35)}
.p2:hover .quick,.p2 .quick:focus-visible{transform:none}
.p2 .quick.added{background:var(--good);color:#fff}
@media (hover:none){.p2 .quick{transform:none;height:38px;font-size:12.5px}}
.p2 .heart{position:absolute;top:12px;right:12px;z-index:2;background:#fff}
.p2 .tag{position:absolute;top:14px;left:14px;z-index:2;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff}
.p2 .tag.sale{background:var(--terra);color:#fff}
.p2 .meta{display:grid;gap:4px}
.p2 .meta .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.p2 .meta a{text-decoration:none;font-weight:600;font-size:15.5px}
.p2 .meta .pr{font-weight:600;white-space:nowrap}
.p2 .meta .pr s{color:var(--muted);font-weight:400;margin-right:6px;font-size:13px}
.p2 .meta .r2{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.p2 .dots{display:flex;gap:5px}
.p2 .dots i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.bento2{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:auto auto;gap:22px}
.bento2 .feat{grid-row:span 2;display:flex;flex-direction:column;gap:14px;position:relative}
.bento2 .feat .img{flex:1;min-height:420px;border-radius:26px;overflow:hidden;position:relative;background:var(--sand-2);display:block}
.bento2 .feat .img .ph{position:absolute;inset:0;background:transparent}
.bento2 .feat .over{position:absolute;left:20px;right:20px;bottom:20px;z-index:2;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bento2 .feat .over b{font-family:var(--f-display);font-size:22px;display:block}
@media (max-width:1000px){.bento2{grid-template-columns:1fr 1fr}.bento2 .feat{grid-column:span 2;grid-row:auto}}
@media (max-width:560px){.bento2{grid-template-columns:1fr}.bento2 .feat{grid-column:auto}}
.tabs2{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--soft);flex-wrap:wrap}
.tabs2 button{height:38px;padding:0 16px;border-radius:999px;border:0;background:transparent;font-weight:600;font-size:13.5px;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.story2{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
@media (max-width:900px){.story2{grid-template-columns:1fr}}
.story2 .stick{position:sticky;top:100px;border-radius:28px;overflow:hidden;aspect-ratio:4/5;background:var(--sand-2)}
@media (max-width:900px){.story2 .stick{position:relative;top:0;aspect-ratio:4/3}}
.story2 .stick .ph{position:absolute;inset:0}

 $$('[data-count]').forEach(el=>{if(el.getBoundingClientRect().top<innerHeight)return;const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){io.disconnect();const t=+el.dataset.count,suf=el.dataset.suf;const t1=performance.now();const step=now=>{const k=Math.min(1,(now-t1)/1100);el.textContent=Math.round(t*(1-Math.pow(1-k,3)))+suf;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}});io.observe(el)});
